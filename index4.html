<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Receitas</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body {
  background-color: #f8f9fa;
}

.dataTables_filter {
  display: none;
}

label {
  font-weight: 600;
  font-size: 0.72rem !important;
  color: #343a40;
  margin-bottom: 2px;
}

.form-select-sm,
table {
  font-size: 0.7rem !important;
}

table.dataTable td,
table.dataTable th {
  white-space: nowrap;
}

/* Paginação */
.dataTables_wrapper .dataTables_paginate {
  margin-top: 0.5rem;
  display: flex;
  justify-content: center;
  gap: 4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button {
  padding: 4px 8px !important;
  font-size: 0.65rem !important;
  border-radius: 6px !important;
  background-color: #e9ecef !important;
  border: 1px solid #dee2e6 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current {
  background-color: #0d6efd !important;
  color: #fff !important;
  font-weight: bold !important;
}

/* Botões exportação */
.export-group .btn {
  font-size: 0.7rem;
  padding: 4px 8px;
}

/* Atualização */
#indicadorAtualizacao {
  font-size: 0.65rem;
  color: #6c757d;
  text-align: right;
  margin-bottom: 8px;
}

/* Spinner */
.spinner-overlay {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 100vh;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  padding-top: 60px;

  z-index: 9999;

  background-color: rgba(255,255,255,0.9);
}

.spinner-border {
  width: 2rem;
  height: 2rem;
}

.spinner-text {
  font-size: 0.9rem;
  margin-top: 5px;
}

/* Registros por página */
#lengthSelectorContainer {
  font-size: 0.7rem;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

#lengthSelector {
  width: 80px;
  font-size: 0.7rem;
}

</style>
</head>

<body>

<!-- SPINNER -->
<div id="spinnerCsv" class="spinner-overlay">
  <div class="spinner-border text-primary"></div>
  <div class="spinner-text">
    Carregando base de dados...
  </div>
</div>

<div class="container-fluid mt-3">

<!-- ATUALIZAÇÃO -->
<div id="indicadorAtualizacao">
  Dados atualizados automaticamente
</div>

<!-- FILTROS -->
<div class="row gx-2 gy-2 mb-3">

  <div class="col-sm-2">
    <label>Ano *</label>

    <select id="anoFiltro" class="form-select form-select-sm">
      <option value="">Selecione...</option>
    </select>
  </div>

  <div class="col-sm-2">
    <label>Mês *</label>

    <select
      id="mesFiltro"
      class="form-select form-select-sm"
      disabled
    >
      <option value="">Selecione...</option>
    </select>
  </div>

</div>

<!-- BOTÕES -->
<div class="d-flex justify-content-between mb-2">

  <button
    id="btnLimpar"
    class="btn btn-outline-primary btn-sm"
  >
    Limpar Filtros
  </button>

  <div class="export-group btn-group">

    <button
      id="btnCsv"
      class="btn btn-outline-secondary btn-sm"
    >
      CSV
    </button>

    <button
      id="btnXlsx"
      class="btn btn-outline-secondary btn-sm"
    >
      XLSX
    </button>

    <button
      id="btnTxt"
      class="btn btn-outline-secondary btn-sm"
    >
      TXT
    </button>

    <button
      id="btnJson"
      class="btn btn-outline-secondary btn-sm"
    >
      JSON
    </button>

  </div>

</div>

<!-- REGISTROS -->
<div id="lengthSelectorContainer">

  <label>Registros por página:</label>

  <select
    id="lengthSelector"
    class="form-select form-select-sm"
  >
    <option value="10">10</option>
    <option value="25">25</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>

</div>

<!-- TABELA -->
<div class="table-responsive">

  <table
    id="tabela"
    class="table table-bordered table-striped table-sm w-100"
    style="display:none;"
  ></table>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela;
let dadosOriginais = [];

const meses = [
  "JANEIRO",
  "FEVEREIRO",
  "MARCO",
  "ABRIL",
  "MAIO",
  "JUNHO",
  "JULHO",
  "AGOSTO",
  "SETEMBRO",
  "OUTUBRO",
  "NOVEMBRO",
  "DEZEMBRO"
];

const urlCSV =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9iiIBNEZs9OFuuKDy8N-P6fBDuqxpEYObhYWoR7YDi4DxsHQ7fZEHXs91FYLxCJEJpoJBaEeVYt0t/pub?gid=1659253784&single=true&output=csv";

/* Nome exportação */
function gerarNomeArquivo(ext){

  let partes = ["dados-receitas"];

  const ano = $("#anoFiltro").val();
  const mes = $("#mesFiltro").val();

  if (ano) {
    partes.push(ano.toLowerCase());
  }

  if (mes) {
    partes.push(mes.toLowerCase());
  }

  return partes.join("-") + "." + ext;

}

/* CSV */
Papa.parse(urlCSV, {

  download: true,
  header: true,

  complete: function(results){

    dadosOriginais = results.data.filter(r => r.ANO);

    const anos = [
      ...new Set(dadosOriginais.map(r => r.ANO))
    ].sort();

    anos.forEach(ano => {

      $("#anoFiltro").append(
        `<option value="${ano}">${ano}</option>`
      );

    });

    $("#spinnerCsv").fadeOut(200);

  }

});

/* Ano */
$("#anoFiltro").on("change", function(){

  const ano = $(this).val();

  $("#mesFiltro")
    .prop("disabled", !ano)
    .val("");

  $("#tabela").hide();

  if (tabela) {
    tabela.clear().destroy();
    tabela = null;
  }

  $("#mesFiltro").html(
    '<option value="">Selecione...</option>'
  );

  if (ano){

    meses.forEach(m => {

      $("#mesFiltro").append(
        `<option value="${m}">
          ${m.charAt(0) + m.slice(1).toLowerCase()}
        </option>`
      );

    });

  }

});

/* Mês */
$("#mesFiltro").on("change", aplicarTudo);

/* Aplicar */
function aplicarTudo(){

  const ano = $("#anoFiltro").val();
  const mes = $("#mesFiltro").val();

  if (!ano || !mes){
    $("#tabela").hide();
    return;
  }

  const dadosFiltrados = dadosOriginais.filter(r =>
    r.ANO === ano && r[mes]
  );

  const dados = dadosFiltrados.map(d => {

    const base = {};

    for (const key in d){

      if (
        !meses.includes(key) &&
        key !== "VALOR"
      ){
        base[key] = d[key];
      }

    }

    return base;

  });

  renderTabela(dados);

}

/* Render tabela */
function renderTabela(dados){

  if (!dados.length){
    $("#tabela").hide();
    return;
  }

  $("#tabela").show();

  if (tabela){
    tabela.clear().rows.add(dados).draw();
    return;
  }

  tabela = $("#tabela").DataTable({

    data: dados,

    columns: Object.keys(dados[0]).map(c => ({
      title: c,
      data: c
    })),

    scrollX: true,
    scrollY: "55vh",
    scrollCollapse: true,

    paging: true,
    pageLength: 10,

    lengthChange: false,
    info: true,

    language: {
      url: "https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

  $("#lengthSelector").on("change", function(){
    tabela.page.len(this.value).draw();
  });

}

/* Limpar */
$("#btnLimpar").on("click", () => {

  $("#anoFiltro").val("");

  $("#mesFiltro")
    .val("")
    .prop("disabled", true)
    .html('<option value="">Selecione...</option>');

  if (tabela){
    tabela.clear().destroy();
    tabela = null;
  }

  $("#tabela").hide();

});

/* Download */
function baixarArquivo(blob, nome){

  let link = document.createElement("a");

  link.href = URL.createObjectURL(blob);

  link.download = nome;

  link.click();

}

/* CSV */
$("#btnCsv").on("click", () => {

  if (!tabela) return;

  let csv = Papa.unparse(
    tabela.rows({search:"applied"}).data().toArray(),
    {
      quotes: true,
      delimiter: ";"
    }
  );

  baixarArquivo(

    new Blob(
      ["\ufeff" + csv],
      {type:"text/csv;charset=utf-8;"}
    ),

    gerarNomeArquivo("csv")

  );

});

/* JSON */
$("#btnJson").on("click", () => {

  if (!tabela) return;

  let dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  baixarArquivo(

    new Blob(
      [JSON.stringify(dados, null, 2)],
      {type:"application/json"}
    ),

    gerarNomeArquivo("json")

  );

});

/* TXT */
$("#btnTxt").on("click", () => {

  if (!tabela) return;

  let dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  let txt = dados
    .map(o => Object.values(o).join(" | "))
    .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {type:"text/plain"}
    ),

    gerarNomeArquivo("txt")

  );

});

/* XLSX */
$("#btnXlsx").on("click", () => {

  if (!tabela) return;

  let dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  let ws = XLSX.utils.json_to_sheet(dados);

  let wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Receitas"
  );

  XLSX.writeFile(
    wb,
    gerarNomeArquivo("xlsx")
  );

});

</script>

</body>
</html>
