<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Despesas</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css"/>

<style>

body{
  background-color:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

.form-label,
.form-select-sm,
.form-control-sm,
.table th,
.table td{
  font-size:.65rem !important;
}

.xsmall{
  font-size:.6rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

/* Indicador atualização */
#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

/* Spinner */
.spinner-overlay,
.spinner-overlay-ano{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
}

.spinner-overlay{
  background-color:rgba(255,255,255,.9);
}

.spinner-overlay-ano{
  background-color:rgba(255,255,255,.5);
  z-index:9998;
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

/* Labels */
.row label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
  padding-left:2px;
}

/* Inputs */
.form-select-sm,
.form-control-sm{
  border-radius:4px !important;
  padding:2px 6px !important;
  background-color:#fff !important;
  border:1px solid #ced4da !important;
  font-size:.7rem !important;
}

/* Totalizadores */
.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  display:inline-block;
  margin-right:15px;
  font-weight:500;
}

/* Tabela */
.table-wrapper{
  overflow-x:auto;
}

/* Info tabela */
.dataTables_info{
  font-size:.65rem !important;
  color:#6c757d !important;
  margin-top:8px;
  padding-left:5px;
}

/* Paginação */
.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4px;
  padding:6px 0;
  font-size:.7rem;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  margin:0 2px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background-color:#e9ecef !important;
  border:1px solid #dee2e6 !important;
  color:#212529 !important;
  transition:background-color .2s ease;
}

.dataTables_wrapper .dataTables_paginate .paginate_button:hover{
  background-color:#d0d7df !important;
  color:#212529 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background-color:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

/* Botões exportação */
.btn-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

/* Registros página */
#lengthSelectorContainer{
  margin-top:10px;
  font-size:.75rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
}

#lengthSelector{
  width:70px;
  font-size:.75rem;
  padding:2px 4px;
}

</style>
</head>

<body>

<!-- SPINNER PRINCIPAL -->
<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<!-- SPINNER FILTROS -->
<div
  id="spinnerAno"
  class="spinner-overlay-ano"
  style="display:none;"
>

  <div class="spinner-border text-secondary"></div>

  <div class="spinner-text">
    Carregando filtros...
  </div>

</div>

<div class="container-fluid mt-3">

  <!-- ATUALIZAÇÃO -->
  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Ano *</label>
      <select id="anoFiltro" class="form-select form-select-sm"></select>
    </div>

    <div class="col-sm-2">
      <label>Mês</label>
      <select id="mesFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Unidade</label>
      <select id="unidadeFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Natureza</label>
      <select id="naturezaFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Classificação</label>
      <select id="classificacaoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Fonte</label>
      <select id="fonteFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Empenho</label>
      <select id="empenhoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>CPF/CNPJ</label>
      <select id="cpfFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Credor</label>
      <select id="credorFiltro" class="form-select form-select-sm" disabled></select>
    </div>

  </div>

  <!-- TOTALIZADORES -->
  <div
    class="totalizadores mb-2"
    id="resumoValores"
    style="display:none;"
  >

    <span id="totalEmpenhado">
      Empenhado: R$ 0,00
    </span>

    <span id="totalLiquidado">
      Liquidado: R$ 0,00
    </span>

    <span id="totalPago">
      Pago: R$ 0,00
    </span>

  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="btn-group">

      <button
        id="exportCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="exportXls"
        class="btn btn-outline-secondary btn-sm"
      >
        XLS
      </button>

      <button
        id="exportJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

      <button
        id="exportTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

    </div>

  </div>

  <!-- TABELA -->
  <div class="table-wrapper">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm xsmall w-100"
      style="display:none;"
    ></table>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label for="lengthSelector">
      Registros por página:
    </label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm d-inline-block"
    >
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTzWz42lwpuf2FwYofqSsAgtDayYLAYCblodcAjQvV-pYxFGengPlHWubJjyTP6_6jidIhpQcuLuvC7/pub?gid=501851609&single=true&output=csv";

const mesesOrdem = [
  "Janeiro",
  "Fevereiro",
  "Março",
  "Abril",
  "Maio",
  "Junho",
  "Julho",
  "Agosto",
  "Setembro",
  "Outubro",
  "Novembro",
  "Dezembro"
];

const campos = {
  ano:"Ano",
  mes:"Mês",
  unidade:"Unidade Orçamentária",
  natureza:"Natureza de Despesa",
  classificacao:"Classificação Orçamentária",
  fonte:"Fonte",
  empenho:"Empenho",
  cpf:"CPF/CNPJ",
  credor:"Credor"
};

const ordemFiltros = [
  "ano",
  "mes",
  "unidade",
  "natureza",
  "classificacao",
  "fonte",
  "empenho",
  "cpf",
  "credor"
];

/* =========================
   CARREGAR CSV
========================= */

$(document).ready(function(){

  Papa.parse(urlCSV,{

    download:true,
    header:true,

    complete:function(res){

      dadosOriginais = res.data.filter(
        r => r["Ano"]
      );

      /* Atualização */
      const linhaAtualizacao = dadosOriginais.find(
        x => x["Atualizacao"]
      );

      if(linhaAtualizacao){

        $("#indicadorAtualizacao").html(
          `Dados atualizados em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
        );

      }

      /* Remove coluna */
      dadosOriginais = dadosOriginais.map(r=>{

        const copia = {...r};

        delete copia["Atualizacao"];

        return copia;

      });

      popularFiltroEncadeado(
        "anoFiltro",
        campos.ano,
        dadosOriginais
      );

      $("#spinnerCsv").fadeOut(200);

      inicializarEventos();

    }

  });

});

/* =========================
   EVENTOS
========================= */

function inicializarEventos(){

  ordemFiltros.forEach(f=>{

    $("#"+f+"Filtro").on("change",()=>{

      resetFiltrosApos(f);

      $("#spinnerAno").show();

      setTimeout(()=>{

        atualizarFiltrosEncadeados(f);

        const dados = aplicarFiltroEncadeado();

        inicializarTabela(dados);

        $("#spinnerAno").hide();

      },100);

    });

  });

  $("#btnLimpar").on("click",()=>{

    ordemFiltros.forEach(f=>{

      $("#"+f+"Filtro")
        .val("")
        .prop("disabled",f !== "ano");

    });

    $("#tabela")
      .hide()
      .empty();

    $("#resumoValores").hide();

    if(tabela){

      tabela.destroy();

      tabela = null;

    }

  });

  $("#lengthSelector").on("change",function(){

    if(tabela){

      tabela
        .page
        .len(parseInt(this.value))
        .draw();

    }

  });

  $("#exportCsv").on("click",()=>$(".buttons-csv").click());

  $("#exportXls").on("click",()=>$(".buttons-excel").click());

  $("#exportJson").on("click",exportarJson);

  $("#exportTxt").on("click",exportarTxt);

}

/* =========================
   FILTROS
========================= */

function popularFiltroEncadeado(id,campo,dados){

  const s = $("#"+id);

  s.empty();

  s.append(`
    <option value="">
      Todos
    </option>
  `);

  let valores = [
    ...new Set(
      dados
        .map(r=>r[campo])
        .filter(v=>v)
    )
  ];

  if(campo === "Mês"){

    valores.sort(
      (a,b)=>
      mesesOrdem.indexOf(a) -
      mesesOrdem.indexOf(b)
    );

  }else{

    valores.sort();

  }

  valores.forEach(v=>{

    s.append(`
      <option value="${v}">
        ${v}
      </option>
    `);

  });

  s.prop("disabled",false);

}

function resetFiltrosApos(filtro){

  ordemFiltros
    .slice(ordemFiltros.indexOf(filtro)+1)
    .forEach(f=>{

      $("#"+f+"Filtro")
        .val("")
        .prop("disabled",true);

    });

}

function aplicarFiltroAteOrdem(idx){

  return ordemFiltros
    .slice(0,idx+1)
    .reduce((acc,f)=>{

      const valor =
        $("#"+f+"Filtro").val();

      return valor
        ? acc.filter(
            r => r[campos[f]] === valor
          )
        : acc;

    },dadosOriginais);

}

function atualizarFiltrosEncadeados(filtro){

  const idx =
    ordemFiltros.indexOf(filtro);

  const base =
    aplicarFiltroAteOrdem(idx);

  ordemFiltros
    .slice(idx+1)
    .forEach(f=>{

      popularFiltroEncadeado(
        f+"Filtro",
        campos[f],
        base
      );

    });

}

function aplicarFiltroEncadeado(){

  return ordemFiltros.reduce((acc,f)=>{

    const valor =
      $("#"+f+"Filtro").val();

    return valor
      ? acc.filter(
          r => r[campos[f]] === valor
        )
      : acc;

  },dadosOriginais);

}

/* =========================
   TABELA
========================= */

function inicializarTabela(dados){

  if(!dados.length){

    $("#tabela")
      .hide()
      .empty();

    $("#resumoValores").hide();

    if(tabela){

      tabela.destroy();

      tabela = null;

    }

    return;

  }

  $("#tabela").show();

  const pageLength =
    parseInt(
      $("#lengthSelector").val()
    ) || 10;

  if(tabela){

    tabela.destroy();

    $("#tabela").empty();

  }

  const colunas =
    Object.keys(dados[0]).map(c=>({

      title:c,

      data:c,

      render:
        typeof dados[0][c] === "string" &&
        dados[0][c].includes("R$")
        ? $.fn.dataTable.render.number(
            ".",
            ",",
            2,
            "R$ "
          )
        : null

    }));

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:colunas,

    destroy:true,

    pageLength:pageLength,

    searching:true,

    ordering:true,

    autoWidth:false,

    scrollX:true,

    dom:"Bfrtip",

    buttons:[
      {
        extend:"csvHtml5",
        className:"d-none"
      },
      {
        extend:"excelHtml5",
        className:"d-none"
      }
    ],

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

  atualizarResumo(dados);

}

/* =========================
   RESUMO
========================= */

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();

    return;

  }

  let totalEmp = 0;
  let totalLiq = 0;
  let totalPag = 0;

  function parseMoeda(valor){

    if(!valor) return 0;

    return parseFloat(

      valor
        .replace(/[^\d,-]/g,"")
        .replace(/\./g,"")
        .replace(",", ".")

    ) || 0;

  }

  dados.forEach(r=>{

    totalEmp += parseMoeda(
      r["Valor Empenhado"]
    );

    totalLiq += parseMoeda(
      r["Valor Liquidado"]
    );

    totalPag += parseMoeda(
      r["Valor Pago"]
    );

  });

  $("#totalEmpenhado").text(
    "Empenhado: " +
    totalEmp.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )
  );

  $("#totalLiquidado").text(
    "Liquidado: " +
    totalLiq.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )
  );

  $("#totalPago").text(
    "Pago: " +
    totalPag.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )
  );

  $("#resumoValores").show();

}

/* =========================
   EXPORTAÇÕES
========================= */

function exportarJson(){

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  baixarArquivo(

    new Blob(
      [JSON.stringify(dados,null,2)],
      {
        type:"application/json"
      }
    ),

    "dados.json"

  );

}

function exportarTxt(){

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  if(!dados.length) return;

  const colunas =
    Object.keys(dados[0]);

  const txt =
    colunas.join(";") +
    "\n" +
    dados
      .map(l=>
        colunas
          .map(c=>l[c])
          .join(";")
      )
      .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    "dados.txt"

  );

}

function baixarArquivo(blob,nome){

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download = nome;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

}

</script>

</body>
</html>
