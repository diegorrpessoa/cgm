<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Despesas</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css"/>

<style>

body{
  background-color:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

.form-label,
.form-select-sm,
.form-control-sm,
.table th,
.table td{
  font-size:.65rem !important;
}

.xsmall{
  font-size:.6rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

/* Atualização */
#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

/* Spinner */
.spinner-overlay,
.spinner-overlay-ano{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
}

.spinner-overlay{
  background-color:rgba(255,255,255,.9);
}

.spinner-overlay-ano{
  background-color:rgba(255,255,255,.5);
  z-index:9998;
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

/* Labels */
.row label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
  padding-left:2px;
}

/* Inputs */
.form-select-sm,
.form-control-sm{
  border-radius:4px !important;
  padding:2px 6px !important;
  background-color:#fff !important;
  border:1px solid #ced4da !important;
  font-size:.7rem !important;
}

/* Totalizadores */
.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  display:inline-block;
  margin-right:15px;
  font-weight:500;
}

/* Tabela */
.table-wrapper{
  overflow-x:auto;
}

/* Info tabela */
.dataTables_info{
  font-size:.65rem !important;
  color:#6c757d !important;
  margin-top:8px;
  padding-left:5px;
}

/* Paginação */
.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4px;
  padding:6px 0;
  font-size:.7rem;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  margin:0 2px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background-color:#e9ecef !important;
  border:1px solid #dee2e6 !important;
  color:#212529 !important;
  transition:background-color .2s ease;
}

.dataTables_wrapper .dataTables_paginate .paginate_button:hover{
  background-color:#d0d7df !important;
  color:#212529 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background-color:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

/* Botões */
.btn-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

/* Registros */
#lengthSelectorContainer{
  margin-top:10px;
  font-size:.75rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
}

#lengthSelector{
  width:70px;
  font-size:.75rem;
  padding:2px 4px;
}

</style>
</head>

<body>

<!-- SPINNER -->
<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<!-- SPINNER FILTROS -->
<div
  id="spinnerAno"
  class="spinner-overlay-ano"
  style="display:none;"
>

  <div class="spinner-border text-secondary"></div>

  <div class="spinner-text">
    Carregando filtros...
  </div>

</div>

<div class="container-fluid mt-3">

  <!-- ATUALIZAÇÃO -->
  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Ano *</label>
      <select id="anoFiltro" class="form-select form-select-sm"></select>
    </div>

    <div class="col-sm-2">
      <label>Mês</label>
      <select id="mesFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Unidade</label>
      <select id="unidadeFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Natureza</label>
      <select id="naturezaFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Classificação</label>
      <select id="classificacaoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Fonte</label>
      <select id="fonteFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Empenho</label>
      <select id="empenhoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>CPF/CNPJ</label>
      <select id="cpfFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Credor</label>
      <select id="credorFiltro" class="form-select form-select-sm" disabled></select>
    </div>

  </div>

  <!-- TOTALIZADORES -->
  <div
    class="totalizadores mb-2"
    id="resumoValores"
    style="display:none;"
  >

    <span id="totalEmpenhado">
      Empenhado: R$ 0,00
    </span>

    <span id="totalLiquidado">
      Liquidado: R$ 0,00
    </span>

    <span id="totalPago">
      Pago: R$ 0,00
    </span>

  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="btn-group">

      <button
        id="exportCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="exportXls"
        class="btn btn-outline-secondary btn-sm"
      >
        XLSX
      </button>

      <button
        id="exportJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

      <button
        id="exportTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

    </div>

  </div>

  <!-- TABELA -->
  <div class="table-wrapper">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm xsmall w-100"
      style="display:none;"
    ></table>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label for="lengthSelector">
      Registros por página:
    </label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm d-inline-block"
    >
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;
let dadosOriginais = [];
let dadosFiltrados = [];

const cacheFiltros = {};

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTzWz42lwpuf2FwYofqSsAgtDayYLAYCblodcAjQvV-pYxFGengPlHWubJjyTP6_6jidIhpQcuLuvC7/pub?gid=501851609&single=true&output=csv";

const mesesOrdem = [
  "Janeiro","Fevereiro","Março","Abril",
  "Maio","Junho","Julho","Agosto",
  "Setembro","Outubro","Novembro","Dezembro"
];

const campos = {
  ano:"Ano",
  mes:"Mês",
  unidade:"Unidade Orçamentária",
  natureza:"Natureza de Despesa",
  classificacao:"Classificação Orçamentária",
  fonte:"Fonte",
  empenho:"Empenho",
  cpf:"CPF/CNPJ",
  credor:"Credor"
};

const ordemFiltros = [
  "ano",
  "mes",
  "unidade",
  "natureza",
  "classificacao",
  "fonte",
  "empenho",
  "cpf",
  "credor"
];

/* =========================
   CARREGAMENTO ULTRA RÁPIDO
========================= */

$(document).ready(() => {

  Papa.parse(urlCSV, {

    download: true,
    header: true,
    worker: true,
    fastMode: true,
    skipEmptyLines: true,

    complete: ({ data }) => {

      dadosOriginais = data.filter(r => r["Ano"]);

      const linhaAtualizacao =
        dadosOriginais.find(
          r => r["Atualizacao"]
        );

      if(linhaAtualizacao){

        $("#indicadorAtualizacao").html(
          `Dados atualizados em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
        );

      }

      dadosOriginais = dadosOriginais.map(r => {

        delete r["Atualizacao"];

        return r;

      });

      popularFiltro(
        "anoFiltro",
        campos.ano,
        dadosOriginais
      );

      inicializarEventos();

      $("#spinnerCsv").fadeOut(150);

    }

  });

});

/* =========================
   EVENTOS
========================= */

function inicializarEventos(){

  ordemFiltros.forEach(f => {

    $("#"+f+"Filtro").on("change", () => {

      atualizarFiltros(f);

      aplicarFiltros();

    });

  });

  $("#lengthSelector").on("change", function(){

    if(tabela){

      tabela.page.len(
        parseInt(this.value)
      ).draw(false);

    }

  });

  $("#btnLimpar").on("click", limparFiltros);

  $("#exportCsv").on(
    "click",
    ()=>$(".buttons-csv").click()
  );

  $("#exportXls").on(
    "click",
    ()=>$(".buttons-excel").click()
  );

  $("#exportJson").on(
    "click",
    exportarJson
  );

  $("#exportTxt").on(
    "click",
    exportarTxt
  );

}

/* =========================
   FILTROS OTIMIZADOS
========================= */

function popularFiltro(id,campo,dados){

  const select = $("#"+id);

  const valores = [...new Set(
    dados
      .map(r => r[campo])
      .filter(Boolean)
  )];

  if(campo === "Mês"){

    valores.sort(
      (a,b)=>
      mesesOrdem.indexOf(a) -
      mesesOrdem.indexOf(b)
    );

  }else{

    valores.sort();

  }

  let html = `
    <option value="">
      Todos
    </option>
  `;

  valores.forEach(v => {

    html += `
      <option value="${v}">
        ${v}
      </option>
    `;

  });

  select.html(html);

  select.prop("disabled", false);

}

function atualizarFiltros(filtroAtual){

  const idx =
    ordemFiltros.indexOf(filtroAtual);

  let base = dadosOriginais;

  for(let i=0;i<=idx;i++){

    const f = ordemFiltros[i];

    const valor =
      $("#"+f+"Filtro").val();

    if(valor){

      base = base.filter(
        r => r[campos[f]] === valor
      );

    }

  }

  ordemFiltros
    .slice(idx+1)
    .forEach(f => {

      popularFiltro(
        f+"Filtro",
        campos[f],
        base
      );

    });

}

/* =========================
   FILTRAGEM RÁPIDA
========================= */

function aplicarFiltros(){

  $("#spinnerAno").show();

  requestAnimationFrame(() => {

    dadosFiltrados = dadosOriginais.filter(r => {

      for(const f of ordemFiltros){

        const valor =
          $("#"+f+"Filtro").val();

        if(
          valor &&
          r[campos[f]] !== valor
        ){

          return false;

        }

      }

      return true;

    });

    renderTabela(dadosFiltrados);

    atualizarResumo(dadosFiltrados);

    $("#spinnerAno").hide();

  });

}

/* =========================
   DATATABLE ULTRA OTIMIZADO
========================= */

function renderTabela(dados){

  if(!dados.length){

    $("#tabela").hide();

    $("#resumoValores").hide();

    if(tabela){

      tabela.clear().draw();

    }

    return;

  }

  $("#tabela").show();

  const colunas = Object.keys(
    dados[0]
  ).map(c => ({
    title:c,
    data:c
  }));

  if(tabela){

    tabela.clear();

    tabela.rows.add(dados);

    tabela.draw(false);

    return;

  }

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:colunas,

    deferRender:true,
    processing:true,

    searching:true,
    ordering:true,

    pageLength:parseInt(
      $("#lengthSelector").val()
    ) || 10,

    autoWidth:false,

    scrollX:true,

    lengthChange:false,

    dom:"Bfrtip",

    buttons:[

      {
        extend:"csvHtml5",
        className:"d-none",
        filename:()=>
          gerarNomeArquivo("csv")
            .replace(".csv","")
      },

      {
        extend:"excelHtml5",
        className:"d-none",
        filename:()=>
          gerarNomeArquivo("xlsx")
            .replace(".xlsx","")
      }

    ],

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

}

/* =========================
   RESUMO
========================= */

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();

    return;

  }

  let totalEmp = 0;
  let totalLiq = 0;
  let totalPag = 0;

  for(const r of dados){

    totalEmp += moeda(
      r["Valor Empenhado"]
    );

    totalLiq += moeda(
      r["Valor Liquidado"]
    );

    totalPag += moeda(
      r["Valor Pago"]
    );

  }

  $("#totalEmpenhado").text(
    "Empenhado: " +
    totalEmp.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )
  );

  $("#totalLiquidado").text(
    "Liquidado: " +
    totalLiq.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )
  );

  $("#totalPago").text(
    "Pago: " +
    totalPag.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )
  );

  $("#resumoValores").show();

}

function moeda(v){

  if(!v) return 0;

  return parseFloat(
    v
      .replace(/[^\d,-]/g,"")
      .replace(/\./g,"")
      .replace(",",".")
  ) || 0;

}

/* =========================
   LIMPAR
========================= */

function limparFiltros(){

  ordemFiltros.forEach((f,i)=>{

    $("#"+f+"Filtro")
      .val("")
      .prop("disabled",i !== 0);

  });

  $("#tabela").hide();

  $("#resumoValores").hide();

  if(tabela){

    tabela.clear().draw();

  }

}

/* =========================
   EXPORTAÇÃO
========================= */

function gerarNomeArquivo(ext){

  let partes = ["dados-despesas"];

  ordemFiltros.forEach(f=>{

    const valor =
      $("#"+f+"Filtro").val();

    if(valor){

      partes.push(

        valor
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/\s+/g,"-")
          .replace(/[^\w-]/g,"")

      );

    }

  });

  return partes.join("-")+"."+ext;

}

function exportarJson(){

  if(!tabela) return;

  const dados =
    tabela.rows({search:"applied"})
    .data()
    .toArray();

  baixarArquivo(

    new Blob(
      [JSON.stringify(dados,null,2)],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

}

function exportarTxt(){

  if(!tabela) return;

  const dados =
    tabela.rows({search:"applied"})
    .data()
    .toArray();

  if(!dados.length) return;

  const colunas =
    Object.keys(dados[0]);

  const txt =
    colunas.join(";") +
    "\n" +
    dados
      .map(l =>
        colunas
          .map(c => l[c])
          .join(";")
      )
      .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

}

/* =========================
   DOWNLOAD
========================= */

function baixarArquivo(blob,nome){

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download = nome;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

}

</script>

</body>
</html>
