<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel de Emendas - IN 05/2025 - TCE/MG</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>
body{background:#f8f9fa;}
.dataTables_filter{display:none}

label{
  font-size:.7rem;
  font-weight:600;
  color:#343a40;
}

.form-select-sm,table{
  font-size:.7rem!important;
}

table.dataTable td,table.dataTable th{
  white-space:nowrap;
}

#tabela{display:none}

.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}
</style>
</head>

<body>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
  Dados atualizados automaticamente em...
</div>

<!-- FILTRO -->
<div class="row gx-2 gy-2 mb-3">
  <div class="col-sm-2">
    <label>Ano *</label>
    <select id="anoFiltro" class="form-select form-select-sm"></select>
  </div>
</div>

<!-- EXPORTAÇÃO -->
<div class="d-flex justify-content-end mb-2 export-group">
  <button id="btnPdf" class="btn btn-outline-secondary btn-sm">PDF</button>
</div>

<!-- TABELA -->
<div class="table-responsive">
  <table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>

</div>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<!-- PDFMAKE -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<!-- CSV -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
let tabela;
let dadosOriginais=[];

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

/* 🔥 CARREGAR CSV */
Papa.parse(urlCSV,{
 download:true,
 header:true,
 complete:r=>{

   dadosOriginais=r.data.filter(d=>d["Ano"]);

   let linhaAtualizacao=r.data.find(x=>x["Atualizacao"]);
   if(linhaAtualizacao){
     $("#indicadorAtualizacao").html(
       `Dados atualizados automaticamente em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
     );
   }

   dadosOriginais=dadosOriginais.map(r=>{
     let copia={...r};
     delete copia["Atualizacao"];
     return copia;
   });

   carregarAno();
 }
});

/* 🔥 POPULAR ANO */
function carregarAno(){
 let s=$("#anoFiltro");
 s.empty().append('<option value="">Selecione...</option>');

 [...new Set(dadosOriginais.map(r=>r["Ano"]))]
   .sort()
   .forEach(v=>s.append(`<option>${v}</option>`));
}

/* 🔥 EVENTO */
$("#anoFiltro").on("change",function(){

 let ano=this.value;
 if(!ano) return;

 let base=dadosOriginais.filter(r=>r["Ano"]===ano);

 renderTabela(base);
});

/* 🔥 RENDER */
function renderTabela(dados){

 $("#tabela").show();

 if(tabela){
   tabela.clear().rows.add(dados).draw();
   return;
 }

 tabela=$("#tabela").DataTable({
   data:dados,

   columns:Object.keys(dados[0]).map(c=>({
     title:c,
     data:c
   })),

   pageLength:10,
   scrollX:true,

   language:{
     url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
   }
 });
}

/* ======================================================
   ✅ EXPORTAÇÃO PDF ABSOLUTA (TODAS AS COLUNAS)
====================================================== */
$("#btnPdf").on("click",function(){

 if(!tabela){
   alert("Tabela ainda não carregada.");
   return;
 }

 /* 🔥 PEGAR SOMENTE O QUE ESTÁ VISÍVEL NA TELA */
 let dadosVisiveis = tabela.rows({search:"applied"}).data().toArray();

 if(dadosVisiveis.length===0){
   alert("Nenhum dado disponível para exportar.");
   return;
 }

 /* 🔥 PEGAR TODAS AS COLUNAS DA TABELA */
 let colunas = tabela.settings()[0].aoColumns.map(c=>c.sTitle);

 /* 🔥 MONTA CABEÇALHO */
 let body = [];

 body.push(
   colunas.map(c=>({
     text:c,
     style:"cabecalho",
     noWrap:false
   }))
 );

 /* 🔥 LINHAS */
 dadosVisiveis.forEach(linha=>{

   body.push(
     colunas.map(col=>({
       text: linha[col] ? linha[col].toString() : "",
       style:"celula",
       noWrap:false
     }))
   );

 });

 /* 🔥 TAMANHO DINÂMICO DA FONTE */
 let fonte = colunas.length > 12 ? 5 : 7;

 /* 🔥 PDF FINAL */
 let docDefinition={

   pageSize:"A4",
   pageOrientation:"landscape",
   pageMargins:[8,25,8,20],

   footer:function(currentPage,pageCount){
     return {
       text:`Página ${currentPage} de ${pageCount}`,
       alignment:"right",
       margin:[0,0,15,5],
       fontSize:8,
       color:"gray"
     };
   },

   content:[

     {text:"Painel de Emendas – IN 05/2025 – TCE/MG",
      style:"titulo"},

     {text:$("#indicadorAtualizacao").text(),
      style:"subtitulo"},

     {
       table:{
         headerRows:1,

         /* ✅ TODAS AS COLUNAS SEM CORTAR */
         widths:Array(colunas.length).fill("*"),

         body:body
       },

       layout:"lightHorizontalLines"
     }
   ],

   styles:{

     titulo:{
       fontSize:11,
       bold:true,
       margin:[0,0,0,4]
     },

     subtitulo:{
       fontSize:8,
       color:"gray",
       margin:[0,0,0,6]
     },

     cabecalho:{
       fontSize:fonte,
       bold:true,
       fillColor:"#e9ecef",
       alignment:"center"
     },

     celula:{
       fontSize:fonte,
       margin:[0,2,0,2]
     }
   }
 };

 pdfMake.createPdf(docDefinition)
        .download("painel_emendas_completo.pdf");

});
</script>

</body>
</html>
