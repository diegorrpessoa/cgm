<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel de Emendas - IN 05/2025 - TCE/MG</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"/>

<style>
body{background:#f8f9fa;}
.dataTables_filter{display:none}

label{
  font-size:.7rem;
  font-weight:600;
  color:#343a40;
}

.form-select-sm,table{
  font-size:.7rem!important;
}

table.dataTable td,table.dataTable th{
  white-space:nowrap;
}

#tabela{display:none}

.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px!important;
  font-size:.65rem!important;
  border-radius:6px!important;
  background:#e9ecef!important;
  border:1px solid #dee2e6!important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd!important;
  color:#fff!important;
  font-weight:bold;
}

.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

#lengthSelector{
  width:70px;
  font-size:.7rem;
}

#indicadorAtualizacao{
  font-size:.65rem;
  color:rgba(0,0,0,0.7);
  text-align:right;
  margin-bottom:8px;
}

/* Spinner */
#spinnerLoading{
  display:none;
  position:fixed;
  top:15px;
  left:15px;
  z-index:9999;
}

/* Toast */
#toastAtualizado{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:9999;
}

/* Select2 sem mudar layout */
.select2-container .select2-selection--single{
  height:30px!important;
  font-size:.7rem!important;
}
.select2-selection__rendered{
  line-height:28px!important;
}
.select2-selection__arrow{
  height:28px!important;
}
</style>
</head>

<body>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
  Última atualização: carregando...
</div>

<!-- Spinner -->
<div id="spinnerLoading">
  <div class="spinner-border spinner-border-sm text-primary"></div>
</div>

<!-- Toast -->
<div id="toastAtualizado" class="toast align-items-center text-bg-success border-0">
  <div class="d-flex">
    <div class="toast-body">
      Base atualizada automaticamente ✔
    </div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
  </div>
</div>

<!-- FILTROS -->
<div class="row gx-2 gy-2 mb-3">

  <div class="col-sm-2"><label>Ano *</label>
    <select id="anoFiltro" class="form-select form-select-sm"></select>
  </div>

  <div class="col-sm-2"><label>Origem</label>
    <select id="origemFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Tipo</label>
    <select id="tipoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Autoria</label>
    <select id="autoriaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Número</label>
    <select id="numeroFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Objeto</label>
    <select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Recebedor</label>
    <select id="recebedorFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>CNPJ</label>
    <select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Natureza</label>
    <select id="naturezaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Função</label>
    <select id="funcaoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

</div>

<!-- LIMPAR -->
<div class="d-flex justify-content-end mb-2">
  <button id="btnLimpar" class="btn btn-outline-primary btn-sm">
    Limpar Filtros
  </button>
</div>

<!-- EXPORTAÇÃO -->
<div class="d-flex justify-content-between align-items-center mb-2">

  <div>
    <label class="me-1">Registros por página:</label>
    <select id="lengthSelector" class="form-select form-select-sm d-inline-block">
      <option>10</option>
      <option>25</option>
      <option>50</option>
      <option>100</option>
    </select>
  </div>

  <div class="export-group">
    <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnXls" class="btn btn-outline-secondary btn-sm">XLS</button>
    <button id="btnPdf" class="btn btn-outline-secondary btn-sm">PDF</button>
    <button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
  </div>

</div>

<!-- TABELA -->
<div class="table-responsive">
  <table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>

</div>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
let tabela;
let dadosOriginais=[];
let ultimaAtualizacao="";
let hashBase="";
let paginaAtual=0;

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

const campos={
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda",
  autoria:"Proponente",
  numero:"Identificação da Emenda",
  objeto:"Objeto da Despesa",
  recebedor:"Órgão ou entidade executora ou beneficiária",
  cnpj:"CNPJ do Órgão ou entidade executora ou beneficiária",
  natureza:"Grupo de Natureza de Despesa (GND)",
  funcao:"Função de Governo Função programática"
};

const ordem=Object.keys(campos);

function mostrarSpinner(){ $("#spinnerLoading").fadeIn(100); }
function esconderSpinner(){ $("#spinnerLoading").fadeOut(200); }

function mostrarToast(){
  let toast=new bootstrap.Toast(document.getElementById("toastAtualizado"));
  toast.show();
}

function salvarFiltros(){
  let obj={};
  ordem.forEach(f=>{
    obj[f]=$("#"+f+"Filtro").val();
  });
  return obj;
}

function restaurarFiltros(valores){
  ordem.forEach(f=>{
    if(valores[f]){
      $("#"+f+"Filtro").val(valores[f]).trigger("change.select2");
    }
  });
}

function gerarHashBase(csv){
  return btoa(unescape(encodeURIComponent(csv))).substring(0,50);
}

/* CARREGAMENTO INTELIGENTE */
function carregarCSV(){

  let filtrosSalvos=salvarFiltros();
  let scrollPos=window.scrollY;

  if(tabela){
    paginaAtual=tabela.page();
  }

  mostrarSpinner();

  Papa.parse(urlCSV,{
    download:true,
    header:true,
    complete:r=>{

      let csvString=JSON.stringify(r.data);
      let novoHash=gerarHashBase(csvString);

      if(novoHash===hashBase){
        esconderSpinner();
        return;
      }

      hashBase=novoHash;

      dadosOriginais=r.data.filter(d=>d[campos.ano]);

      let linhaAtualizacao=r.data.find(x=>x["Atualizacao"]);
      if(linhaAtualizacao){
        ultimaAtualizacao=linhaAtualizacao["Atualizacao"];
        $("#indicadorAtualizacao").html(
          `Última atualização: <b>${ultimaAtualizacao}</b>`
        );
      }

      dadosOriginais=dadosOriginais.map(r=>{
        let copia={...r};
        delete copia["Atualizacao"];
        return copia;
      });

      carregarAno();
      atualizarFiltros(dadosOriginais);

      restaurarFiltros(filtrosSalvos);

      aplicarFiltros();

      esconderSpinner();
      mostrarToast();

      setTimeout(()=>{
        window.scrollTo(0,scrollPos);
      },50);

    }
  });
}

/* ANO */
function carregarAno(){
  let s=$("#anoFiltro");
  s.empty().append('<option value="">Selecione...</option>');
  s.append('<option value="__todos__">Todos</option>');

  [...new Set(dadosOriginais.map(r=>r[campos.ano]))]
    .sort()
    .forEach(v=>s.append(`<option>${v}</option>`));
}

/* FILTROS ENCADEADOS */
function atualizarFiltros(base){

  ordem.slice(1).forEach(f=>{

    let seletor=$("#"+f+"Filtro");
    let valores=[...new Set(base.map(r=>r[campos[f]]).filter(Boolean))].sort();

    seletor.empty().append('<option value="">Selecione...</option>');
    valores.forEach(v=>seletor.append(`<option>${v}</option>`));

    seletor.prop("disabled",valores.length===0);
  });

  $("select").select2({width:"100%"});
}

function aplicarFiltros(){

  let ano=$("#anoFiltro").val();
  if(!ano) return;

  let base=dadosOriginais;

  if(ano!=="__todos__"){
    base=base.filter(r=>r[campos.ano]===ano);
  }

  ordem.slice(1).forEach(f=>{
    let v=$("#"+f+"Filtro").val();
    if(v){
      base=base.filter(r=>r[campos[f]]===v);
    }
  });

  renderTabela(base);
}

/* TABELA */
function renderTabela(dados){

  $("#tabela").show();

  if(tabela){
    tabela.clear().rows.add(dados).draw(false);
    tabela.page(paginaAtual).draw(false);
    return;
  }

  tabela=$("#tabela").DataTable({
    data:dados,
    columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
    pageLength:10,
    scrollX:true,
    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }
  });

  $("#lengthSelector").on("change",function(){
    tabela.page.len(this.value).draw();
  });
}

/* EXPORTAÇÃO */
function baixarArquivo(conteudo,nome,tipo){
  let blob=new Blob([conteudo],{type:tipo});
  let link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download=nome;
  link.click();
}

$("#btnCsv").on("click",()=>{
  baixarArquivo(Papa.unparse(tabela.rows().data().toArray()),"dados.csv","text/csv");
});

$("#btnJson").on("click",()=>{
  baixarArquivo(JSON.stringify(tabela.rows().data().toArray(),null,2),"dados.json","application/json");
});

$("#btnTxt").on("click",()=>{
  let txt=tabela.rows().data().toArray().map(o=>Object.values(o).join(" | ")).join("\n");
  baixarArquivo(txt,"dados.txt","text/plain");
});

$("#btnXls").on("click",()=>{
  let ws=XLSX.utils.json_to_sheet(tabela.rows().data().toArray());
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Emendas");
  XLSX.writeFile(wb,"dados.xlsx");
});

$("#btnPdf").on("click",()=>{
  alert("PDF completo formatado exige biblioteca avançada (posso implementar na próxima versão).");
});

/* EVENTOS */
$("#anoFiltro").on("change",aplicarFiltros);
ordem.slice(1).forEach(f=>{
  $("#"+f+"Filtro").on("change",aplicarFiltros);
});

$("#btnLimpar").on("click",()=>{
  location.reload();
});

/* AUTOREFRESH */
carregarCSV();
setInterval(carregarCSV,60000);

</script>

</body>
</html>
