<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel de Emendas - IN 05/2025 - TCE/MG</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>
body { background-color: #f8f9fa; }
.dataTables_filter { display: none; }

label {
  font-weight: 600;
  font-size: 0.72rem !important;
  color: #343a40;
  margin-bottom: 2px;
}

.form-select-sm, table {
  font-size: 0.7rem !important;
}

table.dataTable td, table.dataTable th {
  white-space: nowrap;
}

.dataTables_wrapper .dataTables_paginate {
  margin-top: 0.5rem;
  display: flex;
  justify-content: center;
  gap: 4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button {
  padding: 4px 8px !important;
  font-size: 0.65rem !important;
  border-radius: 6px !important;
  background-color: #e9ecef !important;
  border: 1px solid #dee2e6 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current {
  background-color: #0d6efd !important;
  color: #fff !important;
  font-weight: bold !important;
}

.export-group .btn {
  font-size: 0.7rem;
  padding: 4px 8px;
}

#indicadorAtualizacao {
  font-size: 0.65rem;
  color: #6c757d;
  text-align: right;
  margin-bottom: 8px;
}

.spinner-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 60px;
  z-index: 9999;
  background-color: rgba(255,255,255,0.9);
}

.spinner-border {
  width: 2rem;
  height: 2rem;
}

.spinner-text {
  font-size: 0.9rem;
  margin-top: 5px;
}

#lengthSelectorContainer {
  margin-top: 10px;
  font-size: 0.75rem;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

#lengthSelector {
  width: 70px;
  font-size: 0.75rem;
  padding: 2px 4px;
}
</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
  <div class="spinner-border text-primary"></div>
  <div class="spinner-text">Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
  Dados atualizados automaticamente em...
</div>

<div class="row gx-2 gy-2 mb-3">

  <div class="col-sm-2">
    <label>Ano *</label>
    <select id="anoFiltro" class="form-select form-select-sm"></select>
  </div>

  <div class="col-sm-2"><label>Origem</label>
    <select id="origemFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Tipo</label>
    <select id="tipoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

</div>

<div class="d-flex justify-content-between mb-2">

  <button id="btnLimpar" class="btn btn-outline-primary btn-sm">
    Limpar Filtros
  </button>

  <div class="export-group btn-group">
    <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnXls" class="btn btn-outline-secondary btn-sm">XLS</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
    <button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
  </div>

</div>

<div class="table-responsive">
  <table id="tabela" class="table table-bordered table-striped table-sm w-100" style="display:none;"></table>
</div>

<div id="lengthSelectorContainer">
  <label>Registros por página:</label>
  <select id="lengthSelector" class="form-select form-select-sm d-inline-block">
    <option value="10">10</option>
    <option value="25">25</option>
    <option value="50">50</option>
    <option value="100">100</option>
  </select>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
let tabela;
let dadosOriginais=[];

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

const campos={
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda"
};

Papa.parse(urlCSV,{
 download:true,
 header:true,
 complete:r=>{

   dadosOriginais=r.data.filter(d=>d[campos.ano]);

   carregarAno();
   $("#spinnerCsv").fadeOut(200);
 }
});

function carregarAno(){
 let s=$("#anoFiltro");

 s.empty();
 s.append('<option value="">Selecione...</option>');
 s.append('<option value="TODOS">Todos</option>');

 [...new Set(dadosOriginais.map(r=>r[campos.ano]))]
   .sort()
   .forEach(v=>s.append(`<option value="${v}">${v}</option>`));
}

function aplicarFiltros(){

 let ano=$("#anoFiltro").val();
 if(!ano) return;

 let base =
   (ano==="TODOS")
   ? [...dadosOriginais]
   : dadosOriginais.filter(r=>r[campos.ano]===ano);

 let origem=$("#origemFiltro").val();
 if(origem) base=base.filter(r=>r[campos.origem]===origem);

 let tipo=$("#tipoFiltro").val();
 if(tipo) base=base.filter(r=>r[campos.tipo]===tipo);

 renderTabela(base);
}

$("#anoFiltro").on("change",function(){
 $("#origemFiltro,#tipoFiltro").prop("disabled",false);
 aplicarFiltros();
});

$("#origemFiltro,#tipoFiltro").on("change",aplicarFiltros);

$("#btnLimpar").on("click",()=>location.reload());

function renderTabela(dados){

 $("#tabela").show();

 if(tabela){
   tabela.clear().rows.add(dados).draw();
   return;
 }

 tabela=$("#tabela").DataTable({
   data:dados,
   columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
   pageLength:10,
   scrollX:true,
   dom:"rtip",
   language:{
     url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
   }
 });

 $("#lengthSelector").on("change",function(){
   tabela.page.len(this.value).draw();
 });
}

/* ✅ Nome dinâmico */
function gerarNomeArquivo(ext){

 let partes=["dados-emendas-pjf"];

 let ano=$("#anoFiltro").val();
 partes.push(ano==="TODOS" ? "todos" : ano);

 let origem=$("#origemFiltro").val();
 if(origem) partes.push(origem);

 let tipo=$("#tipoFiltro").val();
 if(tipo) partes.push(tipo);

 return partes
   .map(p=>p.toLowerCase().replace(/\s+/g,"-"))
   .join("-") + "." + ext;
}

function baixarArquivo(conteudo,nome,tipo){
 let blob=new Blob([conteudo],{type:tipo});
 let link=document.createElement("a");
 link.href=URL.createObjectURL(blob);
 link.download=nome;
 link.click();
}

/* EXPORTAÇÕES */
$("#btnCsv").on("click",()=>{
 baixarArquivo(
   Papa.unparse(tabela.rows().data().toArray()),
   gerarNomeArquivo("csv"),
   "text/csv"
 );
});

$("#btnJson").on("click",()=>{
 baixarArquivo(
   JSON.stringify(tabela.rows().data().toArray(),null,2),
   gerarNomeArquivo("json"),
   "application/json"
 );
});

$("#btnTxt").on("click",()=>{
 let txt=tabela.rows().data().toArray()
   .map(o=>Object.values(o).join(" | "))
   .join("\n");

 baixarArquivo(txt,gerarNomeArquivo("txt"),"text/plain");
});

$("#btnXls").on("click",()=>{
 let ws=XLSX.utils.json_to_sheet(tabela.rows().data().toArray());
 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,"Emendas");

 XLSX.writeFile(wb,gerarNomeArquivo("xlsx"));
});
</script>

</body>
</html>
