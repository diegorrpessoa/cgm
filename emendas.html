<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel de Emendas - IN 05/2025 - TCE/MG</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>
body{background:#f8f9fa;}
.dataTables_filter{display:none}

label{
  font-size:.7rem;
  font-weight:600;
  color:#343a40;
}

.form-select-sm,table{
  font-size:.7rem!important;
}

table.dataTable td,table.dataTable th{
  white-space:nowrap;
}

#tabela{display:none}

.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px!important;
  font-size:.65rem!important;
  border-radius:6px!important;
  background:#e9ecef!important;
  border:1px solid #dee2e6!important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd!important;
  color:#fff!important;
  font-weight:bold;
}

.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

#lengthSelector{
  width:70px;
  font-size:.7rem;
}

#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}
</style>
</head>

<body>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
  Dados atualizados automaticamente em...
</div>

<div class="row gx-2 gy-2 mb-3">

  <div class="col-sm-2"><label>Ano *</label>
    <select id="anoFiltro" class="form-select form-select-sm"></select>
  </div>

  <div class="col-sm-2"><label>Origem</label>
    <select id="origemFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Tipo</label>
    <select id="tipoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Autoria</label>
    <select id="autoriaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Número</label>
    <select id="numeroFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Objeto</label>
    <select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Recebedor</label>
    <select id="recebedorFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>CNPJ</label>
    <select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Natureza</label>
    <select id="naturezaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Função</label>
    <select id="funcaoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

</div>

<div class="d-flex justify-content-end mb-2">
  <button id="btnLimpar" class="btn btn-outline-primary btn-sm">
    Limpar Filtros
  </button>
</div>

<div class="d-flex justify-content-between align-items-center mb-2">

  <div>
    <label class="me-1">Registros por página:</label>
    <select id="lengthSelector" class="form-select form-select-sm d-inline-block">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
  </div>

  <div class="export-group">
    <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnXls" class="btn btn-outline-secondary btn-sm">XLS</button>
    <button id="btnPdf" class="btn btn-outline-secondary btn-sm">PDF</button>
    <button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
  </div>

</div>

<div class="table-responsive">
  <table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
let tabela;
let dadosOriginais=[];

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

const campos={
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda",
  autoria:"Proponente",
  numero:"Identificação da Emenda",
  objeto:"Objeto da Despesa",
  recebedor:"Órgão ou entidade executora ou beneficiária",
  cnpj:"CNPJ do Órgão ou entidade executora ou beneficiária",
  natureza:"Grupo de Natureza de Despesa (GND)",
  funcao:"Função de Governo Função programática"
};

const ordem=Object.keys(campos);

Papa.parse(urlCSV,{
 download:true,
 header:true,
 complete:r=>{

   dadosOriginais=r.data.filter(d=>d[campos.ano]);

   let linhaAtualizacao=dadosOriginais.find(x=>x["Atualizacao"]);
   if(linhaAtualizacao){
     $("#indicadorAtualizacao").html(
       `Dados atualizados automaticamente em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
     );
   }

   dadosOriginais=dadosOriginais.map(r=>{
     let copia={...r};
     delete copia["Atualizacao"];
     return copia;
   });

   carregarAno();
 }
});

function carregarAno(){
 let s=$("#anoFiltro");
 s.empty().append('<option value="">Selecione...</option>');
 [...new Set(dadosOriginais.map(r=>r[campos.ano]))]
   .sort()
   .forEach(v=>s.append(`<option>${v}</option>`));
}

function aplicarFiltros(){

 let ano=$("#anoFiltro").val();
 if(!ano) return;

 let base=dadosOriginais.filter(r=>r[campos.ano]===ano);

 ordem.slice(1).forEach(f=>{
   let v=$("#"+f+"Filtro").val();
   if(v){
     base=base.filter(r=>r[campos[f]]===v);
   }
 });

 atualizarFiltros();
 renderTabela(base);
}

function atualizarFiltros(){

 ordem.slice(1).forEach(f=>{

   let seletor=$("#"+f+"Filtro");
   let valorAtual=seletor.val();

   let ano=$("#anoFiltro").val();
   let baseOpcoes=dadosOriginais.filter(r=>r[campos.ano]===ano);

   ordem.slice(1).forEach(outro=>{
     if(outro===f) return;
     let val=$("#"+outro+"Filtro").val();
     if(val){
       baseOpcoes=baseOpcoes.filter(r=>r[campos[outro]]===val);
     }
   });

   let valores=[...new Set(baseOpcoes.map(r=>r[campos[f]]).filter(Boolean))].sort();

   seletor.empty().append('<option value="">Selecione...</option>');
   valores.forEach(v=>seletor.append(`<option>${v}</option>`));

   seletor.prop("disabled",valores.length===0);

   if(valores.includes(valorAtual)){
     seletor.val(valorAtual);
   } else {
     seletor.val("");
   }
 });
}

$("#anoFiltro").on("change",function(){
 ordem.slice(1).forEach(f=>{
   $("#"+f+"Filtro").val("").prop("disabled",false);
 });
 aplicarFiltros();
});

ordem.slice(1).forEach(f=>{
 $("#"+f+"Filtro").on("change",aplicarFiltros);
});

$("#btnLimpar").on("click",()=>location.reload());

function renderTabela(dados){

 $("#tabela").show();

 if(tabela){
   tabela.clear().rows.add(dados).draw();
   return;
 }

 tabela=$("#tabela").DataTable({
   data:dados,
   columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
   pageLength:10,
   scrollX:true,
   dom:"frtip",
   language:{
     url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
   }
 });

 $("#btnCsv").on("click",()=>exportarCSV(dados));
 $("#btnXls").on("click",()=>exportarXLS(dados));
 $("#btnPdf").on("click",()=>exportarPDF(dados));

 $("#btnTxt").on("click",()=>{
   baixarArquivo(dados.map(o=>Object.values(o).join(" | ")).join("\n"),
   "dados.txt","text/plain");
 });

 $("#btnJson").on("click",()=>{
   baixarArquivo(JSON.stringify(dados,null,2),
   "dados.json","application/json");
 });

 $("#lengthSelector").on("change",function(){
   tabela.page.len(this.value).draw();
 });
}

function exportarCSV(dados){
 baixarArquivo(Papa.unparse(dados),"dados.csv","text/csv");
}

function exportarXLS(dados){
 let ws=XLSX.utils.json_to_sheet(dados);
 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,"Emendas");
 XLSX.writeFile(wb,"dados.xlsx");
}

/* ✅ PDF OTIMIZADO PROFISSIONAL */
function exportarPDF(dados){

  if(!dados || dados.length===0){
    alert("Nenhum dado disponível para exportação.");
    return;
  }

  let colunas = Object.keys(dados[0]);

  let linhas = dados.map(row =>
    colunas.map(col => row[col] ? row[col].toString() : "")
  );

  let tabelaPDF = [
    colunas.map(c => ({text:c, style:"tableHeader"})),
    ...linhas
  ];

  let docDefinition = {
    pageSize:"A4",
    pageOrientation:"landscape",

    content:[
      {text:"Painel de Emendas – IN 05/2025 – TCE/MG", style:"titulo"},
      {text:$("#indicadorAtualizacao").text(), style:"subtitulo"},

      {
        table:{
          headerRows:1,
          widths:Array(colunas.length).fill("*"),
          body:tabelaPDF
        },
        layout:"lightHorizontalLines"
      }
    ],

    styles:{
      titulo:{
        fontSize:14,
        bold:true,
        margin:[0,0,0,6]
      },
      subtitulo:{
        fontSize:9,
        italics:true,
        color:"gray",
        margin:[0,0,0,10]
      },
      tableHeader:{
        bold:true,
        fontSize:8,
        fillColor:"#e9ecef"
      }
    },

    defaultStyle:{
      fontSize:7
    }
  };

  pdfMake.createPdf(docDefinition)
    .download("painel_emendas_IN05.pdf");
}

function baixarArquivo(conteudo,nome,tipo){
 let blob=new Blob([conteudo],{type:tipo});
 let link=document.createElement("a");
 link.href=URL.createObjectURL(blob);
 link.download=nome;
 link.click();
}
</script>

</body>
</html>
