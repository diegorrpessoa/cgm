<style>

/* =========================
   FILTRO VALOR
========================= */

/* Select mantém alinhamento padrão */
#valorFiltro{
  text-align:left !important;
}

/* Valores alinhados à direita */
#valorFiltro option{
  text-align:right !important;
}

/* Primeira opção alinhada à esquerda */
#valorFiltro option:first-child{
  text-align:left !important;
}

</style>

<!-- =========================
SUBSTITUIR O $(document).ready
========================= -->

<script>

$(document).ready(function(){

  /* FILTROS INICIAM DESABILITADOS */
  $("#inscritoFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  $("#valorFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  carregarDados();

});

</script>

<!-- =========================
SUBSTITUIR FUNÇÃO atualizarFiltros
========================= -->

<script>

function atualizarFiltros(){

  const ano =
    $("#anoFiltro").val();

  /* SEM ANO */
  if(
    !ano ||
    ano === ""
  ){

    $("#inscritoFiltro")
      .prop("disabled",true)
      .html(`
        <option value="">
          Selecione...
        </option>
      `);

    $("#valorFiltro")
      .prop("disabled",true)
      .html(`
        <option value="">
          Selecione...
        </option>
      `);

    return;

  }

  /* COM ANO */
  $("#inscritoFiltro")
    .prop("disabled",false);

  $("#valorFiltro")
    .prop("disabled",false);

  ordemFiltros.forEach((filtro,index)=>{

    if(index === 0) return;

    const dadosBase =
      obterDadosBase(index);

    popularFiltro(

      filtro+"Filtro",

      campos[filtro],

      dadosBase

    );

  });

}

</script>

<!-- =========================
SUBSTITUIR FUNÇÃO limparFiltros
========================= -->

<script>

function limparFiltros(){

  ordemFiltros.forEach(f=>{

    $("#"+f+"Filtro").val("");

  });

  /* DESATIVA FILTROS */
  $("#inscritoFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  $("#valorFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  $("#tabela")
    .hide()
    .empty();

  $("#resumoValores").hide();

  if(tabela){

    tabela.destroy();

    tabela = null;

  }

}

</script>

<!-- =========================
SUBSTITUIR TRECHO FINAL DA
FUNÇÃO popularFiltro
========================= -->
