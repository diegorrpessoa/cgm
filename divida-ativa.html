<style>

/* =========================
   FILTRO VALOR
========================= */

/* Mantém o texto padrão à esquerda */
#valorFiltro{
  text-align:left !important;
}

/* Valores alinhados à direita */
#valorFiltro option{
  text-align:right !important;
}

/* Primeira opção "Selecione..." à esquerda */
#valorFiltro option:first-child{
  text-align:left !important;
}

</style>

<script>

/* =========================
   BLOQUEIO INICIAL FILTROS
========================= */

$(document).ready(function(){

  /* Nome do inscrito */
  $("#inscritoFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  /* Valor */
  $("#valorFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  carregarDados();

});

/* =========================
   ATUALIZAR FILTROS
========================= */

function atualizarFiltros(){

  const ano =
    $("#anoFiltro").val();

  /* Sem ano selecionado */
  if(
    !ano ||
    ano === ""
  ){

    $("#inscritoFiltro")
      .prop("disabled",true)
      .html(`
        <option value="">
          Selecione...
        </option>
      `);

    $("#valorFiltro")
      .prop("disabled",true)
      .html(`
        <option value="">
          Selecione...
        </option>
      `);

    return;

  }

  /* Ativa filtros após selecionar ano */
  $("#inscritoFiltro")
    .prop("disabled",false);

  $("#valorFiltro")
    .prop("disabled",false);

  ordemFiltros.forEach((filtro,index)=>{

    if(index === 0) return;

    const dadosBase =
      obterDadosBase(index);

    popularFiltro(

      filtro+"Filtro",

      campos[filtro],

      dadosBase

    );

  });

}

/* =========================
   LIMPAR FILTROS
========================= */

function limparFiltros(){

  ordemFiltros.forEach(f=>{

    $("#"+f+"Filtro").val("");

  });

  /* Desativa novamente */
  $("#inscritoFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  $("#valorFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  $("#tabela")
    .hide()
    .empty();

  $("#resumoValores").hide();

  if(tabela){

    tabela.destroy();

    tabela = null;

  }

}

</script>
