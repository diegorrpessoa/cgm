<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Dívida Ativa</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{
  background:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
}

.form-select-sm,
table{
  font-size:.70rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  display:inline-block;
  margin-right:15px;
  font-weight:600;
}

.spinner-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
  background-color:rgba(255,255,255,.9);
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background-color:#e9ecef !important;
  border:1px solid #dee2e6 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

.export-group .btn{
  font-size:.70rem;
  padding:4px 8px;
}

#lengthSelectorContainer{
  font-size:.70rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  margin-bottom:6px;
}

#lengthSelector{
  width:80px;
  font-size:.70rem;
}

.form-select:disabled{
  background:#ced4da !important;
  cursor:not-allowed;
}

.text-end{
  text-align:right !important;
}

</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<div class="container-fluid mt-3">

  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">

      <label>EXERCÍCIO (ANO) *</label>

      <select
        id="anoFiltro"
        class="form-select form-select-sm"
      ></select>

    </div>

    <div class="col-sm-5">

      <label>NOME DO INSCRITO</label>

      <select
        id="inscritoFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>

    </div>

    <div class="col-sm-3">

      <label>VALOR</label>

      <select
        id="valorFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>

    </div>

  </div>

  <!-- TOTAL -->
  <div
    class="totalizadores mb-2"
    id="resumoValores"
    style="display:none;"
  >

    <span id="totalValor">
      Total: R$ 0,00
    </span>

  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="export-group btn-group">

      <button
        id="btnCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="btnXlsx"
        class="btn btn-outline-secondary btn-sm"
      >
        XLSX
      </button>

      <button
        id="btnTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

      <button
        id="btnJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

    </div>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label>Registros por página:</label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm"
    >

      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>

    </select>

  </div>

  <!-- TABELA -->
  <div class="table-responsive">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm w-100"
      style="display:none;"
    ></table>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

let cacheFiltros = {};

const urlCSV =
"https://docs.google.com/spreadsheets/d/10C3yDnARmQs6Ydh39PK1XGNW3cFylcWLL9rd6_2WyIs/export?format=csv&gid=1659253784";

const campos = {

  ano:"EXERCÍCIO (ANO)",
  inscrito:"NOME DO INSCRITO",
  valor:"VALOR"

};

const ordem = [

  "ano",
  "inscrito",
  "valor"

];

$(document).ready(function(){

  carregarCSV();

});

function carregarCSV(){

  Papa.parse(urlCSV,{

    download:true,
    header:true,
    skipEmptyLines:true,

    complete:function(resultado){

      const linhas = resultado.data || [];

      if(!linhas.length){

        alert("Base de dados vazia.");

        return;

      }

      const linha2 = linhas[0];

      const atualizacao =
        linha2["D"] ||
        linha2["Atualizacao"] ||
        linha2["ATUALIZACAO"] ||
        "";

      $("#indicadorAtualizacao").html(
        `Dados atualizados em: <b>${atualizacao}</b>`
      );

      dadosOriginais = linhas
        .filter(r => r[campos.ano])
        .map(r => ({

          "NOME DO INSCRITO":
            limparTexto(r["NOME DO INSCRITO"]),

          "EXERCÍCIO (ANO)":
            limparTexto(r["EXERCÍCIO (ANO)"]),

          "VALOR":
            formatarValorOriginal(r["VALOR"])

        }));

      prepararCache();

      carregarFiltroAno();

      inicializarEventos();

      $("#spinnerCsv").fadeOut(200);

    },

    error:function(){

      $("#spinnerCsv").hide();

      alert(
        "Não foi possível carregar a base de dados."
      );

    }

  });

}

function limparTexto(valor){

  if(!valor) return "";

  return valor
    .toString()
    .replace(/^"+|"+$/g,"")
    .trim();

}

function formatarValorOriginal(valor){

  if(!valor) return "";

  let texto = valor
    .toString()
    .replace(/^"+|"+$/g,"")
    .trim();

  texto = texto.replace(/\s+/g," ");

  return texto;

}

function prepararCache(){

  cacheFiltros = {};

  dadosOriginais.forEach(registro=>{

    const ano =
      registro[campos.ano];

    if(!cacheFiltros[ano]){

      cacheFiltros[ano] = {

        inscritos:new Set(),
        valores:new Set()

      };

    }

    cacheFiltros[ano]
      .inscritos
      .add(registro[campos.inscrito]);

    cacheFiltros[ano]
      .valores
      .add(registro[campos.valor]);

  });

}

function carregarFiltroAno(){

  const select =
    $("#anoFiltro");

  select.empty();

  select.append(`
    <option value="">
      Selecione...
    </option>
  `);

  select.append(`
    <option value="TODOS">
      Todos
    </option>
  `);

  [...new Set(

    dadosOriginais.map(
      r=>r[campos.ano]
    )

  )]
  .sort((a,b)=>b.localeCompare(a))

  .forEach(ano=>{

    select.append(`
      <option value="${ano}">
        ${ano}
      </option>
    `);

  });

}

function inicializarEventos(){

  $("#anoFiltro").on(
    "change",
    atualizarFiltrosEncadeados
  );

  $("#inscritoFiltro").on(
    "change",
    atualizarValorPorInscrito
  );

  $("#valorFiltro").on(
    "change",
    aplicarTudo
  );

  $("#btnLimpar").on(
    "click",
    limparFiltros
  );

  $("#lengthSelector").on(
    "change",
    function(){

      if(tabela){

        tabela.page
          .len(parseInt(this.value))
          .draw(false);

      }

    }
  );

  $("#btnCsv").on(
    "click",
    exportarCSV
  );

  $("#btnJson").on(
    "click",
    exportarJSON
  );

  $("#btnTxt").on(
    "click",
    exportarTXT
  );

  $("#btnXlsx").on(
    "click",
    exportarXLSX
  );

}

function atualizarFiltrosEncadeados(){

  const ano =
    $("#anoFiltro").val();

  resetarTabela();

  if(!ano){

    $("#inscritoFiltro")
      .prop("disabled",true)
      .html(`
        <option value="">
          Selecione...
        </option>
      `);

    $("#valorFiltro")
      .prop("disabled",true)
      .html(`
        <option value="">
          Selecione...
        </option>
      `);

    return;

  }

  const base =

    ano === "TODOS"
      ? dadosOriginais
      : dadosOriginais.filter(
          r=>r[campos.ano] === ano
        );

  popularFiltro(
    "#inscritoFiltro",
    [...new Set(
      base.map(
        r=>r[campos.inscrito]
      )
    )]
    .sort((a,b)=>
      a.localeCompare(
        b,
        "pt-BR"
      )
    )
  );

  popularFiltro(
    "#valorFiltro",
    [...new Set(
      base.map(
        r=>r[campos.valor]
      )
    )]
  );

  $("#inscritoFiltro")
    .prop("disabled",false);

  $("#valorFiltro")
    .prop("disabled",false);

  aplicarTudo();

}

function atualizarValorPorInscrito(){

  const ano =
    $("#anoFiltro").val();

  const inscrito =
    $("#inscritoFiltro").val();

  let base =

    ano === "TODOS"
      ? dadosOriginais
      : dadosOriginais.filter(
          r=>r[campos.ano] === ano
        );

  if(inscrito){

    base = base.filter(
      r=>
        r[campos.inscrito] === inscrito
    );

  }

  popularFiltro(
    "#valorFiltro",
    [...new Set(
      base.map(
        r=>r[campos.valor]
      )
    )]
  );

  aplicarTudo();

}

function popularFiltro(seletor,valores){

  const select = $(seletor);

  const valorAtual =
    select.val();

  select.empty();

  select.append(`
    <option value="">
      Selecione...
    </option>
  `);

  select.append(`
    <option value="TODOS">
      Todos
    </option>
  `);

  valores.forEach(valor=>{

    select.append(`
      <option value="${valor}">
        ${valor}
      </option>
    `);

  });

  if(valores.includes(valorAtual)){

    select.val(valorAtual);

  }

}

function aplicarTudo(){

  const dados =
    aplicarFiltros();

  atualizarResumo(dados);

  renderTabela(dados);

}

function aplicarFiltros(){

  const ano =
    $("#anoFiltro").val();

  const inscrito =
    $("#inscritoFiltro").val();

  const valor =
    $("#valorFiltro").val();

  return dadosOriginais.filter(r=>{

    if(
      ano &&
      ano !== "TODOS" &&
      r[campos.ano] !== ano
    ){
      return false;
    }

    if(
      inscrito &&
      inscrito !== "TODOS" &&
      r[campos.inscrito] !== inscrito
    ){
      return false;
    }

    if(
      valor &&
      valor !== "TODOS" &&
      r[campos.valor] !== valor
    ){
      return false;
    }

    return true;

  });

}

function renderTabela(dados){

  if(tabela){

    tabela.clear().destroy();

    $("#tabela").empty();

  }

  if(!dados.length){

    $("#tabela").hide();

    return;

  }

  $("#tabela").show();

  tabela = $("#tabela").DataTable({

    data:dados,

    deferRender:true,

    processing:false,

    pageLength:parseInt(
      $("#lengthSelector").val()
    ),

    scrollX:true,

    scrollY:"55vh",

    scrollCollapse:true,

    searching:true,

    ordering:true,

    autoWidth:false,

    lengthChange:false,

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    },

    columns:[

      {
        title:"NOME DO INSCRITO",
        data:"NOME DO INSCRITO"
      },

      {
        title:"EXERCÍCIO (ANO)",
        data:"EXERCÍCIO (ANO)",
        className:"text-end"
      },

      {
        title:"VALOR",
        data:"VALOR",
        className:"text-end"
      }

    ]

  });

}

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();

    return;

  }

  let total = 0;

  dados.forEach(r=>{

    total += converterMoedaNumero(
      r["VALOR"]
    );

  });

  $("#totalValor").text(

    "Total: " +

    total.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )

  );

  $("#resumoValores").show();

}

function converterMoedaNumero(valor){

  if(!valor) return 0;

  return parseFloat(

    valor
      .toString()
      .replace(/[^\d,.-]/g,"")
      .replace(/\./g,"")
      .replace(",", ".")

  ) || 0;

}

function resetarTabela(){

  $("#resumoValores").hide();

  if(tabela){

    tabela.clear().destroy();

    tabela = null;

  }

  $("#tabela")
    .hide()
    .empty();

}

function limparFiltros(){

  $("#anoFiltro").val("");

  $("#inscritoFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  $("#valorFiltro")
    .prop("disabled",true)
    .html(`
      <option value="">
        Selecione...
      </option>
    `);

  resetarTabela();

}

function gerarNomeArquivo(ext){

  const partes = ["divida-ativa"];

  ordem.forEach(f=>{

    const valor =
      $("#"+f+"Filtro").val();

    if(
      valor &&
      valor !== "TODOS"
    ){

      partes.push(

        valor
          .toString()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/[^\w\s-]/g,"")
          .replace(/\s+/g,"-")
          .toLowerCase()

      );

    }

  });

  return partes.join("-")+"."+ext;

}

function baixarArquivo(blob,nome){

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download = nome;

  link.click();

}

function exportarCSV(){

  if(!tabela) return;

  const dados =
    tabela
      .rows({search:"applied"})
      .data()
      .toArray();

  const csv = Papa.unparse(dados,{

    quotes:true,
    delimiter:";"

  });

  baixarArquivo(

    new Blob(
      ["\ufeff"+csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    ),

    gerarNomeArquivo("csv")

  );

}

function exportarJSON(){

  if(!tabela) return;

  const dados =
    tabela
      .rows({search:"applied"})
      .data()
      .toArray();

  baixarArquivo(

    new Blob(
      [
        JSON.stringify(
          dados,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

}

function exportarTXT(){

  if(!tabela) return;

  const dados =
    tabela
      .rows({search:"applied"})
      .data()
      .toArray();

  const txt = dados
    .map(o=>

      Object.values(o)
        .join(" | ")

    )
    .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

}

function exportarXLSX(){

  if(!tabela) return;

  const dados =
    tabela
      .rows({search:"applied"})
      .data()
      .toArray();

  const ws =
    XLSX.utils.json_to_sheet(dados);

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Divida Ativa"
  );

  XLSX.writeFile(
    wb,
    gerarNomeArquivo("xlsx")
  );

}

</script>

</body>
</html>
