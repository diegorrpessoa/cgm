<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Despesas com Viagens Administrativas</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css"/>

<style>

body{
  background-color:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

.form-label,
.form-select-sm,
.form-control-sm,
.table th,
.table td{
  font-size:.65rem !important;
}

.xsmall{
  font-size:.6rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

/* Atualização */
#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

/* Spinner */
.spinner-overlay,
.spinner-overlay-filtros{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
}

.spinner-overlay{
  background-color:rgba(255,255,255,.9);
}

.spinner-overlay-filtros{
  background-color:rgba(255,255,255,.5);
  z-index:9998;
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

/* Labels */
.row label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
  padding-left:2px;
}

/* Inputs */
.form-select-sm,
.form-control-sm{
  border-radius:4px !important;
  padding:2px 6px !important;
  background-color:#fff !important;
  border:1px solid #ced4da !important;
  font-size:.7rem !important;
}

/* Totalizadores */
.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  display:inline-block;
  margin-right:15px;
  font-weight:500;
}

/* Tabela */
.table-wrapper{
  overflow-x:auto;
}

/* Info tabela */
.dataTables_info{
  font-size:.65rem !important;
  color:#6c757d !important;
  margin-top:8px;
  padding-left:5px;
}

/* Paginação */
.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4px;
  padding:6px 0;
  font-size:.7rem;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  margin:0 2px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background-color:#e9ecef !important;
  border:1px solid #dee2e6 !important;
  color:#212529 !important;
  transition:background-color .2s ease;
}

.dataTables_wrapper .dataTables_paginate .paginate_button:hover{
  background-color:#d0d7df !important;
  color:#212529 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background-color:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

/* Botões */
.btn-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

/* Registros */
#lengthSelectorContainer{
  margin-top:10px;
  font-size:.75rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
}

#lengthSelector{
  width:70px;
  font-size:.75rem;
  padding:2px 4px;
}

</style>
</head>

<body>

<!-- SPINNER -->
<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<!-- SPINNER FILTROS -->
<div
  id="spinnerFiltros"
  class="spinner-overlay-filtros"
  style="display:none;"
>

  <div class="spinner-border text-secondary"></div>

  <div class="spinner-text">
    Atualizando filtros...
  </div>

</div>

<div class="container-fluid mt-3">

  <!-- ATUALIZAÇÃO -->
  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Ano *</label>
      <select
        id="anoFiltro"
        class="form-select form-select-sm"
      ></select>
    </div>

    <div class="col-sm-2">
      <label>Mês</label>
      <select
        id="mesFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>
    </div>

    <div class="col-sm-3">
      <label>Unidade Gestora</label>
      <select
        id="unidadeFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>
    </div>

    <div class="col-sm-3">
      <label>Favorecido</label>
      <select
        id="favorecidoFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>
    </div>

  </div>

  <!-- TOTALIZADOR -->
  <div
    class="totalizadores mb-2"
    id="resumoValores"
    style="display:none;"
  >

    <span id="totalGasto">
      Total Gasto: R$ 0,00
    </span>

  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="btn-group">

      <button
        id="exportCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="exportXls"
        class="btn btn-outline-secondary btn-sm"
      >
        XLSX
      </button>

      <button
        id="exportJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

      <button
        id="exportTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

    </div>

  </div>

  <!-- TABELA -->
  <div class="table-wrapper">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm xsmall w-100"
      style="display:none;"
    ></table>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label for="lengthSelector">
      Registros por página:
    </label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm d-inline-block"
    >
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

let dataAtualizacao = "";

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRSU7O5ILvb7beN3GLxKMqjEQa_zXJ5o5BmLZmF_SsW9zbb0fokHPnVJHFxjL3x9ZZYlJgik4l027aA/pub?gid=1659253784&single=true&output=csv";

/* CAMPOS */
const campos = {

  ano:"ANO",
  mes:"MÊS",
  unidade:"UNIDADE GESTORA",
  favorecido:"FAVORECIDO"

};

/* FILTROS */
const ordemFiltros = [

  "ano",
  "mes",
  "unidade",
  "favorecido"

];

/* MESES */
const mesesOrdem = [

  "JANEIRO",
  "FEVEREIRO",
  "MARÇO",
  "ABRIL",
  "MAIO",
  "JUNHO",
  "JULHO",
  "AGOSTO",
  "SETEMBRO",
  "OUTUBRO",
  "NOVEMBRO",
  "DEZEMBRO"

];

/* =========================
   INICIALIZAÇÃO
========================= */

$(document).ready(function(){

  carregarDados();

});

/* =========================
   CARREGAR DADOS
========================= */

function carregarDados(){

  Papa.parse(urlCSV,{

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(resultado){

      if(
        !resultado ||
        !resultado.data ||
        !resultado.data.length
      ){

        $("#spinnerCsv").hide();

        alert(
          "A base de dados retornou vazia."
        );

        return;

      }

      /* CAPTURA DATA ATUALIZAÇÃO */
      const primeiraLinha =
        resultado.data[0];

      dataAtualizacao =
        primeiraLinha["ATUALIZACAO"] ||
        primeiraLinha["ATUALIZAÇÃO"] ||
        primeiraLinha["Atualizacao"] ||
        primeiraLinha["Atualização"] ||
        "";

      if(dataAtualizacao){

        $("#indicadorAtualizacao").html(
          `Dados atualizados em: <b>${dataAtualizacao}</b>`
        );

      }

      /* REMOVE COLUNA P */
      dadosOriginais =
        resultado.data
          .filter(r=>r["ANO"])
          .map(r=>{

            const novo = {...r};

            delete novo["ATUALIZACAO"];
            delete novo["ATUALIZAÇÃO"];
            delete novo["Atualizacao"];
            delete novo["Atualização"];

            return novo;

          });

      popularFiltro(
        "anoFiltro",
        campos.ano,
        dadosOriginais,
        true
      );

      inicializarEventos();

      $("#spinnerCsv").fadeOut(200);

    },

    error:function(){

      $("#spinnerCsv").hide();

      alert(
        "Não foi possível carregar a base de dados CSV."
      );

    }

  });

}

/* =========================
   EVENTOS
========================= */

function inicializarEventos(){

  ordemFiltros.forEach(filtro=>{

    $("#"+filtro+"Filtro").on(
      "change",
      function(){

        $("#spinnerFiltros").show();

        setTimeout(()=>{

          atualizarFiltros();

          const dados =
            aplicarFiltros();

          renderTabela(dados);

          $("#spinnerFiltros").hide();

        },50);

      }
    );

  });

  $("#btnLimpar").on(
    "click",
    limparFiltros
  );

  $("#lengthSelector").on(
    "change",
    function(){

      if(tabela){

        tabela
          .page
          .len(parseInt(this.value))
          .draw();

      }

    }
  );

  $("#exportCsv").on(
    "click",
    ()=>$(".buttons-csv").click()
  );

  $("#exportXls").on(
    "click",
    ()=>$(".buttons-excel").click()
  );

  $("#exportJson").on(
    "click",
    exportarJson
  );

  $("#exportTxt").on(
    "click",
    exportarTxt
  );

}

/* =========================
   LIMPAR FILTROS
========================= */

function limparFiltros(){

  ordemFiltros.forEach(f=>{

    $("#"+f+"Filtro").val("");

    if(f !== "ano"){

      $("#"+f+"Filtro")
        .prop("disabled",true);

    }

  });

  $("#tabela")
    .hide()
    .empty();

  $("#resumoValores").hide();

  if(tabela){

    tabela.destroy();

    tabela = null;

  }

}

/* =========================
   POPULAR FILTROS
========================= */

function popularFiltro(
  id,
  campo,
  dados,
  obrigatorio=false
){

  const select =
    $("#"+id);

  const valorAtual =
    select.val();

  select.empty();

  select.append(`

    <option value="">
      ${obrigatorio
        ? "Selecione..."
        : "Todos"}
    </option>

  `);

  let valores = [

    ...new Set(

      dados
        .map(r=>r[campo])
        .filter(Boolean)

    )

  ];

  if(campo === "MÊS"){

    valores.sort(
      (a,b)=>

      mesesOrdem.indexOf(
        a.toUpperCase()
      ) -

      mesesOrdem.indexOf(
        b.toUpperCase()
      )

    );

  }else{

    valores.sort((a,b)=>

      a.localeCompare(
        b,
        "pt-BR",
        {
          sensitivity:"base"
        }
      )

    );

  }

  valores.forEach(v=>{

    select.append(`

      <option value="${v}">
        ${v}
      </option>

    `);

  });

  if(valores.includes(valorAtual)){

    select.val(valorAtual);

  }

  if(
    obrigatorio ||
    $("#anoFiltro").val()
  ){

    select.prop("disabled",false);

  }

}

/* =========================
   FILTROS ENCADEADOS
========================= */

function atualizarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    ordemFiltros
      .slice(1)
      .forEach(f=>{

        $("#"+f+"Filtro")
          .prop("disabled",true)
          .empty()
          .append(`
            <option value="">
              Todos
            </option>
          `);

      });

    return;

  }

  ordemFiltros.forEach((filtro,index)=>{

    if(index === 0) return;

    const dadosBase =
      obterDadosBase(index);

    popularFiltro(

      filtro+"Filtro",

      campos[filtro],

      dadosBase

    );

  });

}

/* =========================
   BASE FILTROS
========================= */

function obterDadosBase(indiceAtual){

  return dadosOriginais.filter(registro=>{

    return ordemFiltros
      .slice(0,indiceAtual)
      .every(f=>{

        const valor =
          $("#"+f+"Filtro").val();

        if(!valor){

          return true;

        }

        return (
          registro[
            campos[f]
          ] === valor
        );

      });

  });

}

/* =========================
   APLICAR FILTROS
========================= */

function aplicarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    atualizarResumo([]);

    return [];

  }

  const dados =
    dadosOriginais.filter(r=>{

      return ordemFiltros.every(f=>{

        const valor =
          $("#"+f+"Filtro").val();

        if(!valor){

          return true;

        }

        return (
          r[campos[f]] === valor
        );

      });

    });

  atualizarResumo(dados);

  return dados;

}

/* =========================
   TABELA
========================= */

function renderTabela(dados){

  if(!dados.length){

    $("#tabela")
      .hide()
      .empty();

    if(tabela){

      tabela.destroy();

      tabela = null;

    }

    return;

  }

  const colunas =
    Object.keys(dados[0]).map(c=>({

      title:c,

      data:c

    }));

  if(tabela){

    tabela.destroy();

    $("#tabela").empty();

  }

  $("#tabela").show();

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:colunas,

    destroy:true,

    pageLength:parseInt(
      $("#lengthSelector").val()
    ),

    searching:true,

    ordering:true,

    autoWidth:false,

    scrollX:true,

    scrollY:"55vh",

    scrollCollapse:true,

    dom:"Bfrtip",

    buttons:[

      {

        extend:"csvHtml5",

        className:"d-none",

        filename:()=>gerarNomeArquivo("csv")
          .replace(".csv","")

      },

      {

        extend:"excelHtml5",

        className:"d-none",

        filename:()=>gerarNomeArquivo("xlsx")
          .replace(".xlsx","")

      }

    ],

    language:{

      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"

    }

  });

}

/* =========================
   RESUMO
========================= */

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();

    return;

  }

  let total = 0;

  dados.forEach(r=>{

    total += parseMoeda(
      r["TOTAL GASTO (R$)"]
    );

  });

  $("#totalGasto").text(

    "Total Gasto: " +

    total.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )

  );

  $("#resumoValores").show();

}

/* =========================
   MOEDA
========================= */

function parseMoeda(valor){

  if(!valor) return 0;

  return parseFloat(

    valor
      .toString()
      .replace(/[^\d,-]/g,"")
      .replace(/\./g,"")
      .replace(",", ".")

  ) || 0;

}

/* =========================
   EXPORTAÇÃO
========================= */

function gerarNomeArquivo(ext){

  const partes = [

    "viagens-administrativas"

  ];

  ordemFiltros.forEach(f=>{

    const valor =
      $("#"+f+"Filtro").val();

    if(valor){

      partes.push(

        valor
          .toString()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/\s+/g,"-")
          .replace(/[^\w-]/g,"")

      );

    }

  });

  return partes.join("-")+"."+ext;

}

/* =========================
   EXPORTAR JSON
========================= */

function exportarJson(){

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  baixarArquivo(

    new Blob(
      [
        JSON.stringify(
          dados,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

}

/* =========================
   EXPORTAR TXT
========================= */

function exportarTxt(){

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  if(!dados.length) return;

  const colunas =
    Object.keys(dados[0]);

  const txt =

    colunas.join(";") +

    "\n" +

    dados
      .map(l=>

        colunas
          .map(c=>l[c])
          .join(";")

      )
      .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

}

/* =========================
   DOWNLOAD
========================= */

function baixarArquivo(blob,nome){

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download = nome;

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

}

</script>

</body>
</html>
