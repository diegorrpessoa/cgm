<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Despesas de Viagens Administrativas</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css"/>

<style>

body{
  background-color:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

.form-label,
.form-select-sm,
.form-control-sm,
.table th,
.table td{
  font-size:.65rem !important;
}

.xsmall{
  font-size:.6rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

.spinner-overlay,
.spinner-overlay-filtros{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
}

.spinner-overlay{
  background-color:rgba(255,255,255,.9);
}

.spinner-overlay-filtros{
  background-color:rgba(255,255,255,.5);
  z-index:9998;
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

.row label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
  padding-left:2px;
}

.form-select-sm,
.form-control-sm{
  border-radius:4px !important;
  padding:2px 6px !important;
  background-color:#fff !important;
  border:1px solid #ced4da !important;
  font-size:.7rem !important;
}

.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  display:inline-block;
  margin-right:15px;
  font-weight:500;
}

.table-wrapper{
  overflow-x:auto;
}

.dataTables_info{
  font-size:.65rem !important;
}

.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
}

.btn-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

#lengthSelectorContainer{
  margin-top:10px;
  font-size:.75rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
}

#lengthSelector{
  width:70px;
}

</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<div
  id="spinnerFiltros"
  class="spinner-overlay-filtros"
  style="display:none;"
>

  <div class="spinner-border text-secondary"></div>

  <div class="spinner-text">
    Atualizando filtros...
  </div>

</div>

<div class="container-fluid mt-3">

  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Ano *</label>
      <select id="anoFiltro" class="form-select form-select-sm"></select>
    </div>

    <div class="col-sm-2">
      <label>Mês</label>
      <select id="mesFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-3">
      <label>Unidade Gestora</label>
      <select id="unidadeFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-3">
      <label>Favorecido</label>
      <select id="favorecidoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

  </div>

  <div
    class="totalizadores mb-2"
    id="resumoValores"
    style="display:none;"
  >

    <span id="totalGasto">
      Total Gasto: R$ 0,00
    </span>

    <span id="totalRegistros">
      Registros: 0
    </span>

  </div>

  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="btn-group">

      <button id="exportCsv" class="btn btn-outline-secondary btn-sm">
        CSV
      </button>

      <button id="exportXls" class="btn btn-outline-secondary btn-sm">
        XLSX
      </button>

      <button id="exportJson" class="btn btn-outline-secondary btn-sm">
        JSON
      </button>

      <button id="exportTxt" class="btn btn-outline-secondary btn-sm">
        TXT
      </button>

    </div>

  </div>

  <div class="table-wrapper">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm xsmall w-100"
      style="display:none;"
    ></table>

  </div>

  <div id="lengthSelectorContainer">

    <label>
      Registros por página:
    </label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm"
    >
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRSU7O5ILvb7beN3GLxKMqjEQa_zXJ5o5BmLZmF_SsW9zbb0fokHPnVJHFxjL3x9ZZYlJgik4l027aA/pub?gid=1166814370&single=true&output=csv";

const campos = {
  ano:"ANO",
  mes:"MÊS",
  unidade:"UNIDADE GESTORA",
  favorecido:"FAVORECIDO"
};

const ordemFiltros = [
  "ano",
  "mes",
  "unidade",
  "favorecido"
];

const mesesOrdem = [
  "JANEIRO",
  "FEVEREIRO",
  "MARÇO",
  "ABRIL",
  "MAIO",
  "JUNHO",
  "JULHO",
  "AGOSTO",
  "SETEMBRO",
  "OUTUBRO",
  "NOVEMBRO",
  "DEZEMBRO"
];

$(document).ready(function(){

  Papa.parse(urlCSV,{

    download:true,

    header:true,

    skipEmptyLines:true,

    dynamicTyping:false,

    complete:function(resultado){

      if(
        !resultado ||
        !resultado.data ||
        !resultado.data.length
      ){

        erroCSV();

        return;

      }

      dadosOriginais = resultado.data
        .map(limparObjeto)
        .filter(r => r["ANO"]);

      if(!dadosOriginais.length){

        erroCSV();

        return;

      }

      carregarAtualizacao();

      popularFiltro(
        "anoFiltro",
        campos.ano,
        dadosOriginais,
        true
      );

      inicializarEventos();

      $("#spinnerCsv").fadeOut(200);

    },

    error:function(){

      erroCSV();

    }

  });

});

function erroCSV(){

  $("#spinnerCsv").hide();

  alert(
    "Não foi possível carregar a base de dados CSV."
  );

}

function limparObjeto(obj){

  const novo = {};

  Object.keys(obj).forEach(k=>{

    novo[
      k.trim()
    ] = typeof obj[k] === "string"
      ? obj[k].trim()
      : obj[k];

  });

  return novo;

}

function carregarAtualizacao(){

  $("#indicadorAtualizacao").html(
    "Dados atualizados conforme base oficial."
  );

}

function inicializarEventos(){

  ordemFiltros.forEach(filtro=>{

    $("#"+filtro+"Filtro").on(
      "change",
      function(){

        $("#spinnerFiltros").show();

        setTimeout(()=>{

          atualizarFiltros();

          renderTabela(
            aplicarFiltros()
          );

          $("#spinnerFiltros").hide();

        },50);

      }
    );

  });

  $("#btnLimpar").on(
    "click",
    ()=>location.reload()
  );

  $("#lengthSelector").on(
    "change",
    function(){

      if(tabela){

        tabela
          .page
          .len(parseInt(this.value))
          .draw();

      }

    }
  );

  $("#exportCsv").on(
    "click",
    ()=>$(".buttons-csv").click()
  );

  $("#exportXls").on(
    "click",
    ()=>$(".buttons-excel").click()
  );

  $("#exportJson").on(
    "click",
    exportarJson
  );

  $("#exportTxt").on(
    "click",
    exportarTxt
  );

}

function popularFiltro(
  id,
  campo,
  dados,
  obrigatorio=false
){

  const select = $("#"+id);

  const atual = select.val();

  select.empty();

  select.append(`
    <option value="">
      ${obrigatorio
        ? "Selecione..."
        : "Todos"}
    </option>
  `);

  let valores = [
    ...new Set(
      dados
        .map(r=>r[campo])
        .filter(Boolean)
    )
  ];

  if(campo === "MÊS"){

    valores.sort(
      (a,b)=>
      mesesOrdem.indexOf(a.toUpperCase()) -
      mesesOrdem.indexOf(b.toUpperCase())
    );

  }else{

    valores.sort((a,b)=>
      a.localeCompare(
        b,
        "pt-BR",
        {
          sensitivity:"base"
        }
      )
    );

  }

  valores.forEach(v=>{

    select.append(`
      <option value="${v}">
        ${v}
      </option>
    `);

  });

  if(valores.includes(atual)){

    select.val(atual);

  }

  select.prop(
    "disabled",
    false
  );

}

function atualizarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    ordemFiltros
      .slice(1)
      .forEach(f=>{

        $("#"+f+"Filtro")
          .prop("disabled",true)
          .val("");

      });

    return;

  }

  ordemFiltros.forEach((filtro,idx)=>{

    if(idx === 0) return;

    const dadosBase =
      dadosOriginais.filter(r=>{

        return ordemFiltros
          .slice(0,idx)
          .every(f=>{

            const valor =
              $("#"+f+"Filtro").val();

            if(!valor){

              return true;

            }

            return (
              r[campos[f]] === valor
            );

          });

      });

    popularFiltro(
      filtro+"Filtro",
      campos[filtro],
      dadosBase
    );

  });

}

function aplicarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    atualizarResumo([]);

    return [];

  }

  const dados =
    dadosOriginais.filter(r=>{

      return ordemFiltros.every(f=>{

        const valor =
          $("#"+f+"Filtro").val();

        if(!valor){

          return true;

        }

        return (
          r[campos[f]] === valor
        );

      });

    });

  atualizarResumo(dados);

  return dados;

}

function renderTabela(dados){

  if(tabela){

    tabela.destroy();

    $("#tabela").empty();

  }

  if(!dados.length){

    $("#tabela").hide();

    return;

  }

  const colunas =
    Object.keys(dados[0]).map(c=>({
      title:c,
      data:c
    }));

  $("#tabela").show();

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:colunas,

    pageLength:parseInt(
      $("#lengthSelector").val()
    ),

    destroy:true,

    autoWidth:false,

    scrollX:true,

    scrollY:"55vh",

    scrollCollapse:true,

    dom:"Bfrtip",

    buttons:[

      {
        extend:"csvHtml5",
        className:"d-none",
        filename:()=>gerarNomeArquivo("csv").replace(".csv","")
      },

      {
        extend:"excelHtml5",
        className:"d-none",
        filename:()=>gerarNomeArquivo("xlsx").replace(".xlsx","")
      }

    ],

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

}

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();

    return;

  }

  let total = 0;

  dados.forEach(r=>{

    total += parseMoeda(
      r["TOTAL GASTO (R$)"]
    );

  });

  $("#totalGasto").text(

    "Total Gasto: " +

    total.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )

  );

  $("#totalRegistros").text(
    "Registros: "+dados.length
  );

  $("#resumoValores").show();

}

function parseMoeda(valor){

  if(!valor) return 0;

  return parseFloat(

    valor
      .toString()
      .replace(/[^\d,-]/g,"")
      .replace(/\./g,"")
      .replace(",", ".")

  ) || 0;

}

function gerarNomeArquivo(ext){

  const partes = [
    "viagens-administrativas"
  ];

  ordemFiltros.forEach(f=>{

    const valor =
      $("#"+f+"Filtro").val();

    if(valor){

      partes.push(

        valor
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/\s+/g,"-")
          .replace(/[^\w-]/g,"")

      );

    }

  });

  return partes.join("-")+"."+ext;

}

function exportarJson(){

  if(!tabela) return;

  const dados =
    tabela
      .rows({search:"applied"})
      .data()
      .toArray();

  baixarArquivo(

    new Blob(
      [JSON.stringify(dados,null,2)],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

}

function exportarTxt(){

  if(!tabela) return;

  const dados =
    tabela
      .rows({search:"applied"})
      .data()
      .toArray();

  if(!dados.length) return;

  const colunas =
    Object.keys(dados[0]);

  const txt =

    colunas.join(";") +
    "\n" +

    dados.map(l=>

      colunas
        .map(c=>l[c])
        .join(";")

    ).join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

}

function baixarArquivo(blob,nome){

  const a =
    document.createElement("a");

  a.href =
    URL.createObjectURL(blob);

  a.download = nome;

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

}

</script>

</body>
</html>
