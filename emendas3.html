<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel de Emendas - IN 05/2025 - TCE/MG</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>
body { background-color: #f8f9fa; }
.dataTables_filter { display: none; }

label {
  font-weight: 600;
  font-size: 0.72rem !important;
  color: #343a40;
  margin-bottom: 2px;
}

.form-select-sm, table {
  font-size: 0.7rem !important;
}

table.dataTable td, table.dataTable th {
  white-space: nowrap;
}

/* Spinner */
.spinner-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 60px;
  z-index: 9999;
  background-color: rgba(255,255,255,0.9);
}

.spinner-border { width: 2rem; height: 2rem; }
.spinner-text { font-size: 0.9rem; margin-top: 5px; }

/* Totalizador */
.totalizadores {
  font-size: 0.7rem;
  background: #fff;
  padding: 5px 10px;
  border: 1px solid #dee2e6;
  border-radius: 4px;
}

.totalizadores span {
  display: inline-block;
  margin-right: 15px;
  font-weight: 600;
}
</style>
</head>

<body>

<!-- SPINNER -->
<div id="spinnerCsv" class="spinner-overlay">
  <div class="spinner-border text-primary"></div>
  <div class="spinner-text">Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<!-- FILTROS -->
<div class="row gx-2 gy-2 mb-3">

  <div class="col-sm-2">
    <label>Ano *</label>
    <select id="anoFiltro" class="form-select form-select-sm"></select>
  </div>

  <div class="col-sm-2"><label>Origem</label>
    <select id="origemFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Tipo</label>
    <select id="tipoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Autoria</label>
    <select id="autoriaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Número</label>
    <select id="numeroFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Objeto</label>
    <select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Recebedor</label>
    <select id="recebedorFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>CNPJ</label>
    <select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Natureza</label>
    <select id="naturezaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Função</label>
    <select id="funcaoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

</div>

<!-- TOTALIZADOR -->
<div class="totalizadores mb-2" id="resumoValores" style="display:none;">
  <span id="totalPrevisto">Valor alocado/previsto: R$ 0,00</span>
</div>

<!-- BOTÕES -->
<div class="d-flex justify-content-between mb-2">

  <button id="btnLimpar" class="btn btn-outline-primary btn-sm">
    Limpar
  </button>

  <div class="btn-group">
    <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnXls" class="btn btn-outline-secondary btn-sm">XLS</button>
    <button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
  </div>

</div>

<!-- TABELA -->
<div class="table-responsive">
  <table id="tabela" class="table table-bordered table-striped table-sm w-100" style="display:none;"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
let tabela;
let dadosOriginais=[];

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

const colunaPrevisto="Valor alocado/previsto";

const campos={
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda",
  autoria:"Proponente",
  numero:"Identificação da Emenda",
  objeto:"Objeto da Despesa",
  recebedor:"Órgão ou entidade executora ou beneficiária",
  cnpj:"CNPJ do Órgão ou entidade executora ou beneficiária",
  natureza:"Grupo de Natureza de Despesa (GND)",
  funcao:"Função de Governo Função programática"
};

const ordem=Object.keys(campos);

/* DOWNLOAD ROBUSTO */
function baixarArquivoSeguro(conteudo,nome,tipo){
  let blob=new Blob([conteudo],{type:tipo});
  let url=URL.createObjectURL(blob);

  let link=document.createElement("a");
  link.href=url;
  link.download=nome;

  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* EXPORTAÇÃO FILTRADA */
function getDadosExportacao(){
  return tabela.rows({search:"applied"}).data().toArray();
}

/* NOME DINÂMICO */
function gerarNomeArquivo(ext){
  let partes=["emendas"];
  ordem.forEach(f=>{
    let v=$("#"+f+"Filtro").val();
    if(v && v!=="TODOS") partes.push(v.toLowerCase().replace(/\s+/g,"-"));
  });
  return partes.join("-")+"."+ext;
}

/* SOMATÓRIO */
function atualizarResumoPrevisto(dados){

  let total=0;

  function parseMoeda(v){
    if(!v) return 0;
    return parseFloat(
      v.toString()
       .replace(/[^\d\-,]/g,"")
       .replace(/\./g,"")
       .replace(",",".")
    ) || 0;
  }

  dados.forEach(r=>{
    total += parseMoeda(r[colunaPrevisto]);
  });

  $("#totalPrevisto").text(
    "Valor alocado/previsto: " +
    total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
  );

  $("#resumoValores").show();
}

/* POPULAR FILTRO */
function popularFiltro(id,campo,dados){

  let seletor=$("#"+id);
  let valorAtual=seletor.val();

  seletor.empty();
  seletor.append('<option value="">Selecione...</option>');

  let valores=[...new Set(dados.map(r=>r[campo]).filter(Boolean))].sort();

  valores.forEach(v=>{
    seletor.append(`<option value="${v}">${v}</option>`);
  });

  seletor.prop("disabled",valores.length===0);

  if(valores.includes(valorAtual)){
    seletor.val(valorAtual);
  }
}

/* FILTROS ENCADEADOS COMPLETOS */
function atualizarFiltrosEncadeados(){

  let ano=$("#anoFiltro").val();
  if(!ano) return;

  let base =
    (ano==="TODOS")
    ? [...dadosOriginais]
    : dadosOriginais.filter(r=>r[campos.ano]===ano);

  ordem.slice(1).forEach(f=>{

    // aplica filtros anteriores
    ordem.slice(1).forEach(outro=>{
      if(outro===f) return;

      let val=$("#"+outro+"Filtro").val();
      if(val){
        base=base.filter(r=>r[campos[outro]]===val);
      }
    });

    popularFiltro(f+"Filtro",campos[f],base);
  });
}

/* APLICA FILTROS */
function aplicarFiltros(){

  let ano=$("#anoFiltro").val();
  if(!ano) return;

  let base =
    (ano==="TODOS")
    ? [...dadosOriginais]
    : dadosOriginais.filter(r=>r[campos.ano]===ano);

  ordem.slice(1).forEach(f=>{
    let v=$("#"+f+"Filtro").val();
    if(v){
      base=base.filter(r=>r[campos[f]]===v);
    }
  });

  atualizarResumoPrevisto(base);
  renderTabela(base);
}

/* TABELA */
function renderTabela(dados){

  if(!dados.length) return;

  $("#tabela").show();

  if(tabela){
    tabela.clear().rows.add(dados).draw();
    return;
  }

  tabela=$("#tabela").DataTable({
    data:dados,
    columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
    pageLength:10,
    scrollX:true,
    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }
  });
}

/* CARREGAR CSV */
Papa.parse(urlCSV,{
 download:true,
 header:true,
 complete:r=>{

   dadosOriginais=r.data.filter(d=>d["Ano"]);

   $("#anoFiltro").append('<option value="">Selecione...</option>');
   $("#anoFiltro").append('<option value="TODOS">Todos</option>');

   [...new Set(dadosOriginais.map(r=>r["Ano"]))].sort()
     .forEach(v=>{
       $("#anoFiltro").append(`<option value="${v}">${v}</option>`);
     });

   $("#spinnerCsv").fadeOut();
 }
});

/* EVENTOS */
$("#anoFiltro").on("change",function(){

  ordem.slice(1).forEach(f=>{
    $("#"+f+"Filtro").prop("disabled",false).val("");
  });

  atualizarFiltrosEncadeados();
  aplicarFiltros();
});

ordem.slice(1).forEach(f=>{
  $("#"+f+"Filtro").on("change",function(){
    atualizarFiltrosEncadeados();
    aplicarFiltros();
  });
});

/* LIMPAR */
$("#btnLimpar").on("click",()=>location.reload());

/* EXPORTAÇÃO */
$("#btnCsv").on("click",()=>{
  let d=getDadosExportacao();
  let csv=Papa.unparse(d,{delimiter:";",quotes:true});
  baixarArquivoSeguro("\uFEFF"+csv,gerarNomeArquivo("csv"),"text/csv;charset=utf-8;");
});

$("#btnXls").on("click",()=>{
  let d=getDadosExportacao();
  let ws=XLSX.utils.json_to_sheet(d);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Emendas");
  XLSX.writeFile(wb,gerarNomeArquivo("xlsx"));
});

$("#btnTxt").on("click",()=>{
  let d=getDadosExportacao();
  let txt=d.map(o=>Object.values(o).join(" | ")).join("\n");
  baixarArquivoSeguro(txt,gerarNomeArquivo("txt"),"text/plain;charset=utf-8;");
});

$("#btnJson").on("click",()=>{
  let d=getDadosExportacao();
  baixarArquivoSeguro(JSON.stringify(d,null,2),gerarNomeArquivo("json"),"application/json;charset=utf-8;");
});
</script>

</body>
</html>
