<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Consulta de Emendas – Execução da Despesa</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css"/>

<style>
body { background-color:#f8f9fa; }
.dataTables_filter { display:none; }

label{
  font-size:0.7rem;
  font-weight:600;
  color:#343a40;
}
.form-select-sm, table{
  font-size:0.7rem !important;
}
table.dataTable td, table.dataTable th{
  white-space:nowrap;
}
#tabela{ display:none; }

/* BOTÕES – PADRÃO index2.html */
.dt-buttons .btn{
  padding:0.25rem 0.5rem;
  font-size:0.7rem;
}
.dataTables_wrapper .dataTables_paginate{
  margin-top:0.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}
.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  font-size:0.65rem !important;
  border-radius:6px !important;
  background:#e9ecef !important;
  border:1px solid #dee2e6 !important;
}
.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd !important;
  color:#fff !important;
  font-weight:bold;
}

/* EXPORTAÇÃO */
.export-group .btn{
  font-size:0.7rem;
  padding:4px 8px;
}

/* REGISTROS POR PÁGINA */
#lengthSelector{
  width:70px;
  font-size:0.7rem;
}

/* INDICADOR */
#indicadorAtualizacao{
  font-size:0.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:6px;
}
</style>
</head>

<body>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
  Dados extraídos de base oficial | Lei nº 14.129/2021
</div>

<!-- FILTROS -->
<div class="row gx-2 gy-2 mb-3">
  <div class="col-sm-2"><label>Ano *</label><select id="anoFiltro" class="form-select form-select-sm"></select></div>
  <div class="col-sm-2"><label>Origem</label><select id="origemFiltro" class="form-select form-select-sm" disabled></select></div>
  <div class="col-sm-2"><label>Tipo</label><select id="tipoFiltro" class="form-select form-select-sm" disabled></select></div>
  <div class="col-sm-2"><label>Autoria</label><select id="autoriaFiltro" class="form-select form-select-sm" disabled></select></div>
  <div class="col-sm-2"><label>Número</label><select id="numeroFiltro" class="form-select form-select-sm" disabled></select></div>
  <div class="col-sm-2"><label>Objeto</label><select id="objetoFiltro" class="form-select form-select-sm" disabled></select></div>
  <div class="col-sm-2"><label>Recebedor</label><select id="recebedorFiltro" class="form-select form-select-sm" disabled></select></div>
  <div class="col-sm-2"><label>CNPJ</label><select id="cnpjFiltro" class="form-select form-select-sm" disabled></select></div>
  <div class="col-sm-2"><label>Natureza</label><select id="naturezaFiltro" class="form-select form-select-sm" disabled></select></div>
  <div class="col-sm-2"><label>Função</label><select id="funcaoFiltro" class="form-select form-select-sm" disabled></select></div>
</div>

<!-- REGISTROS + EXPORTAÇÃO -->
<div class="d-flex justify-content-between align-items-center mb-2">
  <div>
    <label>Registros por página:</label>
    <select id="lengthSelector" class="form-select form-select-sm d-inline-block">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
  </div>

  <div class="export-group">
    <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnXls" class="btn btn-outline-secondary btn-sm">XLS</button>
    <button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
    <button id="btnPdf" class="btn btn-outline-secondary btn-sm">PDF</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
  </div>
</div>

<!-- TABELA -->
<div class="table-responsive">
  <table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
let tabela, dadosOriginais=[];

const campos={
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda",
  autoria:"Proponente",
  numero:"Identificação da Emenda",
  funcao:"Função de Governo Função programática",
  natureza:"Grupo de Natureza de Despesa (GND)",
  objeto:"Objeto da Despesa",
  recebedor:"Órgão ou entidade executora ou beneficiária",
  cnpj:"CNPJ do Órgão ou entidade executora ou beneficiária"
};
const ordem=Object.keys(campos);

Papa.parse(
 "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv",
 {download:true,header:true,complete:r=>{
   dadosOriginais=r.data.filter(d=>d[campos.ano]);
   popular("anoFiltro",campos.ano,dadosOriginais);
 }}
);

ordem.forEach(f=>$('#'+f+'Filtro').on('change',atualizar));

function popular(id,campo,base){
 let s=$('#'+id).empty().append('<option value="">Todos</option>');
 [...new Set(base.map(r=>r[campo]).filter(Boolean))].sort().forEach(v=>s.append(`<option>${v}</option>`));
 s.prop('disabled',false);
}

function atualizar(){
 if(!$('#anoFiltro').val()) return;

 let dados=dadosOriginais;
 ordem.forEach(f=>{
   let v=$('#'+f+'Filtro').val();
   if(v) dados=dados.filter(r=>r[campos[f]]===v);
 });

 ordem.forEach(f=>{
   if(!$('#'+f+'Filtro').val()){
     popular(f+'Filtro',campos[f],dados);
   }
 });

 $('#tabela').show();

 if(tabela){
   tabela.clear().rows.add(dados).draw();
   return;
 }

 tabela=$('#tabela').DataTable({
   data:dados,
   columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
   pageLength:10,
   scrollX:true,
   dom:'Bfrtip',
   buttons:[
     {extend:'csvHtml5'},
     {extend:'excelHtml5'},
     {extend:'pdfHtml5',orientation:'landscape'}
   ],
   language:{url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"}
 });

 $('#btnCsv').click(()=>$('.buttons-csv').click());
 $('#btnXls').click(()=>$('.buttons-excel').click());
 $('#btnPdf').click(()=>$('.buttons-pdf').click());

 $('#btnJson').click(()=>{
   baixar(new Blob([JSON.stringify(tabela.rows().data().toArray(),null,2)],{type:'application/json'}),'dados.json');
 });
 $('#btnTxt').click(()=>{
   let d=tabela.rows().data().toArray();
   let c=Object.keys(d[0]);
   let t=c.join(';')+'\n'+d.map(r=>c.map(k=>r[k]).join(';')).join('\n');
   baixar(new Blob([t],{type:'text/plain'}),'dados.txt');
 });

 $('#lengthSelector').on('change',function(){
   tabela.page.len(this.value).draw();
 });
}

function baixar(b,n){
 let a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=n;a.click();
}
</script>

</body>
</html>
