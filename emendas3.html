<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Emendas - IN 05/2025 - TCE/MG</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css"/>

<style>

body{
  background-color:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

/* Fonte geral */
.form-label,
.form-select-sm,
.form-control-sm,
.table th,
.table td{
  font-size:.65rem !important;
}

.xsmall{
  font-size:.6rem !important;
}

/* Tabela */
table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

/* Atualização */
#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

/* Spinner */
.spinner-overlay,
.spinner-overlay-filtro{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
}

.spinner-overlay{
  background-color:rgba(255,255,255,.9);
}

.spinner-overlay-filtro{
  background-color:rgba(255,255,255,.5);
  z-index:9998;
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

/* Labels */
.row label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
  padding-left:2px;
}

/* Inputs */
.form-select-sm,
.form-control-sm{
  border-radius:4px !important;
  padding:2px 6px !important;
  background-color:#fff !important;
  border:1px solid #ced4da !important;
  font-size:.7rem !important;
}

/* Totalizadores */
.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  display:inline-block;
  margin-right:15px;
  font-weight:500;
}

/* Wrapper tabela */
.table-wrapper{
  overflow-x:auto;
}

/* Info tabela */
.dataTables_info{
  font-size:.65rem !important;
  color:#6c757d !important;
  margin-top:8px;
  padding-left:5px;
}

/* Paginação */
.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:4px;
  padding:6px 0;
  font-size:.7rem;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  margin:0 2px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background-color:#e9ecef !important;
  border:1px solid #dee2e6 !important;
  color:#212529 !important;
  transition:background-color .2s ease;
}

.dataTables_wrapper .dataTables_paginate .paginate_button:hover{
  background-color:#d0d7df !important;
  color:#212529 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background-color:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

/* Botões */
.btn-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

/* Registros */
#lengthSelectorContainer{
  margin-top:10px;
  font-size:.75rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
}

#lengthSelector{
  width:70px;
  font-size:.75rem;
  padding:2px 4px;
}

</style>
</head>

<body>

<!-- SPINNER PRINCIPAL -->
<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<!-- SPINNER FILTROS -->
<div
  id="spinnerFiltro"
  class="spinner-overlay-filtro"
  style="display:none;"
>

  <div class="spinner-border text-secondary"></div>

  <div class="spinner-text">
    Atualizando filtros...
  </div>

</div>

<div class="container-fluid mt-3">

  <!-- ATUALIZAÇÃO -->
  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Ano *</label>
      <select id="anoFiltro" class="form-select form-select-sm"></select>
    </div>

    <div class="col-sm-2">
      <label>Origem</label>
      <select id="origemFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Tipo</label>
      <select id="tipoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Autoria</label>
      <select id="autoriaFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Número</label>
      <select id="numeroFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Objeto</label>
      <select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Recebedor</label>
      <select id="recebedorFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>CNPJ</label>
      <select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Natureza</label>
      <select id="naturezaFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Função</label>
      <select id="funcaoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

  </div>

  <!-- TOTALIZADORES -->
  <div
    class="totalizadores mb-2"
    id="resumoValores"
    style="display:none;"
  >

    <span id="totalPrevisto">
      Valor previsto: R$ 0,00
    </span>

  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="btn-group">

      <button
        id="exportCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="exportXls"
        class="btn btn-outline-secondary btn-sm"
      >
        XLSX
      </button>

      <button
        id="exportJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

      <button
        id="exportTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

    </div>

  </div>

  <!-- TABELA -->
  <div class="table-wrapper">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm xsmall w-100"
      style="display:none;"
    ></table>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label for="lengthSelector">
      Registros por página:
    </label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm d-inline-block"
    >
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

const campos = {
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda",
  autoria:"Proponente",
  numero:"Identificação da Emenda",
  objeto:"Objeto da Despesa",
  recebedor:"Órgão ou entidade executora ou beneficiária",
  cnpj:"CNPJ do Órgão ou entidade executora ou beneficiária",
  natureza:"Grupo de Natureza de Despesa (GND)",
  funcao:"Função de Governo Função programática"
};

const ordemFiltros = [
  "ano",
  "origem",
  "tipo",
  "autoria",
  "numero",
  "objeto",
  "recebedor",
  "cnpj",
  "natureza",
  "funcao"
];

/* =========================
   CARREGAR CSV
========================= */

$(document).ready(function(){

  Papa.parse(urlCSV,{

    download:true,
    header:true,
    skipEmptyLines:true,

    complete:function(resultado){

      dadosOriginais = resultado.data.filter(
        r => r["Ano"]
      );

      const linhaAtualizacao = dadosOriginais.find(
        r => r["Atualizacao"]
      );

      if(linhaAtualizacao){

        $("#indicadorAtualizacao").html(
          `Dados atualizados em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
        );

      }

      dadosOriginais = dadosOriginais.map(r=>{

        const copia = {...r};

        delete copia["Atualizacao"];

        return copia;

      });

      popularFiltro(
        "anoFiltro",
        campos.ano,
        dadosOriginais
      );

      $("#spinnerCsv").fadeOut(200);

      inicializarEventos();

    },

    error:function(){

      $("#spinnerCsv").hide();

      alert("Erro ao carregar os dados.");

    }

  });

});

/* =========================
   EVENTOS
========================= */

function inicializarEventos(){

  ordemFiltros.forEach(f=>{

    $("#"+f+"Filtro").on("change",()=>{

      $("#spinnerFiltro").show();

      setTimeout(()=>{

        atualizarFiltros();

        const dados = aplicarFiltros();

        inicializarTabela(dados);

        $("#spinnerFiltro").hide();

      },100);

    });

  });

  $("#btnLimpar").on("click",limparFiltros);

  $("#lengthSelector").on("change",function(){

    if(tabela){

      tabela
        .page
        .len(parseInt(this.value))
        .draw();

    }

  });

  $("#exportCsv").on("click",()=>$(".buttons-csv").click());

  $("#exportXls").on("click",()=>$(".buttons-excel").click());

  $("#exportJson").on("click",exportarJson);

  $("#exportTxt").on("click",exportarTxt);

}

/* =========================
   POPULAR FILTROS
========================= */

function popularFiltro(id,campo,dados,valorAtual=""){

  const seletor = $("#"+id);

  seletor.empty();

  seletor.append(`
    <option value="">
      Todos
    </option>
  `);

  let valores = [
    ...new Set(
      dados
        .map(r=>r[campo])
        .filter(Boolean)
    )
  ];

  valores.sort((a,b)=>
    a.toString().localeCompare(
      b.toString(),
      "pt-BR",
      {numeric:true}
    )
  );

  valores.forEach(v=>{

    seletor.append(`
      <option value="${v}">
        ${v}
      </option>
    `);

  });

  seletor.prop("disabled",false);

  if(valorAtual && valores.includes(valorAtual)){
    seletor.val(valorAtual);
  }

}

/* =========================
   APLICAR FILTROS
========================= */

function aplicarFiltros(){

  return ordemFiltros.reduce((base,filtro)=>{

    const valor =
      $("#"+filtro+"Filtro").val();

    if(!valor){
      return base;
    }

    return base.filter(
      r => r[campos[filtro]] === valor
    );

  },dadosOriginais);

}

/* =========================
   FILTRO IGNORANDO
========================= */

function aplicarFiltroIgnorando(filtroIgnorado){

  return ordemFiltros.reduce((base,filtro)=>{

    if(filtro === filtroIgnorado){
      return base;
    }

    const valor =
      $("#"+filtro+"Filtro").val();

    if(!valor){
      return base;
    }

    return base.filter(
      r => r[campos[filtro]] === valor
    );

  },dadosOriginais);

}

/* =========================
   ATUALIZAR FILTROS
========================= */

function atualizarFiltros(){

  ordemFiltros.forEach((filtro,index)=>{

    if(index === 0){
      return;
    }

    const seletor =
      $("#"+filtro+"Filtro");

    const valorAtual =
      seletor.val();

    const base =
      aplicarFiltroIgnorando(filtro);

    popularFiltro(
      filtro+"Filtro",
      campos[filtro],
      base,
      valorAtual
    );

  });

}

/* =========================
   LIMPAR FILTROS
========================= */

function limparFiltros(){

  ordemFiltros.forEach((filtro,index)=>{

    $("#"+filtro+"Filtro")
      .val("")
      .prop("disabled",index !== 0);

  });

  $("#resumoValores").hide();

  $("#tabela")
    .hide()
    .empty();

  if(tabela){

    tabela.destroy();

    tabela = null;

  }

  atualizarFiltros();

}

/* =========================
   TABELA
========================= */

function inicializarTabela(dados){

  if(!dados.length){

    $("#tabela")
      .hide()
      .empty();

    $("#resumoValores").hide();

    if(tabela){

      tabela.destroy();

      tabela = null;

    }

    return;

  }

  $("#tabela").show();

  const pageLength =
    parseInt(
      $("#lengthSelector").val()
    ) || 10;

  if(tabela){

    tabela.destroy();

    $("#tabela").empty();

  }

  const colunas =
    Object.keys(dados[0]).map(c=>({

      title:c,

      data:c

    }));

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:colunas,

    destroy:true,

    pageLength:pageLength,

    searching:true,

    ordering:true,

    autoWidth:false,

    scrollX:true,

    dom:"Bfrtip",

    buttons:[

      {
        extend:"csvHtml5",
        className:"d-none",
        bom:true,
        fieldSeparator:";",
        filename:()=>gerarNomeArquivo("csv").replace(".csv","")
      },

      {
        extend:"excelHtml5",
        className:"d-none",
        filename:()=>gerarNomeArquivo("xlsx").replace(".xlsx","")
      }

    ],

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

  atualizarResumo(dados);

}

/* =========================
   TOTALIZADOR
========================= */

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();

    return;

  }

  let total = 0;

  dados.forEach(r=>{

    total += parseMoeda(
      r["Valor alocado/previsto"]
    );

  });

  $("#totalPrevisto").text(

    "Valor previsto: " +

    total.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )

  );

  $("#resumoValores").show();

}

/* =========================
   PARSE MOEDA
========================= */

function parseMoeda(valor){

  if(!valor){
    return 0;
  }

  return parseFloat(

    valor
      .toString()
      .replace(/[^\d,-]/g,"")
      .replace(/\./g,"")
      .replace(",", ".")

  ) || 0;

}

/* =========================
   EXPORTAÇÕES
========================= */

function exportarJson(){

  if(!tabela){
    return;
  }

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  baixarArquivo(

    new Blob(
      [JSON.stringify(dados,null,2)],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

}

function exportarTxt(){

  if(!tabela){
    return;
  }

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  if(!dados.length){
    return;
  }

  const colunas =
    Object.keys(dados[0]);

  const txt =
    colunas.join(";") +
    "\n" +
    dados
      .map(l=>
        colunas
          .map(c=>l[c])
          .join(";")
      )
      .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

}

/* =========================
   DOWNLOAD
========================= */

function baixarArquivo(blob,nome){

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download = nome;

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

}

/* =========================
   NOME ARQUIVO
========================= */

function gerarNomeArquivo(ext){

  let partes = ["dados-emendas"];

  ordemFiltros.forEach(f=>{

    const valor =
      $("#"+f+"Filtro").val();

    if(valor){

      partes.push(

        valor
          .toString()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/\s+/g,"-")
          .replace(/[^\w-]/g,"")

      );

    }

  });

  return partes.join("-")+"."+ext;

}

</script>

</body>
</html>
