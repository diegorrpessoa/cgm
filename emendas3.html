<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta de Emendas</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css"/>

  <style>
    body { background-color:#f8f9fa; }
    .dataTables_filter { display:none; }
    label {
      font-size:0.7rem;
      font-weight:600;
      color:#343a40;
    }
    .form-select-sm, table {
      font-size:0.7rem !important;
    }
    table.dataTable td, table.dataTable th {
      white-space:nowrap;
    }
    #tabela { display:none; }
  </style>
</head>

<body>

<div class="container-fluid mt-4">

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Ano *</label>
      <select id="anoFiltro" class="form-select form-select-sm"></select>
    </div>

    <div class="col-sm-2">
      <label>Origem dos Recursos</label>
      <select id="origemFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Tipo de Emenda</label>
      <select id="tipoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Proponente</label>
      <select id="autoriaFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Identificação da Emenda</label>
      <select id="numeroFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Objeto da Despesa</label>
      <select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Órgão / Entidade Beneficiária</label>
      <select id="recebedorFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>CNPJ do Recebedor</label>
      <select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Grupo de Natureza da Despesa (GND)</label>
      <select id="naturezaFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-2">
      <label>Função de Governo</label>
      <select id="funcaoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

  </div>

  <!-- TABELA -->
  <div class="table-responsive">
    <table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

<!-- BOTÕES DE EXPORTAÇÃO -->
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
let dadosOriginais = [];
let tabela = null;

/* MAPEAMENTO DOS CAMPOS */
const campos = {
  ano: "Ano",
  origem: "Origem dos recursos",
  tipo: "Tipo de emenda",
  autoria: "Proponente",
  numero: "Identificação da Emenda",
  funcao: "Função de Governo Função programática",
  natureza: "Grupo de Natureza de Despesa (GND)",
  objeto: "Objeto da Despesa",
  recebedor: "Órgão ou entidade executora ou beneficiária",
  cnpj: "CNPJ do Órgão ou entidade executora ou beneficiária"
};

const ordemFiltros = [
  "ano","origem","tipo","autoria","numero",
  "objeto","recebedor","cnpj","natureza","funcao"
];

$(document).ready(function(){

  Papa.parse(
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv",
    {
      download:true,
      header:true,
      skipEmptyLines:true,
      complete:function(res){
        dadosOriginais = res.data.filter(r => r[campos.ano]);
        popularFiltro("anoFiltro", campos.ano, dadosOriginais);
      }
    }
  );

  ordemFiltros.forEach(f=>{
    $('#'+f+'Filtro').on('change',function(){

      if(f==="ano" && !this.value){
        $('#tabela').hide();
        if(tabela) tabela.clear().draw();
        return;
      }

      resetFiltrosApos(f);
      atualizarFiltrosEncadeados(f);
      inicializarTabela(aplicarFiltros());
    });
  });
});

function popularFiltro(id,campo,dados){
  const s = $('#'+id);
  s.empty().append('<option value="">Todos</option>');
  [...new Set(dados.map(d=>d[campo]).filter(Boolean))]
    .sort()
    .forEach(v=>s.append(`<option value="${v}">${v}</option>`));
  s.prop('disabled',false);
}

function resetFiltrosApos(f){
  ordemFiltros.slice(ordemFiltros.indexOf(f)+1).forEach(k=>{
    $('#'+k+'Filtro').val('').prop('disabled',true);
  });
}

function atualizarFiltrosEncadeados(f){
  let base = dadosOriginais;
  for(let i=0;i<=ordemFiltros.indexOf(f);i++){
    const v = $('#'+ordemFiltros[i]+'Filtro').val();
    if(v) base = base.filter(r => r[campos[ordemFiltros[i]]] === v);
  }
  ordemFiltros.slice(ordemFiltros.indexOf(f)+1).forEach(k=>{
    popularFiltro(k+'Filtro', campos[k], base);
  });
}

function aplicarFiltros(){
  return ordemFiltros.reduce((acc,f)=>{
    const v = $('#'+f+'Filtro').val();
    return v ? acc.filter(r => r[campos[f]] === v) : acc;
  }, dadosOriginais);
}

function inicializarTabela(dados){
  if(!$('#anoFiltro').val()) return;
  $('#tabela').show();

  if(tabela){
    tabela.clear().rows.add(dados).draw();
    return;
  }

  const colunas = Object.keys(dados[0]).map(c=>({title:c,data:c}));

  tabela = $('#tabela').DataTable({
    data: dados,
    columns: colunas,
    pageLength: 10,
    lengthMenu: [[10,25,50,100],[10,25,50,100]],
    scrollX: true,
    dom: 'Blfrtip',
    buttons: [
      { extend:'csvHtml5', text:'CSV' },
      { extend:'excelHtml5', text:'XLS' },
      {
        text:'TXT',
        action:function(){
          const txt = Papa.unparse(dados);
          download(txt,'dados.txt','text/plain');
        }
      },
      {
        text:'JSON',
        action:function(){
          download(JSON.stringify(dados,null,2),'dados.json','application/json');
        }
      },
      { extend:'pdfHtml5', text:'PDF', orientation:'landscape', pageSize:'A4' }
    ],
    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }
  });
}

function download(content,filename,type){
  const blob = new Blob([content],{type:type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
</script>

</body>
</html>
