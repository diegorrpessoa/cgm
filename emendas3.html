<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Painel de Emendas – CGM</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">

<style>
body{
  background:#f8f9fa;
  font-size:14px;
}
.filtros select{
  margin-bottom:6px;
}
.dt-buttons{
  display:none;
}
.export-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
}
.export-bar button{
  margin-left:4px;
}
.info-atualizacao{
  font-size:12px;
  color:#555;
}
</style>
</head>

<body class="container-fluid p-3">

<h5 class="mb-3">Painel de Emendas Parlamentares</h5>

<div class="row filtros">
  <div class="col-md-2">
    <label>Ano *</label>
    <select id="anoFiltro" class="form-select" disabled></select>
  </div>
  <div class="col-md-2"><label>Origem</label><select id="origemFiltro" class="form-select" disabled></select></div>
  <div class="col-md-2"><label>Tipo</label><select id="tipoFiltro" class="form-select" disabled></select></div>
  <div class="col-md-2"><label>Autoria</label><select id="autoriaFiltro" class="form-select" disabled></select></div>
  <div class="col-md-2"><label>Número</label><select id="numeroFiltro" class="form-select" disabled></select></div>
  <div class="col-md-2"><label>Objeto</label><select id="objetoFiltro" class="form-select" disabled></select></div>
</div>

<div class="row filtros">
  <div class="col-md-3"><label>Recebedor</label><select id="recebedorFiltro" class="form-select" disabled></select></div>
  <div class="col-md-3"><label>CNPJ</label><select id="cnpjFiltro" class="form-select" disabled></select></div>
  <div class="col-md-3"><label>Natureza</label><select id="naturezaFiltro" class="form-select" disabled></select></div>
  <div class="col-md-3"><label>Função</label><select id="funcaoFiltro" class="form-select" disabled></select></div>
</div>

<hr>

<table id="tabela" class="display nowrap" style="width:100%; display:none;"></table>

<div class="export-bar">
  <div>
    <label>Registros por página:</label>
    <select id="lengthSelector" class="form-select d-inline-block w-auto">
      <option>10</option><option>25</option><option>50</option><option>100</option>
    </select>
  </div>

  <div>
    <button id="btnCsv"  class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnXls"  class="btn btn-outline-secondary btn-sm">XLS</button>
    <button id="btnTxt"  class="btn btn-outline-secondary btn-sm">TXT</button>
    <button id="btnPdf"  class="btn btn-outline-secondary btn-sm">PDF</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
  </div>
</div>

<div class="text-end info-atualizacao mt-1" id="infoAtualizacao"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

<script>
let tabela, dadosOriginais=[];

const campos={
 ano:"Ano",
 origem:"Origem dos recursos",
 tipo:"Tipo de emenda",
 autoria:"Proponente",
 numero:"Identificação da Emenda",
 funcao:"Função de Governo Função programática",
 natureza:"Grupo de Natureza de Despesa (GND)",
 objeto:"Objeto da Despesa",
 recebedor:"Órgão ou entidade executora ou beneficiária",
 cnpj:"CNPJ do Órgão ou entidade executora ou beneficiária"
};

const ordem=["ano","origem","tipo","autoria","numero","objeto","recebedor","cnpj","natureza","funcao"];

Papa.parse(
 "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv",
 {
  download:true,
  header:true,
  skipEmptyLines:true,
  complete:r=>{
    dadosOriginais=r.data.filter(d=>d[campos.ano]);
    popularFiltro("anoFiltro",campos.ano,dadosOriginais);
    $("#anoFiltro").prop("disabled",false);
    $("#infoAtualizacao").text("Fonte de dados: Google Sheets – atualização conforme última publicação da base.");
  }
 }
);

ordem.forEach(f=>{
 $("#"+f+"Filtro").on("change",function(){
   if(f==="ano" && !this.value){
     $("#tabela").hide();
     resetFiltrosApos("ano");
     if(tabela) tabela.clear().draw();
     return;
   }
   resetFiltrosApos(f);
   atualizarFiltrosEncadeados(f);
   inicializarTabela(aplicarFiltros());
 });
});

function popularFiltro(id,campo,dados){
 const s=$("#"+id);
 s.empty().append('<option value="">Selecione...</option>');
 [...new Set(dados.map(r=>r[campo]).filter(Boolean))].sort()
   .forEach(v=>s.append(`<option value="${v}">${v}</option>`));
 s.prop("disabled",false);
}

function resetFiltrosApos(f){
 ordem.slice(ordem.indexOf(f)+1).forEach(k=>{
   $("#"+k+"Filtro").val("").prop("disabled",true);
 });
}

function atualizarFiltrosEncadeados(f){
 let base=dadosOriginais;
 for(let i=0;i<=ordem.indexOf(f);i++){
   const v=$("#"+ordem[i]+"Filtro").val();
   if(v) base=base.filter(r=>r[campos[ordem[i]]]==v);
 }
 ordem.slice(ordem.indexOf(f)+1).forEach(k=>{
   popularFiltro(k+"Filtro",campos[k],base);
 });
}

function aplicarFiltros(){
 return ordem.reduce((acc,f)=>{
   const v=$("#"+f+"Filtro").val();
   return v?acc.filter(r=>r[campos[f]]==v):acc;
 },dadosOriginais);
}

function inicializarTabela(dados){
 if(!$("#anoFiltro").val()) return;
 $("#tabela").show();

 if(tabela){
   tabela.clear().rows.add(dados).draw();
   return;
 }

 tabela=$("#tabela").DataTable({
  data:dados,
  columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
  pageLength:10,
  lengthMenu:[[10,25,50,100],[10,25,50,100]],
  scrollX:true,
  dom:"Bfrtip",
  buttons:[
   {extend:"csvHtml5"},
   {extend:"excelHtml5"},
   {extend:"pdfHtml5",orientation:"landscape"}
  ],
  language:{url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"}
 });

 $("#btnCsv").click(()=>$(".buttons-csv").click());
 $("#btnXls").click(()=>$(".buttons-excel").click());
 $("#btnPdf").click(()=>$(".buttons-pdf").click());

 $("#btnTxt").click(()=>{
   const d=tabela.rows().data().toArray();
   const c=Object.keys(d[0]);
   const t=c.join(";")+"\n"+d.map(r=>c.map(k=>r[k]).join(";")).join("\n");
   download(new Blob([t],{type:"text/plain"}),"dados.txt");
 });

 $("#btnJson").click(()=>{
   download(new Blob([JSON.stringify(tabela.rows().data().toArray(),null,2)],{type:"application/json"}),"dados.json");
 });

 $("#lengthSelector").on("change",function(){
   tabela.page.len(this.value).draw();
 });
}

function download(b,n){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(b);
 a.download=n;
 a.click();
}
</script>

</body>
</html>
