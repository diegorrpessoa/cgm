<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel de Emendas - IN 05/2025 - TCE/MG</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<!-- Select2 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"/>

<style>
body{background:#f8f9fa;}
.dataTables_filter{display:none}

label{
  font-size:.7rem;
  font-weight:600;
  color:#343a40;
}

.form-select-sm,table{
  font-size:.7rem!important;
}

table.dataTable td,table.dataTable th{
  white-space:nowrap;
}

#tabela{display:none}

.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px!important;
  font-size:.65rem!important;
  border-radius:6px!important;
  background:#e9ecef!important;
  border:1px solid #dee2e6!important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd!important;
  color:#fff!important;
  font-weight:bold;
}

.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

#lengthSelector{
  width:70px;
  font-size:.7rem;
}

/* ✅ Atualização discreta 70% preto */
#indicadorAtualizacao{
  font-size:.65rem;
  color:rgba(0,0,0,0.7);
  text-align:right;
  margin-bottom:8px;
}

/* Spinner */
#loadingOverlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.92);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

#loadingOverlay span{
  font-size:.7rem;
  margin-top:8px;
  color:#343a40;
}
</style>
</head>

<body>

<!-- Spinner -->
<div id="loadingOverlay">
  <div class="spinner-border text-primary"></div>
  <span>Carregando dados...</span>
</div>

<div class="container-fluid mt-3">

<!-- Atualização -->
<div id="indicadorAtualizacao">
  Última atualização: carregando...
</div>

<!-- FILTROS -->
<div class="row gx-2 gy-2 mb-3">

  <div class="col-sm-2"><label>Ano *</label>
    <select id="anoFiltro" class="form-select form-select-sm"></select>
  </div>

  <div class="col-sm-2"><label>Origem</label>
    <select id="origemFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Tipo</label>
    <select id="tipoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Autoria</label>
    <select id="autoriaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Número</label>
    <select id="numeroFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2"><label>Objeto</label>
    <select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

</div>

<!-- Botão limpar -->
<div class="d-flex justify-content-end mb-2">
  <button id="btnLimpar" class="btn btn-outline-primary btn-sm">
    Limpar Filtros
  </button>
</div>

<!-- Exportação -->
<div class="d-flex justify-content-between align-items-center mb-2">

  <div>
    <label class="me-1">Registros por página:</label>
    <select id="lengthSelector" class="form-select form-select-sm d-inline-block">
      <option>10</option>
      <option>25</option>
      <option>50</option>
      <option>100</option>
    </select>
  </div>

  <div class="export-group">
    <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnPdf" class="btn btn-outline-secondary btn-sm">PDF</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
  </div>

</div>

<!-- Tabela -->
<div class="table-responsive">
  <table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>

</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- Select2 -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- PDF Real -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script>
let tabela;
let dadosOriginais=[];
let ultimaAtualizacao="";

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

const campos={
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda",
  autoria:"Proponente",
  numero:"Identificação da Emenda",
  objeto:"Objeto da Despesa"
};

const ordem=Object.keys(campos);

/* CARREGAR CSV */
function carregarCSV(){

$("#loadingOverlay").show();

Papa.parse(urlCSV,{
  download:true,
  header:true,
  complete:r=>{

    dadosOriginais=r.data.filter(x=>x[campos.ano]);

    ultimaAtualizacao=dadosOriginais[0]["Atualizacao"];

    $("#indicadorAtualizacao").html(
      `Última atualização: <b>${ultimaAtualizacao}</b>`
    );

    // remove coluna Atualizacao
    dadosOriginais=dadosOriginais.map(r=>{
      let c={...r};
      delete c["Atualizacao"];
      return c;
    });

    iniciarFiltros();

    $("#loadingOverlay").fadeOut();
  }
});
}

/* FILTROS SELECT2 */
function iniciarFiltros(){

$("select").select2({
  width:"100%",
  placeholder:"Digite para buscar...",
  allowClear:true
});

popularFiltro("anoFiltro",dadosOriginais.map(x=>x[campos.ano]));

$("#anoFiltro").on("change",()=>cadeiaFiltros(1));
$("#origemFiltro").on("change",()=>cadeiaFiltros(2));
$("#tipoFiltro").on("change",()=>cadeiaFiltros(3));
$("#autoriaFiltro").on("change",()=>cadeiaFiltros(4));
$("#numeroFiltro").on("change",()=>cadeiaFiltros(5));
$("#objetoFiltro").on("change",aplicarFiltros);
}

/* Popular filtro */
function popularFiltro(id,valores){

let unicos=[...new Set(valores.filter(Boolean))].sort();

$("#"+id).empty().append(`<option></option>`);

unicos.forEach(v=>{
  $("#"+id).append(`<option value="${v}">${v}</option>`);
});

$("#"+id).prop("disabled",unicos.length===0);
}

/* Cadeia */
function cadeiaFiltros(nivel){

let base=filtrarBase(nivel);

let prox=ordem[nivel];
if(!prox) return;

popularFiltro(prox+"Filtro",base.map(x=>x[campos[prox]]));

$("#"+prox+"Filtro").prop("disabled",false);

aplicarFiltros();
}

/* Base filtrada */
function filtrarBase(nivel){

let base=dadosOriginais;

for(let i=0;i<nivel;i++){
  let chave=ordem[i];
  let val=$("#"+chave+"Filtro").val();
  if(val){
    base=base.filter(x=>x[campos[chave]]===val);
  }
}
return base;
}

/* Aplicar filtros */
function aplicarFiltros(){
  renderTabela(filtrarBase(ordem.length));
}

/* Render tabela */
function renderTabela(dados){

$("#tabela").show();

if(tabela){
  tabela.clear().rows.add(dados).draw();
  return;
}

tabela=$("#tabela").DataTable({
  data:dados,
  columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
  pageLength:10,
  scrollX:true,
  language:{
    url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
  }
});

$("#lengthSelector").on("change",function(){
  tabela.page.len(this.value).draw();
});
}

/* LIMPAR */
$("#btnLimpar").on("click",function(){
  location.reload();
});

/* EXPORTAÇÃO */
$("#btnCsv").on("click",function(){
  let csv=Papa.unparse(dadosOriginais);
  baixar(csv,"dados.csv","text/csv");
});

$("#btnJson").on("click",function(){
  baixar(JSON.stringify(dadosOriginais,null,2),"dados.json","application/json");
});

$("#btnPdf").on("click",function(){

const {jsPDF}=window.jspdf;
let doc=new jsPDF("l","mm","a4");

doc.text("Relatório Oficial – Emendas IN 05/2025",14,15);
doc.text("Última atualização: "+ultimaAtualizacao,14,22);

doc.autoTable({
  html:"#tabela",
  startY:30,
  theme:"grid",
  styles:{fontSize:7}
});

doc.save("Relatorio_Emendas.pdf");
});

/* Download */
function baixar(conteudo,nome,tipo){
  let blob=new Blob([conteudo],{type:tipo});
  let link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download=nome;
  link.click();
}

/* Atualização automática sem reload */
setInterval(()=>carregarCSV(),300000);

carregarCSV();
</script>

</body>
</html>
