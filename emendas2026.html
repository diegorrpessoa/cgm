<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Emendas – CGM | IN 05/2025 – TCE/MG</title>

<!-- GOV.BR Bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<!-- Select2 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"/>

<style>
/* ============================= */
/* GOV.BR DESIGN INSTITUCIONAL   */
/* ============================= */

body{
  background:#f8f9fa;
  font-family: "Rawline", Arial, sans-serif;
}

label{
  font-size:.75rem;
  font-weight:600;
  color:#1c1c1c;
}

.select2-container .select2-selection--single{
  height:34px;
  border-radius:6px;
  border:1px solid #ced4da;
  font-size:.75rem;
}

.select2-selection__rendered{
  line-height:32px!important;
}

#indicadorAtualizacao{
  font-size:.75rem;
  color:#0c326f;
  text-align:right;
  margin-bottom:10px;
}

.export-group .btn{
  font-size:.75rem;
  padding:5px 10px;
}

.dataTables_filter{display:none;}

table.dataTable th{
  background:#0c326f;
  color:#fff;
  font-size:.75rem;
}

table.dataTable td{
  font-size:.72rem;
  white-space:nowrap;
}

/* WCAG Focus */
button:focus, select:focus{
  outline:3px solid #ffbf47;
  outline-offset:2px;
}

/* Spinner */
#loadingOverlay{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.92);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

#loadingOverlay span{
  margin-top:10px;
  font-weight:600;
  color:#0c326f;
}
</style>
</head>

<body>

<!-- SPINNER -->
<div id="loadingOverlay" role="status" aria-live="polite">
  <div class="spinner-border text-primary"></div>
  <span>Carregando base oficial...</span>
</div>

<div class="container-fluid mt-3">

<!-- Atualização -->
<div id="indicadorAtualizacao">
  Atualizando...
</div>

<!-- FILTROS -->
<div class="row gx-2 gy-2 mb-3">

  <div class="col-sm-2">
    <label>Ano *</label>
    <select id="anoFiltro"></select>
  </div>

  <div class="col-sm-2">
    <label>Origem</label>
    <select id="origemFiltro" disabled></select>
  </div>

  <div class="col-sm-2">
    <label>Tipo</label>
    <select id="tipoFiltro" disabled></select>
  </div>

  <div class="col-sm-2">
    <label>Autoria</label>
    <select id="autoriaFiltro" disabled></select>
  </div>

  <div class="col-sm-2">
    <label>Número</label>
    <select id="numeroFiltro" disabled></select>
  </div>

  <div class="col-sm-2">
    <label>Objeto</label>
    <select id="objetoFiltro" disabled></select>
  </div>

</div>

<!-- EXPORTAÇÃO -->
<div class="d-flex justify-content-between align-items-center mb-2">

  <div>
    <label>Registros:</label>
    <select id="lengthSelector" class="form-select form-select-sm d-inline-block w-auto">
      <option>10</option>
      <option>25</option>
      <option>50</option>
      <option>100</option>
    </select>
  </div>

  <div class="export-group">
    <button id="btnPdf" class="btn btn-outline-primary btn-sm">PDF Tribunal</button>
    <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
  </div>

</div>

<!-- TABELA -->
<div class="table-responsive">
  <table id="tabela" class="table table-striped table-bordered w-100"></table>
</div>

</div>

<!-- SCRIPTS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- PDF REAL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script>
let tabela;
let dadosOriginais=[];
let ultimaAtualizacao="";

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

const campos={
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda",
  autoria:"Proponente",
  numero:"Identificação da Emenda",
  objeto:"Objeto da Despesa"
};

const ordem=Object.keys(campos);

/* ============================= */
/* CARREGAMENTO BASE             */
/* ============================= */

function carregarCSV(){

Papa.parse(urlCSV,{
  download:true,
  header:true,
  complete:r=>{

    dadosOriginais=r.data.filter(x=>x[campos.ano]);

    ultimaAtualizacao=dadosOriginais[0]["Atualizacao"];

    $("#indicadorAtualizacao").html(
      `📌 Última atualização oficial: <b>${ultimaAtualizacao}</b> – Lei 14.129/2021`
    );

    dadosOriginais=dadosOriginais.map(r=>{
      let c={...r};
      delete c["Atualizacao"];
      return c;
    });

    iniciarFiltros();
    $("#loadingOverlay").fadeOut();
  }
});
}

/* ============================= */
/* FILTROS ENCADEADOS            */
/* ============================= */

function iniciarFiltros(){

$("select").select2({
  width:"100%",
  placeholder:"Digite para buscar...",
  allowClear:true
});

popularFiltro("anoFiltro",dadosOriginais.map(x=>x[campos.ano]));

$("#anoFiltro").on("change",()=>atualizarCadeia(1));
$("#origemFiltro").on("change",()=>atualizarCadeia(2));
$("#tipoFiltro").on("change",()=>atualizarCadeia(3));
$("#autoriaFiltro").on("change",()=>atualizarCadeia(4));
$("#numeroFiltro").on("change",()=>atualizarCadeia(5));
$("#objetoFiltro").on("change",aplicarFiltros);
}

/* Popula filtro */
function popularFiltro(id,valores){

let unicos=[...new Set(valores.filter(Boolean))].sort();

$("#"+id).empty().append(`<option></option>`);

unicos.forEach(v=>{
  $("#"+id).append(`<option value="${v}">${v}</option>`);
});

$("#"+id).prop("disabled",unicos.length===0);
}

/* Cadeia */
function atualizarCadeia(nivel){

let base=filtrarBase(nivel);

let prox=ordem[nivel];
if(!prox) return;

popularFiltro(prox+"Filtro",base.map(x=>x[campos[prox]]));

$("#"+prox+"Filtro").prop("disabled",false);

aplicarFiltros();
}

/* Filtra base */
function filtrarBase(nivel){

let base=dadosOriginais;

for(let i=0;i<nivel;i++){
  let chave=ordem[i];
  let val=$("#"+chave+"Filtro").val();
  if(val){
    base=base.filter(x=>x[campos[chave]]===val);
  }
}
return base;
}

/* Aplica filtros */
function aplicarFiltros(){

let base=filtrarBase(ordem.length);

renderTabela(base);
}

/* ============================= */
/* TABELA                        */
/* ============================= */

function renderTabela(dados){

if(tabela){
  tabela.clear().rows.add(dados).draw();
  return;
}

tabela=$("#tabela").DataTable({
  data:dados,
  columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
  pageLength:10,
  scrollX:true,
  language:{
    url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
  }
});

$("#lengthSelector").on("change",function(){
  tabela.page.len(this.value).draw();
});
}

/* ============================= */
/* PDF TRIBUNAL                  */
/* ============================= */

$("#btnPdf").on("click",function(){

const {jsPDF}=window.jspdf;
let doc=new jsPDF("l","mm","a4");

doc.setFontSize(14);
doc.text("CONTROLADORIA GERAL DO MUNICÍPIO – JUIZ DE FORA",14,15);

doc.setFontSize(10);
doc.text("Relatório Oficial de Emendas – IN 05/2025 – TCE/MG",14,22);

doc.text("Última atualização: "+ultimaAtualizacao,14,28);

doc.autoTable({
  html:"#tabela",
  startY:35,
  theme:"grid",
  styles:{fontSize:7}
});

doc.save("Relatorio_Emendas_TCE.pdf");
});

/* ============================= */
/* AUTO UPDATE SEM RELOAD        */
/* ============================= */

setInterval(()=>carregarCSV(),300000); // 5 min

carregarCSV();
</script>

</body>
</html>
