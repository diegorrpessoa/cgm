<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel de Emendas - IN 05/2025 - TCE/MG</title>

<!-- Bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>

<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>

<style>
body{background:#f8f9fa;}
.dataTables_filter{display:none}

label{
  font-size:.7rem;
  font-weight:600;
  color:#343a40;
}

.form-select-sm,table{
  font-size:.7rem!important;
}

table.dataTable td,table.dataTable th{
  white-space:nowrap;
}

/* Select2 GOV */
.select2-container .select2-selection--single{
  height:32px;
  font-size:.7rem;
  border-radius:6px;
  border:1px solid #ced4da;
}
.select2-selection__rendered{
  line-height:30px!important;
}
.select2-selection__arrow{
  height:30px!important;
}

/* Spinner overlay */
#loadingOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  flex-direction:column;
}

#loadingOverlay span{
  font-size:.8rem;
  margin-top:10px;
  color:#0d6efd;
  font-weight:600;
}

/* Paginação */
.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px!important;
  font-size:.65rem!important;
  border-radius:6px!important;
  background:#e9ecef!important;
  border:1px solid #dee2e6!important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd!important;
  color:#fff!important;
  font-weight:bold;
}

/* Exportação */
.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

#lengthSelector{
  width:70px;
  font-size:.7rem;
}

#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

/* WCAG Focus */
select:focus, button:focus{
  outline:2px solid #0d6efd;
  outline-offset:2px;
}
</style>
</head>

<body>

<!-- SPINNER GOV -->
<div id="loadingOverlay" role="status" aria-live="polite">
  <div class="spinner-border text-primary" aria-hidden="true"></div>
  <span>Carregando dados públicos...</span>
</div>

<div class="container-fluid mt-3">

<!-- Atualização -->
<div id="indicadorAtualizacao" aria-label="Informação de atualização">
  Dados atualizados automaticamente... || Lei nº 14.129/2021
</div>

<!-- Filtros -->
<div class="row gx-2 gy-2 mb-3">

  <div class="col-sm-2">
    <label for="anoFiltro">Ano *</label>
    <select id="anoFiltro" class="form-select form-select-sm"></select>
  </div>

  <div class="col-sm-2">
    <label for="origemFiltro">Origem</label>
    <select id="origemFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2">
    <label for="tipoFiltro">Tipo</label>
    <select id="tipoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2">
    <label for="autoriaFiltro">Autoria</label>
    <select id="autoriaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2">
    <label for="numeroFiltro">Número</label>
    <select id="numeroFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2">
    <label for="objetoFiltro">Objeto</label>
    <select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2">
    <label for="recebedorFiltro">Recebedor</label>
    <select id="recebedorFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2">
    <label for="cnpjFiltro">CNPJ</label>
    <select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2">
    <label for="naturezaFiltro">Natureza</label>
    <select id="naturezaFiltro" class="form-select form-select-sm" disabled></select>
  </div>

  <div class="col-sm-2">
    <label for="funcaoFiltro">Função</label>
    <select id="funcaoFiltro" class="form-select form-select-sm" disabled></select>
  </div>

</div>

<!-- Limpar -->
<div class="d-flex justify-content-end mb-2">
  <button id="btnLimpar" class="btn btn-outline-primary btn-sm">
    Limpar Filtros
  </button>
</div>

<!-- Exportação -->
<div class="d-flex justify-content-between align-items-center mb-2">

  <div>
    <label class="me-1">Registros por página:</label>
    <select id="lengthSelector" class="form-select form-select-sm d-inline-block">
      <option>10</option>
      <option>25</option>
      <option>50</option>
      <option>100</option>
    </select>
  </div>

  <div class="export-group">
    <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
    <button id="btnXls" class="btn btn-outline-secondary btn-sm">XLS</button>
    <button id="btnPdf" class="btn btn-outline-secondary btn-sm">PDF</button>
    <button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
    <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
  </div>

</div>

<!-- Tabela -->
<div class="table-responsive">
  <table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>

</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<!-- Select2 -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
let tabela;
let dadosOriginais=[];

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv";

const campos={
  ano:"Ano",
  origem:"Origem dos recursos",
  tipo:"Tipo de emenda",
  autoria:"Proponente",
  numero:"Identificação da Emenda",
  objeto:"Objeto da Despesa",
  recebedor:"Órgão ou entidade executora ou beneficiária",
  cnpj:"CNPJ do Órgão ou entidade executora ou beneficiária",
  natureza:"Grupo de Natureza de Despesa (GND)",
  funcao:"Função de Governo Função programática"
};

const ordem=Object.keys(campos);

/* Carregamento CSV */
Papa.parse(urlCSV,{
 download:true,
 header:true,
 complete:r=>{

   dadosOriginais=r.data.filter(d=>d[campos.ano]);

   let linhaAtualizacao=dadosOriginais.find(x=>x["Atualizacao"]);
   if(linhaAtualizacao){
     $("#indicadorAtualizacao").html(
       `Dados atualizados automaticamente em: <b>${linhaAtualizacao["Atualizacao"]}</b> || Lei nº 14.129/2021`
     );
   }

   dadosOriginais=dadosOriginais.map(r=>{
     let copia={...r};
     delete copia["Atualizacao"];
     return copia;
   });

   carregarAno();

   /* Ativa Select2 */
   $("select").select2({
     width:"100%",
     placeholder:"Digite para buscar...",
     allowClear:true
   });

   $("#loadingOverlay").fadeOut();
 }
});

/* Ano */
function carregarAno(){
 let s=$("#anoFiltro");
 s.empty().append('<option></option>');
 [...new Set(dadosOriginais.map(r=>r[campos.ano]))]
   .sort()
   .forEach(v=>s.append(`<option>${v}</option>`));
}

/* Aplicar filtros */
function aplicarFiltros(){

 let ano=$("#anoFiltro").val();
 if(!ano) return;

 let base=dadosOriginais.filter(r=>r[campos.ano]===ano);

 ordem.slice(1).forEach(f=>{
   let v=$("#"+f+"Filtro").val();
   if(v){
     base=base.filter(r=>r[campos[f]]===v);
   }
 });

 renderTabela(base);
}

/* Eventos */
$("#anoFiltro").on("change",function(){
 ordem.slice(1).forEach(f=>{
   $("#"+f+"Filtro").prop("disabled",false);
 });
 aplicarFiltros();
});

ordem.slice(1).forEach(f=>{
 $("#"+f+"Filtro").on("change",aplicarFiltros);
});

/* Limpar */
$("#btnLimpar").on("click",function(){
 location.reload();
});

/* Render tabela */
function renderTabela(dados){

 $("#tabela").show();

 if(tabela){
   tabela.clear().rows.add(dados).draw();
   return;
 }

 tabela=$("#tabela").DataTable({
   data:dados,
   columns:Object.keys(dados[0]).map(c=>({title:c,data:c})),
   pageLength:10,
   scrollX:true,
   dom:"frtip",
   language:{
     url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
   }
 });

 $("#lengthSelector").on("change",function(){
   tabela.page.len(this.value).draw();
 });

 /* Exportações */
 $("#btnCsv").on("click",()=>baixarArquivo(Papa.unparse(dados),"dados.csv","text/csv"));

 $("#btnXls").on("click",()=>{
   let ws=XLSX.utils.json_to_sheet(dados);
   let wb=XLSX.utils.book_new();
   XLSX.utils.book_append_sheet(wb,ws,"Emendas");
   XLSX.writeFile(wb,"dados.xlsx");
 });

 $("#btnTxt").on("click",()=>{
   baixarArquivo(dados.map(o=>Object.values(o).join(" | ")).join("\n"),"dados.txt","text/plain");
 });

 $("#btnJson").on("click",()=>{
   baixarArquivo(JSON.stringify(dados,null,2),"dados.json","application/json");
 });

 $("#btnPdf").on("click",()=>{
   baixarArquivo("Exportação PDF simplificada.","dados.pdf","application/pdf");
 });
}

/* Download */
function baixarArquivo(conteudo,nome,tipo){
 let blob=new Blob([conteudo],{type:tipo});
 let link=document.createElement("a");
 link.href=URL.createObjectURL(blob);
 link.download=nome;
 link.click();
}
</script>

</body>
</html>
