<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Serviços - IPTU</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .breadcrumb {
      background-color: transparent;
      padding-left: 0;
      font-size: 0.9rem;
    }
    .mosaico {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .mosaico .card {
      flex: 1 1 calc(25% - 1rem);
      min-width: 200px;
      max-width: 300px;
      border-radius: 12px;
      transition: transform 0.2s ease;
    }
    .mosaico .card:hover {
      transform: scale(1.03);
    }
    .acessibilidade {
      display: flex;
      justify-content: end;
      gap: 10px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="acessibilidade">
      <button class="btn btn-sm btn-outline-dark">A+</button>
      <button class="btn btn-sm btn-outline-dark">A-</button>
      <button class="btn btn-sm btn-outline-dark">Contraste</button>
    </div>

    <div class="mb-4">
      <input type="text" class="form-control" placeholder="O que você procura? Ex: IPTU, certidão, alvará...">
    </div>

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Início</a></li>
        <li class="breadcrumb-item active" aria-current="page">Serviços</li>
      </ol>
    </nav>

    <div class="mosaico">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h6 class="card-title">IPTU</h6>
          <p class="card-text text-muted">2ª via, remissão, cadastro e mais</p>
          <a href="iptu.html" class="btn btn-primary btn-sm">Acessar</a>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h6 class="card-title">Estacionamento Idoso</h6>
          <p class="card-text text-muted">Autorização de vaga especial</p>
          <a href="idoso.html" class="btn btn-primary btn-sm">Acessar</a>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h6 class="card-title">Alvarás</h6>
          <p class="card-text text-muted">Consulta e emissão de alvará</p>
          <a href="alvaras.html" class="btn btn-primary btn-sm">Acessar</a>
        </div>
      </div>
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h6 class="card-title">Certidões</h6>
          <p class="card-text text-muted">Certidão negativa, imóvel e outros</p>
          <a href="certidoes.html" class="btn btn-primary btn-sm">Acessar</a>
        </div>
      </div>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
