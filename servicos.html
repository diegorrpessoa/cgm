
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Serviços - Prefeitura de Juiz de Fora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-size: 0.9rem;
    }
    .breadcrumb {
      background: transparent;
      padding: 0;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
    .service-tile {
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background-color: white;
      transition: 0.3s ease;
      height: 100%;
    }
    .service-tile:hover {
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      transform: scale(1.02);
    }
    .service-icon {
      font-size: 2.5rem;
      color: #0d6efd;
      margin-bottom: 10px;
    }
    .accessibility-bar {
      background-color: #e9ecef;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      display: flex;
      justify-content: end;
      gap: 10px;
    }
    .accessibility-bar button {
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <div class="accessibility-bar">
    <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-universal-access"></i> Acessibilidade</button>
    <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-font"></i> A+</button>
    <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-low-vision"></i> Contraste</button>
  </div>

  <div class="container py-4">
    <h2 class="mb-3">Portal de Serviços ao Cidadão</h2>
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Buscar serviço...">
    </div>

    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">Início</li>
      </ol>
    </nav>

    <div class="row g-3">
      <div class="col-md-3">
        <a href="iptu.html" class="text-decoration-none">
          <div class="service-tile h-100">
            <div class="service-icon"><i class="fas fa-file-invoice-dollar"></i></div>
            <h6 class="fw-bold">IPTU</h6>
            <p class="text-muted small">2ª via, Certidões, Cadastramento</p>
          </div>
        </a>
      </div>
      <div class="col-md-3">
        <a href="estacionamento.html" class="text-decoration-none">
          <div class="service-tile h-100">
            <div class="service-icon"><i class="fas fa-car"></i></div>
            <h6 class="fw-bold">Estacionamento Idoso</h6>
            <p class="text-muted small">Autorização e renovação</p>
          </div>
        </a>
      </div>
      <div class="col-md-3">
        <a href="alvaras.html" class="text-decoration-none">
          <div class="service-tile h-100">
            <div class="service-icon"><i class="fas fa-building"></i></div>
            <h6 class="fw-bold">Alvarás</h6>
            <p class="text-muted small">Emissão, Consulta, Revalidação</p>
          </div>
        </a>
      </div>
      <div class="col-md-3">
        <a href="certidoes.html" class="text-decoration-none">
          <div class="service-tile h-100">
            <div class="service-icon"><i class="fas fa-certificate"></i></div>
            <h6 class="fw-bold">Certidões</h6>
            <p class="text-muted small">Diversas certidões municipais</p>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
