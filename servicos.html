<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Serviços - Prefeitura de Juiz de Fora</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Segoe UI", sans-serif;
    }
    .hero {
      background: linear-gradient(to right, #004085, #0069d9);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .search-bar {
      max-width: 600px;
      margin: 20px auto;
    }
    .mosaic {
      padding: 20px 0;
    }
    .service-card {
      border-radius: 12px;
      transition: transform 0.2s ease-in-out;
      height: 100%;
    }
    .service-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .service-icon {
      font-size: 2rem;
      color: #0d6efd;
    }
    .breadcrumb {
      background: transparent;
      padding-left: 0;
      padding-top: 10px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Portal de Serviços</h1>
    <p>Prefeitura de Juiz de Fora</p>
    <div class="search-bar">
      <input type="text" class="form-control form-control-lg" placeholder="O que você está procurando?">
    </div>
  </div>

  <div class="container mt-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item active">Início</li>
      </ol>
    </nav>

    <div class="row mosaic">
      <div class="col-md-4 mb-3">
        <div class="card service-card h-100 text-center p-4">
          <div class="service-icon mb-2"><i class="fas fa-home"></i></div>
          <h5>IPTU</h5>
          <p class="text-muted">2ª via, certidão, espelho, titularidade</p>
          <a href="iptu.html" class="btn btn-outline-primary btn-sm mt-2">Acessar</a>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card service-card h-100 text-center p-4">
          <div class="service-icon mb-2"><i class="fas fa-syringe"></i></div>
          <h5>Saúde</h5>
          <p class="text-muted">Vacinação, medicamentos, agendamentos</p>
          <a href="#" class="btn btn-outline-primary btn-sm mt-2">Acessar</a>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card service-card h-100 text-center p-4">
          <div class="service-icon mb-2"><i class="fas fa-file-alt"></i></div>
          <h5>Certidões</h5>
          <p class="text-muted">Certidão negativa, remissão, alvará</p>
          <a href="#" class="btn btn-outline-primary btn-sm mt-2">Acessar</a>
        </div>
      </div>
      <!-- Adicione mais serviços conforme necessário -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
