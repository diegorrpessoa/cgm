<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central do Usuário | Prefeitura de Juiz de Fora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      font-size: 0.92rem;
    }

    .status {
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.8rem;
      display: inline-block;
    }

    .status-pendente {
      background-color: #fff3cd;
      color: #856404;
    }

    .status-andamento {
      background-color: #cce5ff;
      color: #004085;
    }

    .status-concluido {
      background-color: #d4edda;
      color: #155724;
    }

    .timeline {
      list-style: none;
      padding-left: 1rem;
      border-left: 3px solid #0d6efd;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 1rem;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 0;
      width: 20px;
      height: 20px;
      background-color: #0d6efd;
      border-radius: 50%;
      border: 3px solid white;
    }

    .timeline-item .time {
      font-size: 0.8rem;
      color: #666;
    }

    .timeline-item .desc {
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .editor {
      border: 1px solid #ced4da;
      border-radius: 5px;
      padding: 8px;
      min-height: 100px;
      background-color: white;
    }

    .editor-toolbar {
      margin-bottom: 6px;
    }

    .editor-toolbar button {
      margin-right: 5px;
    }

    .attachment-area {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-light bg-white shadow-sm px-3 mb-3">
    <a class="navbar-brand fw-bold" href="#">Prefeitura de Juiz de Fora</a>
  </nav>

  <div class="container">
    <h2 class="mb-4 text-primary">Central do Usuário</h2>

    <!-- Busca -->
    <div class="mb-3">
      <input type="text" id="searchInput" class="form-control" placeholder="Buscar protocolo por título, ID ou status...">
    </div>

    <!-- Lista de Protocolos -->
    <div class="card mb-4">
      <div class="card-header bg-light fw-semibold">Meus Protocolos</div>
      <div class="card-body p-2">
        <ul class="list-group" id="protocolList">
          <!-- Protocolos dinâmicos -->
        </ul>
      </div>
    </div>

    <!-- Detalhes do Protocolo -->
    <div class="card mb-4">
      <div class="card-header bg-light fw-semibold">Detalhamento</div>
      <div class="card-body" id="protocolDetails">
        <p class="text-muted">Selecione um protocolo para visualizar os detalhes.</p>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const protocolos = [
      {
        id: '202500123',
        titulo: 'Solicitação de Reparos Urbanos',
        status: 'Em andamento',
        timeline: [
          { data: '2025-07-05 11:30', status: 'Trabalho em execução' },
          { data: '2025-07-03 16:00', status: 'Equipe designada' },
          { data: '2025-07-02 09:15', status: 'Avaliação inicial' },
          { data: '2025-07-01 14:20', status: 'Protocolo aberto' }
        ]
      },
      {
        id: '202400456',
        titulo: 'Cadastro Escolar - Creche',
        status: 'Concluído',
        timeline: [
          { data: '2024-12-20 10:00', status: 'Cadastro concluído' },
          { data: '2024-12-15 15:45', status: 'Aprovação finalizada' },
          { data: '2024-12-12 08:30', status: 'Documentação enviada' },
          { data: '2024-12-10 10:00', status: 'Protocolo aberto' }
        ]
      },
      {
        id: '202500789',
        titulo: 'Passe Livre - Renovação',
        status: 'Pendente',
        timeline: [
          { data: '2025-07-02 08:00', status: 'Protocolo aberto' }
        ]
      }
    ];

    const protocolListEl = document.getElementById('protocolList');
    const protocolDetailsEl = document.getElementById('protocolDetails');
    const searchInput = document.getElementById('searchInput');

    function statusClass(status) {
      switch (status.toLowerCase()) {
        case 'pendente': return 'status-pendente';
        case 'concluído': return 'status-concluido';
        case 'em andamento': return 'status-andamento';
        default: return '';
      }
    }

    function renderProtocolList(filter = '') {
      protocolListEl.innerHTML = '';
      const filtered = protocolos.filter(p =>
        p.titulo.toLowerCase().includes(filter.toLowerCase()) ||
        p.status.toLowerCase().includes(filter.toLowerCase()) ||
        p.id.includes(filter)
      );

      filtered.forEach((p, index) => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML = `
          <div>
            <strong>${p.titulo}</strong><br>
            <small>ID: ${p.id}</small> |
            <span class="status ${statusClass(p.status)}">${p.status}</span>
          </div>
          <button class="btn btn-outline-primary btn-sm" onclick="showDetails(${index})">Detalhar</button>
        `;
        protocolListEl.appendChild(li);
      });

      if (filtered.length === 0) {
        protocolListEl.innerHTML = '<li class="list-group-item text-muted">Nenhum protocolo encontrado.</li>';
      }
    }

    function showDetails(index) {
      const p = protocolos[index];
      const timeline = p.timeline.slice().sort((a, b) => new Date(b.data) - new Date(a.data));

      protocolDetailsEl.innerHTML = `
        <h5>${p.titulo}</h5>
        <p><strong>ID:</strong> ${p.id}</p>
        <p><strong>Status:</strong> <span class="status ${statusClass(p.status)}">${p.status}</span></p>
        <hr />
        <h6>Histórico:</h6>
        <ul class="timeline">
          ${timeline.map(ev => `
            <li class="timeline-item">
              <div class="time">${formatDate(ev.data)}</div>
              <div class="desc">${ev.status}</div>
            </li>`).join('')}
        </ul>
        <hr />
        <h6>Enviar Mensagem:</h6>
        <div class="editor-toolbar">
          <button onclick="execCmd('bold')" class="btn btn-sm btn-light"><b>B</b></button>
          <button onclick="execCmd('italic')" class="btn btn-sm btn-light"><i>I</i></button>
          <button onclick="execCmd('underline')" class="btn btn-sm btn-light"><u>U</u></button>
        </div>
        <div id="messageEditor" class="editor" contenteditable="true"></div>
        <div class="attachment-area">
          <label for="fileAttach" class="form-label mt-2">Anexar Arquivo:</label>
          <input type="file" class="form-control" id="fileAttach">
        </div>
        <button class="btn btn-primary mt-3"><i class="fa fa-paper-plane"></i> Enviar</button>
      `;
    }

    function formatDate(datetime) {
      const d = new Date(datetime);
      return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    }

    function execCmd(cmd) {
      document.execCommand(cmd, false, null);
    }

    searchInput.addEventListener('input', () => renderProtocolList(searchInput.value));
    renderProtocolList();
  </script>
</body>
</html>
