<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central do Usuário | Prefeitura de Juiz de Fora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      font-size: 0.9rem;
    }
    .container {
      max-width: 960px;
    }
    h2, h4 {
      color: #0d6efd;
    }
    .card-header {
      background-color: #e9f0ff;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .btn-edit {
      background-color: #0d6efd;
      color: white;
      border: none;
    }
    .btn-edit:hover {
      background-color: #0848c2;
      color: white;
    }
    .protocol-list {
      max-height: 280px;
      overflow-y: auto;
    }
    .timeline {
      list-style: none;
      padding-left: 0;
      border-left: 3px solid #0d6efd;
      margin-left: 1rem;
    }
    .timeline-item {
      position: relative;
      margin-bottom: 1.5rem;
      padding-left: 1rem;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -11px;
      top: 0;
      width: 20px;
      height: 20px;
      background-color: #0d6efd;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 2px #0d6efd;
    }
    .timeline-item .time {
      font-size: 0.85rem;
      color: #666;
    }
    .timeline-item .desc {
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }
    @media (max-width: 576px) {
      .protocol-list {
        max-height: 200px;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-light bg-white shadow-sm px-3 mb-4">
    <a class="navbar-brand fw-bold" href="#">Prefeitura de Juiz de Fora</a>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Central do Usuário</h2>
      <button class="btn btn-edit btn-sm" id="btnEditUser">Editar Dados Cadastrais <i class="fa fa-user-edit ms-1"></i></button>
    </div>

    <section class="mb-4">
      <div class="card">
        <div class="card-header">Meus Dados Cadastrais</div>
        <div class="card-body">
          <p><strong>Nome:</strong> João da Silva</p>
          <p><strong>CPF:</strong> 123.456.789-00</p>
          <p><strong>E-mail:</strong> joao.silva@email.com</p>
          <p><strong>Telefone:</strong> (32) 99999-9999</p>
        </div>
      </div>
    </section>

    <section>
      <div class="card">
        <div class="card-header">Meus Protocolos</div>
        <div class="card-body d-flex flex-column flex-md-row gap-4">
          <div class="protocol-list flex-fill border rounded p-2">
            <ul class="list-group" id="protocolList" style="max-height:280px; overflow-y:auto;">
              <!-- Protocolos dinâmicos -->
            </ul>
          </div>
          <div class="flex-fill border rounded p-3 bg-white" style="min-height:280px;">
            <h4>Detalhes do Protocolo</h4>
            <div id="protocolDetails" style="font-size: 0.9rem; color:#333;">
              <p>Selecione um protocolo para ver os detalhes da linha do tempo.</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Dados de exemplo do usuário e protocolos
    const protocolos = [
      {
        id: '202500123',
        titulo: 'Solicitação de Reparos Urbanos',
        status: 'Em andamento',
        timeline: [
          { data: '2025-07-01 14:20', status: 'Protocolo aberto' },
          { data: '2025-07-02 09:15', status: 'Avaliação inicial concluída' },
          { data: '2025-07-03 16:00', status: 'Equipe designada' },
          { data: '2025-07-05 11:30', status: 'Trabalho em execução' },
        ],
      },
      {
        id: '202400456',
        titulo: 'Cadastro Escolar - Creche',
        status: 'Concluído',
        timeline: [
          { data: '2024-12-10 10:00', status: 'Protocolo aberto' },
          { data: '2024-12-12 08:30', status: 'Documentação enviada' },
          { data: '2024-12-15 15:45', status: 'Aprovação finalizada' },
          { data: '2024-12-20 10:00', status: 'Cadastro concluído' },
        ],
      },
      {
        id: '202500789',
        titulo: 'Passe Livre - Renovação',
        status: 'Pendente',
        timeline: [
          { data: '2025-07-02 08:00', status: 'Protocolo aberto' },
        ],
      }
    ];

    const protocolListEl = document.getElementById('protocolList');
    const protocolDetailsEl = document.getElementById('protocolDetails');

    // Função para formatar data no formato dd/mm/yyyy hh:mm
    function formatDate(datetime) {
      const d = new Date(datetime);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
    }

    // Renderiza lista de protocolos
    function renderProtocolList() {
      protocolListEl.innerHTML = '';
      protocolos.forEach((p, index) => {
        const li = document.createElement('li');
        li.className = 'list-group-item list-group-item-action';
        li.textContent = `${p.titulo} (#${p.id}) - ${p.status}`;
        li.style.cursor = 'pointer';
        li.onclick = () => showProtocolDetails(index);
        protocolListEl.appendChild(li);
      });
    }

    // Mostra detalhes e timeline do protocolo selecionado
    function showProtocolDetails(index) {
      const p = protocolos[index];
      // timeline invertida (mais recente primeiro)
      const timelineHtml = p.timeline
        .slice().reverse()
        .map(
          (ev) =>
            `<li class="timeline-item">
              <div class="time">${formatDate(ev.data)}</div>
              <div class="desc">${ev.status}</div>
            </li>`
        ).join('');
      protocolDetailsEl.innerHTML = `
        <h5>${p.titulo}</h5>
        <p><strong>ID do Protocolo:</strong> ${p.id}</p>
        <p><strong>Status atual:</strong> ${p.status}</p>
        <hr />
        <ul class="timeline">${timelineHtml}</ul>
      `;
    }

    // Botão editar dados cadastrais
    document.getElementById('btnEditUser').addEventListener('click', () => {
      alert('Funcionalidade de editar dados cadastrais será implementada.');
    });

    // Inicializa lista na carga da página
    renderProtocolList();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
