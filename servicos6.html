<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central do Usuário | Prefeitura de Juiz de Fora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      font-size: 0.9rem;
    }

    .service-tile {
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .service-tile:hover {
      background-color: #e7f1ff;
    }

    .protocol-selected {
      background-color: #cfe2ff !important;
    }

    .line-event {
      border-left: 3px solid #0d6efd;
      margin-left: 10px;
      padding-left: 10px;
      margin-bottom: 10px;
    }

    .message-prefeitura {
      background-color: #dbe9ff;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .message-usuario {
      background-color: #e2ffe2;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      text-align: right;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-light bg-white shadow-sm px-3">
    <span class="navbar-brand mb-0 h1">Prefeitura de Juiz de Fora - Central do Usuário</span>
    <button id="btnLogout" class="btn btn-outline-danger btn-sm">Sair</button>
  </nav>

  <div class="container py-4">
    <div id="loginSection" class="mx-auto" style="max-width: 400px;">
      <h3>Login</h3>
      <form id="loginForm">
        <div class="mb-3">
          <label for="inputUsername" class="form-label">Usuário</label>
          <input type="text" class="form-control" id="inputUsername" required />
        </div>
        <div class="mb-3">
          <label for="inputPassword" class="form-label">Senha</label>
          <input type="password" class="form-control" id="inputPassword" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
      <div id="loginError" class="text-danger mt-2" style="display:none;"></div>
    </div>

    <div id="dashboardSection" style="display:none;">
      <h3>Olá, <span id="userName"></span></h3>

      <h5>Seus dados cadastrais</h5>
      <form id="userDataForm" class="mb-4">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Nome completo</label>
            <input type="text" id="nome" class="form-control" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Telefone</label>
            <input type="text" id="telefone" class="form-control" required />
          </div>
        </div>
        <button type="submit" class="btn btn-success mt-3">Salvar dados</button>
      </form>

      <h5>Seus protocolos</h5>
      <div class="row">
        <div class="col-md-4" style="max-height: 400px; overflow-y: auto;">
          <div id="protocolList" class="list-group"></div>
        </div>
        <div class="col-md-8">
          <h6 id="protocolTitle">Selecione um protocolo para ver detalhes</h6>
          <p>Status: <span id="protocolStatus"></span></p>
          <h6>Linha do Tempo</h6>
          <div id="protocolTimeline" style="max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; padding: 10px; background: white; border-radius: 4px;"></div>

          <h6 class="mt-4">Mensagens</h6>
          <div id="protocolMessages" style="max-height: 200px; overflow-y: auto; border: 1px solid #dee2e6; padding: 10px; background: white; border-radius: 4px; margin-bottom: 10px;"></div>

          <form id="messageForm" style="display:none;">
            <div class="input-group mb-3">
              <input type="text" id="messageInput" class="form-control" placeholder="Digite sua mensagem" required />
              <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const apiBase = '';

    // Elements
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const userNameSpan = document.getElementById('userName');
    const userDataForm = document.getElementById('userDataForm');
    const protocolList = document.getElementById('protocolList');
    const protocolTitle = document.getElementById('protocolTitle');
    const protocolStatus = document.getElementById('protocolStatus');
    const protocolTimeline = document.getElementById('protocolTimeline');
    const protocolMessages = document.getElementById('protocolMessages');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    const btnLogout = document.getElementById('btnLogout');

    let token = localStorage.getItem('token') || null;
    let user = null;
    let protocolos = [];
    let selectedProtocolId = null;

    // Utils
    function formatDateISO(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleString('pt-BR');
    }

    // Auth check
    if (token) {
      fetchUserData();
      fetchProtocolos();
      showDashboard();
    }

    // Login form
    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      loginError.style.display = 'none';

      const username = document.getElementById('inputUsername').value.trim();
      const password = document.getElementById('inputPassword').value.trim();

      try {
        const res = await fetch(apiBase + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Erro no login');
        }
        const data = await res.json();
        token = data.token;
        user = data.user;
        localStorage.setItem('token', token);
        showDashboard();
        await fetchUserData();
        await fetchProtocolos();
      } catch (err) {
        loginError.textContent = err.message;
        loginError.style.display = 'block';
      }
    });

    // Logout
    btnLogout.addEventListener('click', () => {
      token = null;
      user = null;
      localStorage.removeItem('token');
      dashboardSection.style.display = 'none';
      loginSection.style.display = 'block';
      protocolList.innerHTML = '';
      protocolTitle.textContent = 'Selecione um protocolo para ver detalhes';
      protocolStatus.textContent = '';
      protocolTimeline.innerHTML = '';
      protocolMessages.innerHTML = '';
      messageForm.style.display = 'none';
    });

    // Mostrar dashboard
    function showDashboard() {
      loginSection.style.display = 'none';
      dashboardSection.style.display = 'block';
      userNameSpan.textContent = user.nome;
    }

    // Buscar e preencher dados cadastrais
    async function fetchUserData() {
      try {
        const res = await fetch(apiBase + '/api/usuario', {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (!res.ok) throw new Error('Erro ao obter dados cadastrais');
        const data = await res.json();
        user = { ...user, ...data };
        document.getElementById('nome').value = data.nome;
        document.getElementById('email').value = data.email;
        document.getElementById('telefone').value = data.telefone;
      } catch (err) {
        alert(err.message);
      }
    }

    // Atualizar dados cadastrais
    userDataForm.addEventListener('submit', async e => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const telefone = document.getElementById('telefone').value.trim();

      try {
        const res = await fetch(apiBase + '/api/usuario', {
          method: 'PUT',
          headers: {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ nome, email, telefone }),
        });
        if (!res.ok) throw new Error('Erro ao atualizar dados');
        alert('Dados atualizados com sucesso!');
      } catch (err) {
        alert(err.message);
      }
    });

    // Buscar protocolos
    async function fetchProtocolos() {
      try {
        const res = await fetch(apiBase + '/api/protocolos', {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (!res.ok) throw new Error('Erro ao obter protocolos');
        const data = await res.json();
        protocolos = data.protocolos;
        renderProtocolList();
      } catch (err) {
        alert(err.message);
      }
    }

    // Renderizar lista de protocolos
    function renderProtocolList() {
      protocolList.innerHTML = '';
      protocolos.forEach((p) => {
        const el = document.createElement('a');
        el.href = '#';
        el.textContent = p.titulo;
        el.className = 'list-group-item list-group-item-action service-tile';
        if (p.id === selectedProtocolId) el.classList.add('protocol-selected');
        el.addEventListener('click', (e) => {
          e.preventDefault();
          selectedProtocolId = p.id;
          renderProtocolList();
          showProtocolDetails(p.id);
        });
        protocolList.appendChild(el);
      });
    }

    // Mostrar detalhes do protocolo selecionado
    async function showProtocolDetails(id) {
      try {
        const res = await fetch(apiBase + `/api/protocolos/${id}`, {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (!res.ok) throw new Error('Erro ao obter detalhes do protocolo');
        const protocolo = await res.json();

        protocolTitle.textContent = protocolo.titulo;
        protocolStatus.textContent = protocolo.status;

        // Linha do tempo
        protocolTimeline.innerHTML = '';
        protocolo.linhaDoTempo.forEach(ev => {
          const div = document.createElement('div');
          div.className = 'line-event';
          div.innerHTML = `<strong>${formatDateISO(ev.data)}</strong>: ${ev.evento}`;
          protocolTimeline.appendChild(div);
        });

        // Mensagens
        protocolMessages.innerHTML = '';
        protocolo.mensagens.forEach(msg => {
          const div = document.createElement('div');
          div.className = msg.remetente === 'prefeitura' ? 'message-prefeitura' : 'message-usuario';
          div.innerHTML = `<small>${formatDateISO(msg.data)}</small><br>${msg.texto}`;
          protocolMessages.appendChild(div);
        });

        messageForm.style.display = 'block';

      } catch (err) {
        alert(err.message);
      }
    }

    // Enviar mensagem
    messageForm.addEventListener('submit', async e => {
      e.preventDefault();
      const texto = messageInput.value.trim();
      if (!texto) return alert('Digite uma mensagem');

      try {
        const res = await fetch(apiBase + `/api/protocolos/${selectedProtocolId}/mensagens`, {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ texto }),
        });
        if (!res.ok) throw new Error('Erro ao enviar mensagem');
        const novaMsg = await res.json();
        protocoloAddMessage(novaMsg);
        messageInput.value = '';
      } catch (err) {
        alert(err.message);
      }
    });

    // Adicionar mensagem nova no chat sem recarregar tudo
    function protocoloAddMessage(msg) {
      const div = document.createElement('div');
      div.className = msg.remetente === 'prefeitura' ? 'message-prefeitura' : 'message-usuario';
      div.innerHTML = `<small>${formatDateISO(msg.data)}</small><br>${msg.texto}`;
      protocolMessages.appendChild(div);
      protocolMessages.scrollTop = protocolMessages.scrollHeight;
    }
  </script>
</body>

</html>
