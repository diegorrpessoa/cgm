<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta 2ª Via IPTU – PJF</title>
  <!-- CSS Bootstrap 5.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <style>
    body { background: #f8f9fa; }
    .container { max-width: 480px; margin-top: 6rem; }
    .captcha-img { height: 50px; }
    .breadcrumb { background: none; }
    label { font-weight: 600; }
  </style>
</head>
<body>
  <div class="container bg-white p-4 shadow">
    <!-- Migalhas (breadcrumb) -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb px-0">
        <li class="breadcrumb-item"><a href="#" onclick="voltar(); return false;">Início</a></li>
        <li class="breadcrumb-item">IPTU</li>
        <li class="breadcrumb-item active" aria-current="page">2ª Via</li>
      </ol>
    </nav>

    <h5 class="mb-4">Emitir 2ª via do IPTU</h5>

    <form id="formIPTU">
      <div class="mb-3">
        <label for="inscricao" class="form-label">Número de Inscrição</label>
        <input type="text" class="form-control" id="inscricao" placeholder="000.000/000" maxlength="12"
          oninput="this.value = this.value
            .replace(/\D/g, '')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})\.(\d{3})(\d)/, '$1.$2/$3');" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Digite o código de segurança</label>
        <div class="input-group">
          <img src="https://via.placeholder.com/150x50?text=CAPTCHA" alt="captcha" class="captcha-img me-2">
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="refreshCaptcha()">⟳</button>
        </div>
        <input type="text" class="form-control mt-2" id="captcha" placeholder="Código do captcha" maxlength="6" required>
      </div>

      <div class="d-flex justify-content-between">
        <button type="reset" class="btn btn-outline-secondary">Limpar</button>
        <button type="submit" class="btn btn-primary">Buscar</button>
      </div>
    </form>
  </div>

  <!-- JS Bootstrap e jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Voltar para a tela anterior
    function voltar() {
      window.history.back();
    }

    // Refrescar o captcha (exemplo)
    function refreshCaptcha() {
      const img = document.querySelector('.captcha-img');
      img.src = `https://via.placeholder.com/150x50?text=CAPTCHA&${Date.now()}`;
    }

    // Submissão simulada
    $('#formIPTU').on('submit', function(e) {
      e.preventDefault();
      const inscr = $('#inscricao').val();
      const captcha = $('#captcha').val();
      if (!inscr || !captcha) return alert('Preencha todos os campos.');
      alert(`Buscando 2ª via para inscrição ${inscr}`);
      // Aqui você chamaria API do tributos4.pjf.mg.gov.br/iptu
    });
  </script>
</body>
</html>
