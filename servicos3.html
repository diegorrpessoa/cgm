<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2ª Via de IPTU - Prefeitura de Juiz de Fora</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.7/dist/jquery.inputmask.min.js"></script>
  <style>
    body {
      background-color: #f4f6f9;
    }
    .card {
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .captcha {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      letter-spacing: 2px;
      background-color: #e0e0e0;
      padding: 5px 10px;
      display: inline-block;
      border-radius: 5px;
      font-size: 20px;
      user-select: none;
    }
    .breadcrumb {
      font-size: 0.85rem;
      background-color: transparent;
      padding-left: 0;
    }
    .resultado {
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#">Início</a></li>
      <li class="breadcrumb-item"><a href="#">IPTU</a></li>
      <li class="breadcrumb-item active" aria-current="page">2ª via de IPTU</li>
    </ol>
  </nav>

  <!-- Formulário -->
  <div class="card p-4">
    <h5 class="mb-4">Emissão de 2ª via do IPTU</h5>

    <form id="iptuForm">
      <div class="mb-3">
        <label for="inscricao" class="form-label">Nº de Inscrição do Imóvel</label>
        <input type="text" class="form-control" id="inscricao" required placeholder="000.000/000">
      </div>

      <div class="mb-3">
        <label class="form-label">Captcha:</label>
        <div class="d-flex align-items-center gap-3">
          <span class="captcha" id="captchaText">A1B2C</span>
          <input type="text" class="form-control" id="captchaInput" placeholder="Digite o captcha" required>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshCaptcha">↻</button>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Buscar</button>
        <button type="reset" class="btn btn-outline-secondary" id="limparBtn">Limpar</button>
      </div>
    </form>

    <!-- Resultado simulado -->
    <div class="alert alert-success resultado" id="resultado">
      <h6>Guia de Pagamento Encontrada</h6>
      <p>Imóvel: <strong>Rua Exemplo, 123 - Centro</strong></p>
      <p>Valor Total: <strong>R$ 1.234,56</strong></p>
      <a href="#" class="btn btn-success btn-sm">Baixar Guia (PDF)</a>
    </div>
  </div>
</div>

<script>
  function gerarCaptcha() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let codigo = '';
    for (let i = 0; i < 5; i++) {
      codigo += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return codigo;
  }

  function atualizarCaptcha() {
    const captcha = gerarCaptcha();
    $('#captchaText').text(captcha);
    $('#captchaText').data('captcha', captcha.toUpperCase());
  }

  $(document).ready(function() {
    $('#inscricao').inputmask('999.999/999');
    atualizarCaptcha();

    $('#refreshCaptcha').click(() => atualizarCaptcha());

    $('#iptuForm').on('submit', function(e) {
      e.preventDefault();
      const captchaDigitado = $('#captchaInput').val().trim().toUpperCase();
      const captchaCorreto = $('#captchaText').data('captcha');
      const inscricao = $('#inscricao').val().trim();

      if (!inscricao || !captchaDigitado) {
        alert('Preencha todos os campos.');
        return;
      }

      if (captchaDigitado !== captchaCorreto) {
        alert('Captcha incorreto. Tente novamente.');
        atualizarCaptcha();
        $('#captchaInput').val('');
        return;
      }

      if (inscricao !== "123.456/789") {
        alert('Inscrição não encontrada.');
        return;
      }

      $('#resultado').fadeIn();
    });

    $('#limparBtn').on('click', function() {
      $('#resultado').hide();
      atualizarCaptcha();
    });
  });
</script>

</body>
</html>
