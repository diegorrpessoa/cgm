<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Receitas</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{
  background-color:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

label{
  font-weight:600;
  font-size:0.72rem !important;
  color:#343a40;
  margin-bottom:2px;
}

.form-select-sm,
table{
  font-size:.7rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

/* Paginação */
.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background:#e9ecef !important;
  border:1px solid #dee2e6 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

/* Botões */
.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

/* Atualização */
#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

/* Spinner */
.spinner-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
  background:rgba(255,255,255,.9);
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

/* Registros */
#lengthSelectorContainer{
  font-size:.7rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  margin-bottom:6px;
}

#lengthSelector{
  width:80px;
  font-size:.7rem;
}

</style>
</head>

<body>

<!-- SPINNER -->
<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<div class="container-fluid mt-3">

  <!-- INDICADOR -->
  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Ano *</label>

      <select
        id="anoFiltro"
        class="form-select form-select-sm"
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <div class="col-sm-2">
      <label>Mês *</label>

      <select
        id="mesFiltro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <div class="col-sm-2">
      <label>Categoria Econômica</label>

      <select
        id="categoriaFiltro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <div class="col-sm-2">
      <label>Origem</label>

      <select
        id="origemFiltro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <div class="col-sm-2">
      <label>Espécie</label>

      <select
        id="especieFiltro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <div class="col-sm-2">
      <label>Desdobramento 1</label>

      <select
        id="des1Filtro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <div class="col-sm-2">
      <label>Desdobramento 2</label>

      <select
        id="des2Filtro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <div class="col-sm-2">
      <label>Desdobramento 3</label>

      <select
        id="des3Filtro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="export-group btn-group">

      <button
        id="btnCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="btnXlsx"
        class="btn btn-outline-secondary btn-sm"
      >
        XLSX
      </button>

      <button
        id="btnTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

      <button
        id="btnJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

    </div>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label>Registros por página:</label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm"
    >
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

  </div>

  <!-- TABELA -->
  <div class="table-responsive">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm w-100"
      style="display:none;"
    ></table>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vS9iiIBNEZs9OFuuKDy8N-P6fBDuqxpEYObhYWoR7YDi4DxsHQ7fZEHXs91FYLxCJEJpoJBaEeVYt0t/pub?gid=1659253784&single=true&output=csv";

const meses = [
  "JANEIRO",
  "FEVEREIRO",
  "MARÇO",
  "ABRIL",
  "MAIO",
  "JUNHO",
  "JULHO",
  "AGOSTO",
  "SETEMBRO",
  "OUTUBRO",
  "NOVEMBRO",
  "DEZEMBRO"
];

const filtros = [
  {
    id:"categoriaFiltro",
    coluna:"CATEGORIA ECONOMICA",
    colunaNome:"NOME CATEGORIA ECONOMICA"
  },
  {
    id:"origemFiltro",
    coluna:"ORIGEM"
  },
  {
    id:"especieFiltro",
    coluna:"ESPECIE"
  },
  {
    id:"des1Filtro",
    coluna:"DESDOBRAMENTO 1"
  },
  {
    id:"des2Filtro",
    coluna:"DESDOBRAMENTO 2"
  },
  {
    id:"des3Filtro",
    coluna:"DESDOBRAMENTO 3"
  }
];

/* =========================
   CARREGAMENTO CSV
========================= */

Papa.parse(urlCSV,{

  download:true,
  header:true,

  complete:r=>{

    dadosOriginais = r.data.filter(
      d => d.ANO
    );

    const linhaAtualizacao =
      dadosOriginais.find(
        x => x["Atualizacao"]
      );

    if(linhaAtualizacao){

      $("#indicadorAtualizacao").html(
        `Dados atualizados em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
      );

    }

    dadosOriginais = dadosOriginais.map(r=>{

      const copia = {...r};

      delete copia["Atualizacao"];

      return copia;

    });

    carregarAno();

    $("#spinnerCsv").fadeOut(200);

  }

});

/* =========================
   CARREGAR ANO
========================= */

function carregarAno(){

  const s = $("#anoFiltro");

  s.empty();

  s.append(`
    <option value="">
      Selecione...
    </option>
  `);

  [...new Set(
    dadosOriginais.map(r=>r.ANO)
  )]
  .sort()
  .forEach(v=>{

    s.append(`
      <option value="${v}">
        ${v}
      </option>
    `);

  });

}

/* =========================
   CARREGAR MESES
========================= */

function carregarMeses(){

  const s = $("#mesFiltro");

  s.empty();

  s.append(`
    <option value="">
      Selecione...
    </option>
  `);

  s.append(`
    <option value="TODOS">
      Todos
    </option>
  `);

  meses.forEach(m=>{

    s.append(`
      <option value="${m}">
        ${m.charAt(0)+m.slice(1).toLowerCase()}
      </option>
    `);

  });

}

/* =========================
   RESET FILTROS
========================= */

function resetarFiltrosExtras(){

  filtros.forEach(f=>{

    $("#"+f.id)
      .val("")
      .prop("disabled",true)
      .empty()
      .append(`
        <option value="">
          Selecione...
        </option>
      `);

  });

}

/* =========================
   POPULAR FILTROS
========================= */

function popularFiltro(config,dadosBase){

  const select = $("#"+config.id);

  const valorAtual = select.val();

  select.empty();

  select.append(`
    <option value="">
      Selecione...
    </option>
  `);

  select.append(`
    <option value="TODOS">
      Todos
    </option>
  `);

  let valores = [];

  /* Categoria econômica com código + descrição */
  if(config.colunaNome){

    valores = [
      ...new Map(

        dadosBase
          .filter(r=>r[config.coluna])
          .map(r=>{

            const codigo = r[config.coluna];
            const nome = r[config.colunaNome] || "";

            return [
              codigo,
              {
                valor:codigo,
                texto:nome
                  ? `${codigo} - ${nome}`
                  : codigo
              }
            ];

          })

      ).values()
    ];

    valores.sort((a,b)=>
      a.texto.localeCompare(
        b.texto,
        "pt-BR",
        {numeric:true}
      )
    );

    valores.forEach(item=>{

      select.append(`
        <option value="${item.valor}">
          ${item.texto}
        </option>
      `);

    });

  }else{

    valores = [
      ...new Set(
        dadosBase
          .map(r=>r[config.coluna])
          .filter(Boolean)
      )
    ];

    valores.sort((a,b)=>
      a.localeCompare(
        b,
        "pt-BR",
        {numeric:true}
      )
    );

    valores.forEach(v=>{

      select.append(`
        <option value="${v}">
          ${v}
        </option>
      `);

    });

  }

  select.prop("disabled",false);

  if(
    valorAtual &&
    (
      valores.some(v=>
        typeof v === "object"
          ? v.valor === valorAtual
          : v === valorAtual
      )
      || valorAtual === "TODOS"
    )
  ){

    select.val(valorAtual);

  }

}

/* =========================
   ATUALIZAR FILTROS
========================= */

function atualizarFiltrosEncadeados(){

  let base = dadosOriginais.filter(
    r => r.ANO === $("#anoFiltro").val()
  );

  const mes = $("#mesFiltro").val();

  if(
    mes &&
    mes !== "TODOS"
  ){

    base = base.filter(
      r => r[mes]
    );

  }

  filtros.forEach((f,index)=>{

    let dadosFiltro = [...base];

    for(let i=0;i<index;i++){

      const filtroAnterior = filtros[i];

      const valorAnterior =
        $("#"+filtroAnterior.id).val();

      if(
        valorAnterior &&
        valorAnterior !== "TODOS"
      ){

        dadosFiltro = dadosFiltro.filter(
          r =>
            r[filtroAnterior.coluna] === valorAnterior
        );

      }

    }

    popularFiltro(
      f,
      dadosFiltro
    );

  });

}

/* =========================
   APLICAR FILTROS
========================= */

function aplicarFiltros(){

  const ano = $("#anoFiltro").val();
  const mes = $("#mesFiltro").val();

  if(!ano || !mes){
    return [];
  }

  let dados = dadosOriginais.filter(
    r => r.ANO === ano
  );

  if(mes !== "TODOS"){

    dados = dados
      .filter(r => r[mes])
      .map(d=>{

        const base = {};

        for(const key in d){

          if(
            !meses.includes(key) ||
            key === mes
          ){

            base[key] = d[key];

          }

        }

        return base;

      });

  }

  filtros.forEach(f=>{

    const valor = $("#"+f.id).val();

    if(
      valor &&
      valor !== "TODOS"
    ){

      dados = dados.filter(
        r => r[f.coluna] === valor
      );

    }

  });

  return dados;

}

/* =========================
   RENDER TABELA
========================= */

function renderTabela(dados){

  if(!dados.length){

    if(tabela){

      tabela.destroy();

      tabela = null;

    }

    $("#tabela")
      .hide()
      .empty();

    return;

  }

  if(tabela){

    tabela.destroy();

    $("#tabela").empty();

    tabela = null;

  }

  const colunas = Object.keys(dados[0]).map(c=>({
    title:c,
    data:c
  }));

  $("#tabela").show();

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:colunas,

    destroy:true,

    scrollX:true,
    scrollY:"55vh",
    scrollCollapse:true,

    paging:true,

    pageLength:parseInt(
      $("#lengthSelector").val()
    ),

    lengthChange:false,
    info:true,

    autoWidth:false,

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

}

/* =========================
   APLICAR TUDO
========================= */

function aplicarTudo(){

  const dados = aplicarFiltros();

  renderTabela(dados);

}

/* =========================
   EVENTO ANO
========================= */

$("#anoFiltro").on("change",function(){

  const ano = $(this).val();

  $("#mesFiltro")
    .prop("disabled",!ano);

  resetarFiltrosExtras();

  if(ano){

    carregarMeses();

    $("#mesFiltro").val("");

  }else{

    $("#mesFiltro")
      .empty()
      .append(`
        <option value="">
          Selecione...
        </option>
      `);

  }

  aplicarTudo();

});

/* =========================
   EVENTO MÊS
========================= */

$("#mesFiltro").on("change",function(){

  const valor = $(this).val();

  if(!valor){

    resetarFiltrosExtras();

    aplicarTudo();

    return;

  }

  filtros.forEach(f=>{

    $("#"+f.id)
      .val("")
      .prop("disabled",false);

  });

  atualizarFiltrosEncadeados();

  aplicarTudo();

});

/* =========================
   EVENTOS FILTROS
========================= */

filtros.forEach((f,index)=>{

  $("#"+f.id).on("change",function(){

    const valorSelecionado = $(this).val();

    /* SEM SELEÇÃO */
    if(!valorSelecionado){

      filtros.forEach((outro,outroIndex)=>{

        if(outroIndex > index){

          $("#"+outro.id)
            .val("")
            .prop("disabled",false);

        }

      });

      atualizarFiltrosEncadeados();

      aplicarTudo();

      return;

    }

    /* TODOS */
    if(valorSelecionado === "TODOS"){

      filtros.forEach(outro=>{

        if(outro.id !== f.id){

          $("#"+outro.id)
            .val("")
            .prop("disabled",false);

        }

      });

      atualizarFiltrosEncadeados();

      aplicarTudo();

      return;

    }

    /* ENCADEAMENTO */
    filtros.forEach((outro,outroIndex)=>{

      if(outroIndex > index){

        $("#"+outro.id)
          .val("")
          .prop("disabled",false);

      }

    });

    atualizarFiltrosEncadeados();

    aplicarTudo();

  });

});

/* =========================
   PAGINAÇÃO
========================= */

$("#lengthSelector").on(
  "change",
  function(){

    if(tabela){

      tabela
        .page
        .len(this.value)
        .draw();

    }

  }
);

/* =========================
   LIMPAR
========================= */

$("#btnLimpar").on(
  "click",
  ()=>location.reload()
);

/* =========================
   DOWNLOAD
========================= */

function baixarArquivo(blob,nome){

  const link = document.createElement("a");

  link.href = URL.createObjectURL(blob);

  link.download = nome;

  link.click();

}

/* =========================
   NOME EXPORTAÇÃO
========================= */

function gerarNomeArquivo(ext){

  let partes = ["dados-receitas"];

  const ano = $("#anoFiltro").val();
  const mes = $("#mesFiltro").val();

  if(ano){

    partes.push(
      ano.toLowerCase().replace(/\s+/g,"-")
    );

  }

  if(
    mes &&
    mes !== "TODOS"
  ){

    partes.push(
      mes.toLowerCase().replace(/\s+/g,"-")
    );

  }

  filtros.forEach(f=>{

    const valor = $("#"+f.id).val();

    if(
      valor &&
      valor !== "TODOS"
    ){

      partes.push(

        valor
          .toString()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/\s+/g,"-")
          .replace(/[^\w-]/g,"")

      );

    }

  });

  return partes.join("-")+"."+ext;

}

/* =========================
   CSV
========================= */

$("#btnCsv").on("click",()=>{

  if(!tabela) return;

  const csv = Papa.unparse(
    tabela.rows({search:"applied"}).data().toArray(),
    {
      quotes:true,
      delimiter:";"
    }
  );

  baixarArquivo(

    new Blob(
      ["\ufeff"+csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    ),

    gerarNomeArquivo("csv")

  );

});

/* =========================
   JSON
========================= */

$("#btnJson").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  baixarArquivo(

    new Blob(
      [JSON.stringify(dados,null,2)],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

});

/* =========================
   TXT
========================= */

$("#btnTxt").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  const txt = dados
    .map(o=>Object.values(o).join(" | "))
    .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

});

/* =========================
   XLSX
========================= */

$("#btnXlsx").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  const ws = XLSX.utils.json_to_sheet(dados);

  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Receitas"
  );

  XLSX.writeFile(
    wb,
    gerarNomeArquivo("xlsx")
  );

});

</script>

</body>
</html>
