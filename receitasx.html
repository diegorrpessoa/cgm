<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Receitas</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{
  background-color:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
}

.form-select-sm,
table{
  font-size:.7rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

/* Paginação */
.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background-color:#e9ecef !important;
  border:1px solid #dee2e6 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background-color:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

/* Botões exportação */
.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

/* Atualização */
#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

/* Spinner */
.spinner-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
  background-color:rgba(255,255,255,.9);
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

/* Registros por página */
#lengthSelectorContainer{
  font-size:.7rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  margin-bottom:6px;
}

#lengthSelector{
  width:80px;
  font-size:.7rem;
}

</style>
</head>

<body>

<!-- SPINNER -->
<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<div class="container-fluid mt-3">

  <!-- INDICADOR -->
  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <!-- ANO -->
    <div class="col-sm-2">
      <label>Ano *</label>

      <select
        id="anoFiltro"
        class="form-select form-select-sm"
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <!-- MÊS -->
    <div class="col-sm-2">
      <label>Mês *</label>

      <select
        id="mesFiltro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <!-- CATEGORIA -->
    <div class="col-sm-2">
      <label>Categoria Econômica</label>

      <select
        id="categoriaFiltro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <!-- ORIGEM -->
    <div class="col-sm-2">
      <label>Origem</label>

      <select
        id="origemFiltro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <!-- ESPÉCIE -->
    <div class="col-sm-2">
      <label>Espécie</label>

      <select
        id="especieFiltro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <!-- DESDOBRAMENTO 1 -->
    <div class="col-sm-2">
      <label>Desdobramento 1</label>

      <select
        id="des1Filtro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <!-- DESDOBRAMENTO 2 -->
    <div class="col-sm-2">
      <label>Desdobramento 2</label>

      <select
        id="des2Filtro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

    <!-- DESDOBRAMENTO 3 -->
    <div class="col-sm-2">
      <label>Desdobramento 3</label>

      <select
        id="des3Filtro"
        class="form-select form-select-sm"
        disabled
      >
        <option value="">
          Selecione...
        </option>
      </select>
    </div>

  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="export-group btn-group">

      <button
        id="btnCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="btnXlsx"
        class="btn btn-outline-secondary btn-sm"
      >
        XLSX
      </button>

      <button
        id="btnTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

      <button
        id="btnJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

    </div>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label>Registros por página:</label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm"
    >
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

  </div>

  <!-- TABELA -->
  <div class="table-responsive">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm w-100"
      style="display:none;"
    ></table>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

const urlCSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vS9iiIBNEZs9OFuuKDy8N-P6fBDuqxpEYObhYWoR7YDi4DxsHQ7fZEHXs91FYLxCJEJpoJBaEeVYt0t/pub?gid=1659253784&single=true&output=csv";

const meses = [
  "JANEIRO",
  "FEVEREIRO",
  "MARÇO",
  "ABRIL",
  "MAIO",
  "JUNHO",
  "JULHO",
  "AGOSTO",
  "SETEMBRO",
  "OUTUBRO",
  "NOVEMBRO",
  "DEZEMBRO"
];

/* CAMPOS */
const campos = {
  ano:"ANO",
  mes:"MES_REFERENCIA",
  categoria:"CATEGORIA ECONOMICA",
  origem:"ORIGEM",
  especie:"ESPECIE",
  des1:"DESDOBRAMENTO 1",
  des2:"DESDOBRAMENTO 2",
  des3:"DESDOBRAMENTO 3"
};

const ordemFiltros = [
  "ano",
  "mes",
  "categoria",
  "origem",
  "especie",
  "des1",
  "des2",
  "des3"
];

/* =========================
   CARREGAR CSV
========================= */

Papa.parse(urlCSV,{

  download:true,
  header:true,

  complete:r=>{

    dadosOriginais = r.data.filter(
      d => d.ANO
    );

    const linhaAtualizacao =
      dadosOriginais.find(
        x => x["Atualizacao"]
      );

    if(linhaAtualizacao){

      $("#indicadorAtualizacao").html(
        `Dados atualizados em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
      );

    }

    dadosOriginais = dadosOriginais.map(r=>{

      const copia = {...r};

      delete copia["Atualizacao"];

      return copia;

    });

    carregarAno();

    $("#spinnerCsv").fadeOut(200);

  }

});

/* =========================
   UTIL
========================= */

function normalizarTexto(texto){

  return texto
    ?.toString()
    .trim() || "";

}

function gerarNomeArquivo(ext){

  let partes = ["dados-receitas"];

  ordemFiltros.forEach(f=>{

    const val =
      $("#"+f+"Filtro").val();

    if(
      val &&
      val !== "TODOS"
    ){

      partes.push(
        val
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/[^\w\s-]/g,"")
          .replace(/\s+/g,"-")
      );

    }

  });

  return partes.join("-")+"."+ext;

}

/* =========================
   CARREGAR ANO
========================= */

function carregarAno(){

  const s = $("#anoFiltro");

  s.empty();

  s.append(`
    <option value="">
      Selecione...
    </option>
  `);

  [
    ...new Set(
      dadosOriginais.map(r=>r.ANO)
    )
  ]
  .sort()
  .forEach(v=>{

    s.append(`
      <option value="${v}">
        ${v}
      </option>
    `);

  });

}

/* =========================
   FILTRO BASE
========================= */

function aplicarFiltrosBase(
  ignorarFiltro = null
){

  let base = [...dadosOriginais];

  ordemFiltros.forEach(f=>{

    if(f === ignorarFiltro) return;

    const valor =
      $("#"+f+"Filtro").val();

    if(
      !valor ||
      valor === "TODOS"
    ) return;

    if(f === "mes"){

      base = base.filter(
        r => normalizarTexto(
          r[campos[f]]
        ) === valor
      );

    }else{

      base = base.filter(
        r => normalizarTexto(
          r[campos[f]]
        ) === valor
      );

    }

  });

  return base;

}

/* =========================
   POPULAR FILTRO
========================= */

function popularFiltro(
  filtro
){

  const seletor =
    $("#"+filtro+"Filtro");

  const valorAtual =
    seletor.val();

  const base =
    aplicarFiltrosBase(filtro);

  let valores = [];

  /* MÊS */
  if(filtro === "mes"){

    valores = meses.filter(m=>
      base.some(r=>
        normalizarTexto(
          r[campos.mes]
        ) === m
      )
    );

  }else if(filtro === "categoria"){

    valores = [
      ...new Set(
        base
          .map(r=>{

            const codigo =
              normalizarTexto(
                r["CATEGORIA ECONOMICA"]
              );

            const nome =
              normalizarTexto(
                r["NOME CATEGORIA ECONOMICA"]
              );

            if(nome){

              return `${codigo} - ${nome}`;

            }

            return codigo;

          })
          .filter(Boolean)
      )
    ].sort();

  }else{

    valores = [
      ...new Set(
        base
          .map(r=>
            normalizarTexto(
              r[campos[filtro]]
            )
          )
          .filter(Boolean)
      )
    ].sort();

  }

  seletor.empty();

  seletor.append(`
    <option value="">
      Selecione...
    </option>
  `);

  if(
    filtro !== "ano"
  ){

    seletor.append(`
      <option value="TODOS">
        Todos
      </option>
    `);

  }

  valores.forEach(v=>{

    seletor.append(`
      <option value="${v}">
        ${v}
      </option>
    `);

  });

  seletor.prop(
    "disabled",
    valores.length === 0
  );

  if(
    valores.includes(valorAtual)
    ||
    valorAtual === "TODOS"
  ){

    seletor.val(valorAtual);

  }

}

/* =========================
   ATUALIZAR TODOS FILTROS
========================= */

function atualizarTodosFiltros(){

  ordemFiltros
    .slice(1)
    .forEach(f=>{

      popularFiltro(f);

    });

}

/* =========================
   RESET TODOS
========================= */

function resetarFiltrosExceto(
  filtroAtual
){

  ordemFiltros.forEach(f=>{

    if(
      f !== "ano" &&
      f !== filtroAtual
    ){

      $("#"+f+"Filtro")
        .val("");

    }

  });

}

/* =========================
   APLICAR FILTROS
========================= */

function aplicarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    return [];

  }

  let dados =
    aplicarFiltrosBase();

  const mes =
    $("#mesFiltro").val();

  if(
    mes &&
    mes !== "TODOS"
  ){

    dados = dados.map(d=>{

      const base = {};

      for(const key in d){

        if(
          !meses.includes(key)
          ||
          key === mes
        ){

          base[key] = d[key];

        }

      }

      return base;

    });

  }

  return dados;

}

/* =========================
   TABELA
========================= */

function renderTabela(dados){

  if(!dados.length){

    if(tabela){

      tabela.destroy();

      tabela = null;

    }

    $("#tabela")
      .hide()
      .empty();

    return;

  }

  if(tabela){

    tabela.destroy();

    $("#tabela").empty();

  }

  const colunas =
    Object.keys(dados[0]).map(c=>({
      title:c,
      data:c
    }));

  $("#tabela").show();

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:colunas,

    destroy:true,

    scrollX:true,
    scrollY:"55vh",
    scrollCollapse:true,

    paging:true,

    pageLength:parseInt(
      $("#lengthSelector").val()
    ),

    lengthChange:false,

    info:true,

    autoWidth:false,

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

}

/* =========================
   APLICAR TUDO
========================= */

function aplicarTudo(){

  atualizarTodosFiltros();

  const dados =
    aplicarFiltros();

  renderTabela(dados);

}

/* =========================
   EVENTOS
========================= */

/* ANO */
$("#anoFiltro").on(
  "change",
  function(){

    const ano =
      $(this).val();

    ordemFiltros
      .slice(1)
      .forEach(f=>{

        $("#"+f+"Filtro")
          .val("")
          .prop("disabled",!ano);

      });

    if(ano){

      atualizarTodosFiltros();

    }

    aplicarTudo();

  }
);

/* DEMAIS FILTROS */
ordemFiltros
  .slice(1)
  .forEach(f=>{

    $("#"+f+"Filtro").on(
      "change",
      function(){

        const valor =
          $(this).val();

        /* TODOS */
        if(valor === "TODOS"){

          resetarFiltrosExceto(f);

          $(this).val("TODOS");

        }

        aplicarTudo();

      }
    );

  });

/* REGISTROS */
$("#lengthSelector").on(
  "change",
  function(){

    if(tabela){

      tabela
        .page
        .len(this.value)
        .draw();

    }

  }
);

/* LIMPAR */
$("#btnLimpar").on(
  "click",
  ()=>location.reload()
);

/* =========================
   DOWNLOAD
========================= */

function baixarArquivo(blob,nome){

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download = nome;

  link.click();

}

/* =========================
   CSV
========================= */

$("#btnCsv").on("click",()=>{

  if(!tabela) return;

  const csv = Papa.unparse(

    tabela
      .rows({search:"applied"})
      .data()
      .toArray(),

    {
      quotes:true,
      delimiter:";"
    }

  );

  baixarArquivo(

    new Blob(
      ["\ufeff"+csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    ),

    gerarNomeArquivo("csv")

  );

});

/* =========================
   JSON
========================= */

$("#btnJson").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  baixarArquivo(

    new Blob(
      [JSON.stringify(dados,null,2)],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

});

/* =========================
   TXT
========================= */

$("#btnTxt").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  const txt = dados
    .map(o=>Object.values(o).join(" | "))
    .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

});

/* =========================
   XLSX
========================= */

$("#btnXlsx").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  const ws =
    XLSX.utils.json_to_sheet(dados);

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Receitas"
  );

  XLSX.writeFile(
    wb,
    gerarNomeArquivo("xlsx")
  );

});

</script>

</body>
</html>
