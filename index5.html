<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Despesas Públicas</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f8f8f8; }
    select { margin-right: 10px; padding: 5px; }
    .dt-buttons { margin-bottom: 10px; }
    table.dataTable tbody tr:hover { background-color: #f1f1f1; }
    .dataTables_wrapper .dataTables_filter { display: none; }
  </style>
</head>
<body>

  <h2>Tabela de Despesas Públicas</h2>

  <label for="filtroAno">Ano:</label>
  <select id="filtroAno"></select>

  <label for="filtroMes">Mês:</label>
  <select id="filtroMes" disabled></select>

  <label for="filtroUnidade">Unidade Orçamentária:</label>
  <select id="filtroUnidade" disabled></select>

  <br><br>

  <table id="tabela" class="display nowrap" style="width:100%">
    <thead>
      <tr></tr>
    </thead>
    <tfoot>
      <tr></tr>
    </tfoot>
    <tbody></tbody>
  </table>

  <p id="ultimaAtualizacao"></p>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    let tabela, dadosOriginais = [], mesesOrdem = ["JANEIRO", "FEVEREIRO", "MARCO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

    function carregarCSV(url) {
      fetch(url)
        .then(response => response.text())
        .then(csv => {
          const linhas = csv.split("\n").map(l => l.trim()).filter(Boolean);
          const cabecalho = linhas[0].split(",");
          const dados = linhas.slice(1).map(l => {
            const valores = l.split(",");
            const obj = {};
            cabecalho.forEach((col, i) => obj[col] = valores[i] || "");
            return obj;
          });

          dadosOriginais = dados;
          inicializarTabela(cabecalho, dados);
          popularFiltro('filtroAno', 'ANO', dados);
        });
    }

    function inicializarTabela(cabecalho, dados) {
      $('#tabela thead tr, #tabela tfoot tr').empty();
      cabecalho.forEach(col => {
        if (col !== 'Data Atualização') {
          $('#tabela thead tr, #tabela tfoot tr').append('<th>' + col + '</th>');
        }
      });

      if ($.fn.DataTable.isDataTable('#tabela')) {
        tabela.clear().rows.add(formatarDados(dados)).draw();
      } else {
        tabela = $('#tabela').DataTable({
          data: formatarDados(dados),
          columns: cabecalho.filter(c => c !== 'Data Atualização').map(c => ({ title: c })),
          dom: 'Bfrtip',
          buttons: ['copy', 'csv', 'excel'],
          scrollX: true,
          paging: true,
          language: {
            url: "//cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
          }
        });
      }

      const ultimaData = dados.map(d => d['Data Atualização']).filter(Boolean).sort().pop();
      document.getElementById('ultimaAtualizacao').textContent = "Última atualização: " + (ultimaData || "não informada");
    }

    function formatarDados(dados) {
      return dados.map(d => {
        return Object.entries(d)
          .filter(([k]) => k !== 'Data Atualização')
          .map(([_, v]) => v);
      });
    }

    function popularFiltro(id, campo, dados) {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">Todos</option>';
      const valoresUnicos = [...new Set(dados.map(d => d[campo]).filter(v => v))].sort();
      valoresUnicos.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });
      select.disabled = false;
    }

    function aplicarFiltros() {
      const ano = $('#filtroAno').val();
      const mes = $('#filtroMes').val();
      const unidade = $('#filtroUnidade').val();

      let filtrados = [...dadosOriginais];
      if (ano) filtrados = filtrados.filter(d => d.ANO === ano);
      if (mes) filtrados = filtrados.filter(d => d['Mês'] === mes);
      if (unidade) filtrados = filtrados.filter(d => d['Unidade Orçamentária'] === unidade);

      inicializarTabela(Object.keys(dadosOriginais[0]), filtrados);
    }

    function popularFiltroEncadeado(id, campo, dados) {
      const s = $('#' + id);
      s.empty().append('<option value="">Todos</option>');
      let vals = [...new Set(dados.map(r => r[campo]).filter(v => v))];
      if (campo === "Mês") vals.sort((a, b) => mesesOrdem.indexOf(a) - mesesOrdem.indexOf(b));
      else vals.sort();
      vals.forEach(v => s.append(`<option value="${v}">${v}</option>`));
      s.prop('disabled', false);
    }

    $('#filtroAno').on('change', function () {
      const anoSelecionado = this.value;
      const dadosFiltrados = anoSelecionado ? dadosOriginais.filter(d => d.ANO === anoSelecionado) : dadosOriginais;
      popularFiltroEncadeado('filtroMes', 'Mês', dadosFiltrados);
      $('#filtroUnidade').empty().append('<option value="">Todos</option>').prop('disabled', true);
      aplicarFiltros();
    });

    $('#filtroMes').on('change', function () {
      const ano = $('#filtroAno').val();
      const mes = this.value;
      let dadosFiltrados = [...dadosOriginais];
      if (ano) dadosFiltrados = dadosFiltrados.filter(d => d.ANO === ano);
      if (mes) dadosFiltrados = dadosFiltrados.filter(d => d['Mês'] === mes);
      popularFiltroEncadeado('filtroUnidade', 'Unidade Orçamentária', dadosFiltrados);
      aplicarFiltros();
    });

    $('#filtroUnidade').on('change', aplicarFiltros);

    carregarCSV("https://docs.google.com/spreadsheets/d/e/2PACX-1vR9WRiB3lzcwypd1oZpASlEJFyjQ97xROrMk0tX6KJu0pONpCIqnomr-dwZZ25DmGFTT7lv0OvjNG2H/pub?output=csv");
  </script>
</body>
</html>
