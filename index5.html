<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Despesas Públicas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.bootstrap5.min.css"/>
</head>
<body>
  <div class="container mt-4">
    <h2 class="mb-4">Despesas Públicas</h2>

    <div class="row g-2 mb-3">
      <div class="col-md-3">
        <select id="filtroAno" class="form-select">
          <option value="">Filtrar por Ano</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="filtroMes" class="form-select">
          <option value="">Filtrar por Mês</option>
          <option value="JANEIRO">Janeiro</option>
          <option value="FEVEREIRO">Fevereiro</option>
          <option value="MARCO">Março</option>
          <option value="ABRIL">Abril</option>
          <option value="MAIO">Maio</option>
          <option value="JUNHO">Junho</option>
          <option value="JULHO">Julho</option>
          <option value="AGOSTO">Agosto</option>
          <option value="SETEMBRO">Setembro</option>
          <option value="OUTUBRO">Outubro</option>
          <option value="NOVEMBRO">Novembro</option>
          <option value="DEZEMBRO">Dezembro</option>
        </select>
      </div>
    </div>

    <div class="d-flex justify-content-between mb-2">
      <button id="btnLimpar" class="btn btn-outline-primary btn-sm">Limpar Filtros</button>
      <div class="btn-group">
        <button id="exportCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
        <button id="exportXls" class="btn btn-outline-secondary btn-sm">XLS</button>
        <button id="exportJson" class="btn btn-outline-secondary btn-sm">JSON</button>
        <button id="exportTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
      </div>
    </div>

    <!-- Informação da célula Y2 -->
    <div class="text-end text-muted small mb-2" id="infoAtualizacao" style="display: none;"></div>

    <table id="tabela" class="table table-bordered table-striped" style="width:100%">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9WRiB3lzcwypd1oZpASlEJFyjQ97xROrMk0tX6KJu0pONpCIqnomr-dwZZ25DmGFTT7lv0OvjNG2H/pub?output=csv";
    let tabela;

    Papa.parse(urlCSV, {
      download: true,
      complete: function (res) {
        const headers = res.data[1];
        const dados = res.data.slice(2).filter(row => row.length > 1);

        // Preenche select de ano
        const anos = [...new Set(dados.map(r => r[0]))];
        anos.sort().forEach(ano => {
          $('#filtroAno').append(`<option value="${ano}">${ano}</option>`);
        });

        // Exibe a célula Y2 (linha 1, coluna 24)
        const celulaY2 = res.data?.[0]?.[23];
        if (celulaY2) {
          $('#infoAtualizacao').text(`Última atualização: ${celulaY2}`).show();
        }

        // Inicializa a DataTable
        tabela = $('#tabela').DataTable({
          data: dados,
          columns: headers.map(h => ({ title: h })),
          dom: 'Bfrtip',
          buttons: ['csv', 'excel', 'json', 'copy'],
          columnDefs: [{
            targets: headers.findIndex(h => h === 'Data Atualização'),
            visible: false
          }],
          language: {
            url: "//cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
          }
        });

        // Filtro por ano
        $('#filtroAno').on('change', function () {
          tabela.column(0).search(this.value).draw();
        });

        // Filtro por mês
        $('#filtroMes').on('change', function () {
          const mes = this.value;
          const colIndex = headers.findIndex(h => h === mes);
          if (colIndex !== -1) {
            tabela.columns().every(function (idx) {
              if (idx === colIndex) {
                this.visible(true);
              } else if (idx >= headers.findIndex(h => h === "JANEIRO") && idx <= headers.findIndex(h => h === "DEZEMBRO")) {
                this.visible(false);
              }
            });
          } else {
            tabela.columns().every(function (idx) {
              if (idx >= headers.findIndex(h => h === "JANEIRO") && idx <= headers.findIndex(h => h === "DEZEMBRO")) {
                this.visible(true);
              }
            });
          }
        });

        // Botão limpar
        $('#btnLimpar').on('click', function () {
          $('#filtroAno, #filtroMes').val('');
          tabela.search('').columns().search('').draw();
          tabela.columns().every(function (idx) {
            if (idx >= headers.findIndex(h => h === "JANEIRO") && idx <= headers.findIndex(h => h === "DEZEMBRO")) {
              this.visible(true);
            }
          });
        });

        // Exportações
        $('#exportCsv').on('click', () => tabela.button('.buttons-csv').trigger());
        $('#exportXls').on('click', () => tabela.button('.buttons-excel').trigger());
        $('#exportJson').on('click', () => {
          const data = tabela.data().toArray();
          const json = JSON.stringify(data, null, 2);
          const blob = new Blob([json], { type: "application/json" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "dados.json";
          link.click();
        });
        $('#exportTxt').on('click', () => {
          const data = tabela.data().toArray().map(row => row.join("\t")).join("\n");
          const blob = new Blob([data], { type: "text/plain" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = "dados.txt";
          link.click();
        });
      }
    });
  </script>
</body>
</html>
