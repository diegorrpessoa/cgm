<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Despesas Públicas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
  <style>
    table.dataTable tbody td {
      font-size: 0.7rem;
    }
    thead tr {
      font-size: 0.7rem;
    }
    tfoot tr {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container-fluid mt-4">
    <div class="row mb-3">
      <div class="col-md-2">
        <select id="filtroAno" class="form-select form-select-sm">
          <option value="">Todos os Anos</option>
        </select>
      </div>
      <div class="col-md-2">
        <select id="filtroMes" class="form-select form-select-sm">
          <option value="">Todos os Meses</option>
        </select>
      </div>
      <div class="col-md-4">
        <select id="filtroUnidade" class="form-select form-select-sm">
          <option value="">Todas as Unidades</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <table id="tabela" class="table table-bordered table-striped table-sm" style="width:100%">
        <thead class="table-light"></thead>
        <tbody></tbody>
        <tfoot>
          <tr></tr>
        </tfoot>
      </table>
    </div>

    <!-- Data de atualização -->
    <div id="dataAtualizacao" class="text-end mt-3" style="font-size: 0.65rem; color: #6c757d;">
      Atualizado em: carregando...
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <script>
    $(document).ready(function () {
      const urlCsv = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTzWz42lwpuf2FwYofqSsAgtDayYLAYCblodcAjQvV-pYxFGengPlHWubJjyTP6_6jidIhpQcuLuvC7/pub?gid=501851609&single=true&output=csv";

      // Exibir data de atualização
      fetch(urlCsv, { method: 'HEAD' })
        .then(response => {
          const lastModified = response.headers.get('Last-Modified');
          if (lastModified) {
            const data = new Date(lastModified);
            const formatada = data.toLocaleDateString('pt-BR') + ' às ' + data.toLocaleTimeString('pt-BR');
            $('#dataAtualizacao').text('Atualizado em: ' + formatada);
          } else {
            $('#dataAtualizacao').text('Atualizado em: data não disponível');
          }
        })
        .catch(() => {
          $('#dataAtualizacao').text('Atualizado em: erro ao obter data');
        });

      Papa.parse(urlCsv, {
        download: true,
        header: true,
        complete: function (results) {
          const data = results.data;
          const colunas = Object.keys(data[0]);
          const meses = ["JANEIRO", "FEVEREIRO", "MARCO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

          // Cabeçalho
          const thead = $('#tabela thead');
          const tr = $('<tr></tr>');
          colunas.forEach(coluna => {
            tr.append('<th>' + coluna + '</th>');
          });
          thead.append(tr);

          // Rodapé
          const tfoot = $('#tabela tfoot tr');
          colunas.forEach((coluna, i) => {
            tfoot.append('<th class="total" data-col="' + i + '"></th>');
          });

          // Tabela
          const tabela = $('#tabela').DataTable({
            data: data,
            columns: colunas.map(col => ({ data: col })),
            paging: true,
            searching: false,
            info: false,
            lengthChange: false,
            pageLength: 20,
            language: {
              "url": "//cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
            },
            footerCallback: function (row, data, start, end, display) {
              const api = this.api();
              api.columns().every(function () {
                const colIdx = this.index();
                const colTitle = colunas[colIdx];
                if (meses.includes(colTitle.toUpperCase()) || colTitle.toUpperCase() === "TOTAL") {
                  const total = this
                    .data()
                    .reduce((acc, val) => acc + (parseFloat(val.replace(",", ".")) || 0), 0);
                  $(api.column(colIdx).footer()).html(total.toLocaleString("pt-BR", { minimumFractionDigits: 2 }));
                } else {
                  $(api.column(colIdx).footer()).html('');
                }
              });
            }
          });

          // Filtros
          function preencherFiltro(selector, coluna) {
            const valoresUnicos = [...new Set(data.map(item => item[coluna]).filter(Boolean))];
            valoresUnicos.sort();
            valoresUnicos.forEach(valor => {
              $(selector).append(new Option(valor, valor));
            });
          }

          preencherFiltro("#filtroAno", "ANO");
          preencherFiltro("#filtroMes", "MES");
          preencherFiltro("#filtroUnidade", "Unidade Orçamentária");

          $('#filtroAno, #filtroMes, #filtroUnidade').on('change', function () {
            const ano = $('#filtroAno').val();
            const mes = $('#filtroMes').val();
            const unidade = $('#filtroUnidade').val();

            tabela.clear().rows.add(data.filter(item =>
              (!ano || item["ANO"] === ano) &&
              (!mes || item["MES"] === mes) &&
              (!unidade || item["Unidade Orçamentária"] === unidade)
            )).draw();
          });
        }
      });
    });
  </script>
</body>
</html>
