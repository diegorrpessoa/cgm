<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Despesas Públicas</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    .hidden-col {
      display: none;
    }
  </style>
</head>
<body class="container py-4">
  <h2>Despesas Públicas</h2>
  <div class="row my-3">
    <div class="col-md-3">
      <label for="filtroAno" class="form-label">Filtrar por Ano:</label>
      <select id="filtroAno" class="form-select"></select>
    </div>
    <div class="col-md-3">
      <label for="filtroMes" class="form-label">Filtrar por Mês:</label>
      <select id="filtroMes" class="form-select">
        <option value="">Todos</option>
        <option value="JANEIRO">Janeiro</option>
        <option value="FEVEREIRO">Fevereiro</option>
        <option value="MARCO">Março</option>
        <option value="ABRIL">Abril</option>
        <option value="MAIO">Maio</option>
        <option value="JUNHO">Junho</option>
        <option value="JULHO">Julho</option>
        <option value="AGOSTO">Agosto</option>
        <option value="SETEMBRO">Setembro</option>
        <option value="OUTUBRO">Outubro</option>
        <option value="NOVEMBRO">Novembro</option>
        <option value="DEZEMBRO">Dezembro</option>
      </select>
    </div>
    <div class="col-md-6 text-end align-self-end">
      <p id="dataAtualizacao" class="text-muted small"></p>
    </div>
  </div>
  <table id="tabela" class="display nowrap" style="width:100%"></table>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
  <script>
    $(document).ready(function () {
      const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9WRiB3lzcwypd1oZpASlEJFyjQ97xROrMk0tX6KJu0pONpCIqnomr-dwZZ25DmGFTT7lv0OvjNG2H/pub?output=csv";
      
      $.get(urlCSV, function (data) {
        const linhas = data.split("\n").map(l => l.split(","));
        const colunas = linhas[0];
        const dados = linhas.slice(1).map(l => colunas.reduce((obj, col, i) => { obj[col] = l[i]; return obj; }, {}));

        // Data de atualização na célula Y2 (coluna 24, linha 1)
        const dataAtualizacao = linhas[1][24];
        $("#dataAtualizacao").text("Dados atualizados em: " + dataAtualizacao);

        // Opções do filtro de ano
        const anosUnicos = [...new Set(dados.map(d => d["ANO"]))];
        anosUnicos.forEach(ano => {
          $("#filtroAno").append(`<option value="${ano}">${ano}</option>`);
        });

        // Inicializa a tabela
        const tabela = $("#tabela").DataTable({
          data: dados,
          columns: colunas.map((titulo, i) => ({
            title: titulo,
            data: titulo,
            visible: titulo !== "Data Atualização"
          })),
          paging: true,
          searching: false,
          scrollX: true,
          language: {
            url: "//cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
          }
        });

        // Filtro por ano
        $("#filtroAno").on("change", function () {
          const ano = $(this).val();
          tabela.column(colunas.indexOf("ANO")).search(ano).draw();
        });

        // Filtro por mês exclusivo
        $("#filtroMes").on("change", function () {
          const mesSelecionado = $(this).val();
          colunas.forEach((col, index) => {
            if (["JANEIRO","FEVEREIRO","MARCO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"].includes(col)) {
              const visible = mesSelecionado === "" || col === mesSelecionado;
              tabela.column(index).visible(visible);
            }
          });
        });
      });
    });
  </script>
</body>
</html>
