
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de Despesas Públicas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.3.6/css/buttons.dataTables.min.css">
</head>
<body>
<div class="container-fluid mt-4">

  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4>Consulta de Despesas Públicas</h4>
    <small id="ultimaAtualizacao" class="text-muted">Atualizado em: —</small>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-2">
      <select id="filtroAno" class="form-select"><option value="">Ano</option></select>
    </div>
    <div class="col-md-2">
      <select id="filtroMes" class="form-select"><option value="">Mês</option></select>
    </div>
    <div class="col-md-4">
      <select id="filtroUnidade" class="form-select"><option value="">Unidade Administrativa</option></select>
    </div>
    <div class="col-md-4 text-end">
      <button id="btnLimpar" class="btn btn-outline-secondary">Limpar Filtros</button>
    </div>
  </div>

  <table id="tabelaDespesas" class="display nowrap" style="width:100%">
    <thead></thead>
    <tbody></tbody>
    <tfoot></tfoot>
  </table>

  <div class="mt-3">
    <h5>Total do Mês Selecionado: <span id="totalMes" class="fw-bold">R$ 0,00</span></h5>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.3.6/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9WRiB3lzcwypd1oZpASlEJFyjQ97xROrMk0tX6KJu0pONpCIqnomr-dwZZ25DmGFTT7lv0OvjNG2H/pub?output=csv";
let dadosOriginais = [], tabela;

$(document).ready(function () {
  carregarDataUltimaAtualizacao();

  Papa.parse(urlCSV, {
    download: true,
    header: true,
    complete: function (results) {
      dadosOriginais = results.data.filter(l => l.ANO); // evita linha vazia
      inicializarFiltros();
      inicializarTabela(dadosOriginais);
    }
  });

  $('#filtroAno, #filtroMes, #filtroUnidade').on('change', aplicarFiltros);
  $('#btnLimpar').on('click', () => {
    $('#filtroAno, #filtroMes, #filtroUnidade').val('');
    aplicarFiltros();
  });
});

function carregarDataUltimaAtualizacao() {
  $.ajax({
    url: urlCSV,
    method: 'HEAD',
    complete: function (xhr) {
      const ultima = xhr.getResponseHeader("Last-Modified");
      if (ultima) {
        const dt = new Date(ultima);
        $('#ultimaAtualizacao').text("Atualizado em: " + dt.toLocaleString('pt-BR'));
      }
    }
  });
}

function inicializarFiltros() {
  popularFiltro("filtroAno", [...new Set(dadosOriginais.map(l => l.ANO))]);
  popularFiltro("filtroMes", ["JANEIRO", "FEVEREIRO", "MARCO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"]);
  popularFiltro("filtroUnidade", [...new Set(dadosOriginais.map(l => l["Unidade Administrativa"]))]);
}

function popularFiltro(id, opcoes) {
  opcoes.sort().forEach(v => $(`#${id}`).append(`<option value="${v}">${v}</option>`));
}

function aplicarFiltros() {
  const ano = $('#filtroAno').val();
  const mes = $('#filtroMes').val();
  const unidade = $('#filtroUnidade').val();

  const filtrados = dadosOriginais.filter(l => {
    return (!ano || l.ANO === ano)
      && (!unidade || l["Unidade Administrativa"] === unidade)
      && (!mes || parseFloat(l[mes]) > 0);
  });

  atualizarTabela(filtrados, mes);
}

function inicializarTabela(dados) {
  const colunas = Object.keys(dados[0] || {}).map(c => ({ title: c, data: c }));
  tabela = $('#tabelaDespesas').DataTable({
    data: dados,
    columns: colunas,
    scrollX: true,
    destroy: true,
    dom: 'Bfrtip',
    buttons: [
      {
        extend: 'excelHtml5',
        title: 'Despesas_Publicas',
        text: 'Exportar Excel',
        exportOptions: { columns: ':visible' }
      }
    ],
    language: {
      url: '//cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json'
    }
  });
  atualizarResumo(dados, '');
}

function atualizarTabela(dados, mes) {
  tabela.clear().rows.add(dados).draw();
  atualizarResumo(dados, mes);
}

function atualizarResumo(dados, mes) {
  let total = 0;
  const mesSelecionado = mes || $('#filtroMes').val();
  if (mesSelecionado) {
    total = dados.reduce((acc, linha) => acc + parseFloat(linha[mesSelecionado] || 0), 0);
  }
  $('#totalMes').text(total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }));
}
</script>
</body>
</html>
