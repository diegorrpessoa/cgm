<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Fiscais de Contratos</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>
body{background:#f8f9fa}
.dataTables_filter{display:none}
label{font-weight:600;font-size:.72rem!important;color:#343a40;margin-bottom:2px}
.form-select-sm,table{font-size:.70rem!important}
table.dataTable td,table.dataTable th{white-space:nowrap}
#indicadorAtualizacao{font-size:.65rem;color:#6c757d;text-align:right;margin-bottom:8px}
.spinner-overlay{position:fixed;top:0;left:0;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:60px;z-index:9999;background-color:rgba(255,255,255,.9)}
.export-group .btn{font-size:.70rem;padding:4px 8px}
#lengthSelectorContainer{font-size:.70rem;display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:6px}
#lengthSelector{width:80px;font-size:.70rem}
</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
<div class="spinner-border text-primary"></div>
<div class="mt-2">Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">Dados atualizados em...</div>

<div class="row g-2 mb-3">

<div class="col-md-2">
<label>ANO *</label>
<select id="anoFiltro" class="form-select form-select-sm"></select>
</div>

<div class="col-md-2">
<label>MÊS</label>
<select id="mesFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-md-2">
<label>UNIDADE GESTORA</label>
<select id="ugFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-md-2">
<label>Nº CONTRATO</label>
<select id="contratoFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-md-2">
<label>CONTRATADA</label>
<select id="contratadaFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-md-2">
<label>NOME DO FISCAL</label>
<select id="fiscalFiltro" class="form-select form-select-sm" disabled></select>
</div>

</div>

<div class="d-flex justify-content-between mb-2">
<button id="btnLimpar" class="btn btn-outline-primary btn-sm">Limpar Filtros</button>

<div class="btn-group export-group">
<button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
<button id="btnXlsx" class="btn btn-outline-secondary btn-sm">XLSX</button>
<button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
<button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
</div>
</div>

<div id="lengthSelectorContainer">
<label>Registros por página:</label>
<select id="lengthSelector" class="form-select form-select-sm">
<option>10</option>
<option selected>25</option>
<option>50</option>
<option>100</option>
</select>
</div>

<div class="table-responsive">
<table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

const urlCSV="https://docs.google.com/spreadsheets/d/1baF_FTzQv9RxkOnst7MgicsUqld3m590nM5K-ih9xp8/export?format=csv&gid=1659253784";

let dadosOriginais=[];
let tabela=null;

const campos={
ano:"ANO",
mes:"MÊS",
ug:"UNIDADE GESTORA (UG)",
contrato:"CONTRATO",
contratada:"CONTRATADA",
fiscal:"NOME DO FISCAL"
};

$(document).ready(()=>{
carregarCSV();
});

function limpar(v){
return (v||"").toString().trim().replace(/^"+|"+$/g,"");
}

function carregarCSV(){

Papa.parse(urlCSV,{
download:true,
header:true,
skipEmptyLines:true,
complete:(r)=>{

dadosOriginais=r.data.map(x=>({
"ANO":limpar(x["ANO"]),
"MÊS":limpar(x["MÊS"]),
"UNIDADE GESTORA (UG)":limpar(x["UNIDADE GESTORA (UG)"]),
"CONTRATO":limpar(x["CONTRATO"]),
"CONTRATADA":limpar(x["CONTRATADA"]),
"NOME DO FISCAL":limpar(x["NOME DO FISCAL"]),
"CARGO / FUNÇÃO":limpar(x["CARGO / FUNÇÃO"]),
"PORTARIA":limpar(x["PORTARIA"]),
"DATA PORTARIA":limpar(x["DATA PORTARIA"]),
"LINK":limpar(x["LINK"]),
"ATUALIZAÇÃO":limpar(x["ATUALIZAÇÃO"])
})).filter(x=>x["ANO"]);

if(dadosOriginais.length){
$("#indicadorAtualizacao").html("Dados atualizados em: <b>"+(dadosOriginais[0]["ATUALIZAÇÃO"]||"-")+"</b>");
}

popularAnos();
eventos();
$("#spinnerCsv").fadeOut(300);
}
});

}

function eventos(){
$("#anoFiltro,#mesFiltro,#ugFiltro,#contratoFiltro,#contratadaFiltro,#fiscalFiltro").on("change",()=>{
atualizarFiltros();
renderTabela(aplicarFiltros());
});

$("#btnLimpar").on("click",limparFiltros);
$("#btnCsv").on("click",exportarCSV);
$("#btnXlsx").on("click",exportarXLSX);
$("#btnTxt").on("click",exportarTXT);
$("#btnJson").on("click",exportarJSON);
}

function popular(select,valores){
const s=$(select);
const atual=s.val();
s.empty();
s.append('<option value="">Selecione...</option>');
s.append('<option value="TODOS">Todos</option>');
valores.sort((a,b)=>a.localeCompare(b,'pt-BR')).forEach(v=>s.append(`<option value="${v}">${v}</option>`));
if(valores.includes(atual)) s.val(atual);
}

function popularAnos(){
const anos=[...new Set(dadosOriginais.map(x=>x["ANO"]))].sort().reverse();
popular("#anoFiltro",anos);
}

function atualizarFiltros(){

const ano=$("#anoFiltro").val();

if(!ano){
["#mesFiltro","#ugFiltro","#contratoFiltro","#contratadaFiltro","#fiscalFiltro"].forEach(id=>{
$(id).prop("disabled",true).html('<option value="">Selecione...</option>');
});
return;
}

let base=dadosOriginais.filter(x=>ano==="TODOS"||x["ANO"]===ano);

popular("#mesFiltro",[...new Set(base.map(x=>x["MÊS"]))]);
$("#mesFiltro").prop("disabled",false);

const mes=$("#mesFiltro").val();
if(mes && mes!=="TODOS") base=base.filter(x=>x["MÊS"]===mes);

popular("#ugFiltro",[...new Set(base.map(x=>x["UNIDADE GESTORA (UG)"]))]);
$("#ugFiltro").prop("disabled",false);

const ug=$("#ugFiltro").val();
if(ug && ug!=="TODOS") base=base.filter(x=>x["UNIDADE GESTORA (UG)"]===ug);

popular("#contratoFiltro",[...new Set(base.map(x=>x["CONTRATO"]))]);
$("#contratoFiltro").prop("disabled",false);

const contrato=$("#contratoFiltro").val();
if(contrato && contrato!=="TODOS") base=base.filter(x=>x["CONTRATO"]===contrato);

popular("#contratadaFiltro",[...new Set(base.map(x=>x["CONTRATADA"]))]);
$("#contratadaFiltro").prop("disabled",false);

const contratada=$("#contratadaFiltro").val();
if(contratada && contratada!=="TODOS") base=base.filter(x=>x["CONTRATADA"]===contratada);

popular("#fiscalFiltro",[...new Set(base.map(x=>x["NOME DO FISCAL"]))]);
$("#fiscalFiltro").prop("disabled",false);
}

function aplicarFiltros(){

const ano=$("#anoFiltro").val();
if(!ano) return [];

return dadosOriginais.filter(r=>{

if(ano!=="TODOS" && r["ANO"]!==ano) return false;

const filtros=[
["mesFiltro","MÊS"],
["ugFiltro","UNIDADE GESTORA (UG)"],
["contratoFiltro","CONTRATO"],
["contratadaFiltro","CONTRATADA"],
["fiscalFiltro","NOME DO FISCAL"]
];

for(const f of filtros){
const v=$("#"+f[0]).val();
if(v && v!=="TODOS" && r[f[1]]!==v) return false;
}

return true;
});
}

function renderTabela(dados){

if(tabela){
tabela.destroy();
$("#tabela").empty();
}

tabela=$("#tabela").DataTable({
data:dados,
pageLength:parseInt($("#lengthSelector").val()),
scrollX:true,
columns:[
{title:"ANO",data:"ANO"},
{title:"MÊS",data:"MÊS"},
{title:"UNIDADE GESTORA",data:"UNIDADE GESTORA (UG)"},
{title:"CONTRATO",data:"CONTRATO"},
{title:"CONTRATADA",data:"CONTRATADA"},
{title:"NOME DO FISCAL",data:"NOME DO FISCAL"},
{title:"CARGO / FUNÇÃO",data:"CARGO / FUNÇÃO"},
{title:"PORTARIA",data:"PORTARIA"},
{title:"DATA PORTARIA",data:"DATA PORTARIA"},
{
title:"LINK",
data:"LINK",
render:function(d){
if(!d) return "";
return '<a href="'+d+'" target="_blank">Abrir</a>';
}
}
],
language:{url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"}
});
}

function limparFiltros(){
$("select").val("");
$("#mesFiltro,#ugFiltro,#contratoFiltro,#contratadaFiltro,#fiscalFiltro").prop("disabled",true);
if(tabela){tabela.destroy();$("#tabela").empty();}
}

function nome(ext){return "fiscais-contratos."+ext;}

function baixar(blob,n){
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=n;
a.click();
}

function dadosExport(){
return tabela ? tabela.rows({search:'applied'}).data().toArray() : [];
}

function exportarCSV(){
const csv=Papa.unparse(dadosExport());
baixar(new Blob(["\ufeff"+csv]),nome("csv"));
}

function exportarJSON(){
baixar(new Blob([JSON.stringify(dadosExport(),null,2)]),nome("json"));
}

function exportarTXT(){
baixar(new Blob([dadosExport().map(x=>Object.values(x).join(" | ")).join("\n")]),nome("txt"));
}

function exportarXLSX(){
const wb=XLSX.utils.book_new();
const ws=XLSX.utils.json_to_sheet(dadosExport());
XLSX.utils.book_append_sheet(wb,ws,"Fiscais");
XLSX.writeFile(wb,nome("xlsx"));
}

</script>
</body>
</html>
