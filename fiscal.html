<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Painel de Fiscais de Contrato</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>
<style>
body{background:#f8f9fa}
.dataTables_filter{display:none}
label{font-weight:600;font-size:.72rem!important;color:#343a40;margin-bottom:2px}
.form-select-sm,table{font-size:.70rem!important}
table.dataTable td,table.dataTable th{white-space:nowrap}
#indicadorAtualizacao{font-size:.65rem;color:#6c757d;text-align:right;margin-bottom:8px}
.spinner-overlay{position:fixed;top:0;left:0;width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:60px;z-index:9999;background:rgba(255,255,255,.9)}
#lengthSelectorContainer{font-size:.70rem;display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
</style>
</head>
<body>

<div id="spinnerCsv" class="spinner-overlay">
<div class="spinner-border text-primary"></div>
<div>Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">
<div id="indicadorAtualizacao">Dados atualizados em...</div>

<div class="row gx-2 gy-2 mb-3">
<div class="col-md-2"><label>ANO *</label><select id="anoFiltro" class="form-select form-select-sm"></select></div>
<div class="col-md-2"><label>MÊS</label><select id="mesFiltro" class="form-select form-select-sm" disabled></select></div>
<div class="col-md-2"><label>UNIDADE GESTORA</label><select id="ugFiltro" class="form-select form-select-sm" disabled></select></div>
<div class="col-md-2"><label>CONTRATO</label><select id="contratoFiltro" class="form-select form-select-sm" disabled></select></div>
<div class="col-md-2"><label>CONTRATADA</label><select id="contratadaFiltro" class="form-select form-select-sm" disabled></select></div>
<div class="col-md-2"><label>NOME DO FISCAL</label><select id="fiscalFiltro" class="form-select form-select-sm" disabled></select></div>
</div>

<div class="d-flex justify-content-between mb-2">
<button id="btnLimpar" class="btn btn-outline-primary btn-sm">Limpar Filtros</button>
</div>

<div id="lengthSelectorContainer">
<label>Registros por página:</label>
<select id="lengthSelector" class="form-select form-select-sm" style="width:80px">
<option>10</option><option>25</option><option>50</option><option>100</option>
</select>
</div>

<div class="table-responsive">
<table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
const urlCSV="https://docs.google.com/spreadsheets/d/1baF_FTzQv9RxkOnst7MgicsUqld3m590nM5K-ih9xp8/export?format=csv&gid=1659253784";
let dados=[], tabela=null;

function limpar(v){return (v||"").toString().trim();}
function opts(id,vals){
 let s=$(id); let cur=s.val();
 s.html('<option value="">Selecione...</option><option value="TODOS">Todos</option>');
 vals.forEach(v=>s.append(`<option value="${v}">${v}</option>`));
 s.prop('disabled',false);
 if(vals.includes(cur)) s.val(cur);
}

Papa.parse(urlCSV,{download:true,header:true,skipEmptyLines:true,
complete:r=>{
dados=r.data.map(x=>({
ANO:limpar(x["ANO"]),
MES:limpar(x["MÊS"]),
UG:limpar(x["UNIDADE GESTORA (UG)"]),
CONTRATO:limpar(x["CONTRATO"]),
CONTRATADA:limpar(x["CONTRATADA"]),
FISCAL:limpar(x["NOME DO FISCAL"]),
CARGO:limpar(x["CARGO / FUNÇÃO"]),
PORTARIA:limpar(x["PORTARIA"]),
DATA:limpar(x["DATA PORTARIA"]),
LINK:limpar(x["LINK"]),
ATUALIZACAO:limpar(x["ATUALIZAÇÃO"])
})).filter(x=>x.ANO);

$("#indicadorAtualizacao").html("Dados atualizados em: <b>"+(dados[0]?.ATUALIZACAO||"")+"</b>");
let anos=[...new Set(dados.map(x=>x.ANO))].sort().reverse();
opts("#anoFiltro",anos);
$("#spinnerCsv").hide();
}});

function filtrados(){
 return dados.filter(r=>{
 const f=(id,val)=>!$(id).val()||$(id).val()=="TODOS"||$(id).val()==val;
 return f("#anoFiltro",r.ANO)&&f("#mesFiltro",r.MES)&&f("#ugFiltro",r.UG)&&f("#contratoFiltro",r.CONTRATO)&&f("#contratadaFiltro",r.CONTRATADA)&&f("#fiscalFiltro",r.FISCAL);
 });
}

function atualizarCombos(){
 let base=dados.filter(r=>!$("#anoFiltro").val()||$("#anoFiltro").val()=="TODOS"||r.ANO==$("#anoFiltro").val());
 opts("#mesFiltro",[...new Set(base.map(x=>x.MES))].sort());
 opts("#ugFiltro",[...new Set(base.map(x=>x.UG))].sort());
 opts("#contratoFiltro",[...new Set(base.map(x=>x.CONTRATO))].sort());
 opts("#contratadaFiltro",[...new Set(base.map(x=>x.CONTRATADA))].sort());
 opts("#fiscalFiltro",[...new Set(base.map(x=>x.FISCAL))].sort());
 render();
}

function render(){
 let d=filtrados();
 if(tabela){tabela.destroy();$("#tabela").empty();}
 tabela=$("#tabela").DataTable({
 data:d,
 pageLength:parseInt($("#lengthSelector").val()),
 columns:[
 {title:"ANO",data:"ANO"},
 {title:"MÊS",data:"MES"},
 {title:"UNIDADE GESTORA",data:"UG"},
 {title:"CONTRATO",data:"CONTRATO"},
 {title:"CONTRATADA",data:"CONTRATADA"},
 {title:"NOME DO FISCAL",data:"FISCAL"},
 {title:"CARGO / FUNÇÃO",data:"CARGO"},
 {title:"PORTARIA",data:"PORTARIA"},
 {title:"DATA PORTARIA",data:"DATA"},
 {title:"LINK",data:"LINK",render:d=>d?`<a href="${d}" target="_blank">Acessar</a>`:""}
 ]
 });
}

$(document).on("change","#anoFiltro,#mesFiltro,#ugFiltro,#contratoFiltro,#contratadaFiltro,#fiscalFiltro",atualizarCombos);
$("#btnLimpar").on("click",()=>location.reload());
</script>
</body>
</html>
