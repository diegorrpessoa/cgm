<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel Gerencial de Despesas - Calamidade Pública</title>

<meta http-equiv="Cache-Control" content="no-store"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{background:#f8f9fa;}
.dataTables_filter{display:none;}

#loginScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
z-index:99999;
}

.login-box{
width:300px;
padding:20px;
border:1px solid #dee2e6;
border-radius:8px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
text-align:center;
}

#app{display:none;}

label{
font-weight:600;
font-size:.72rem!important;
color:#343a40;
margin-bottom:2px;
}

.form-select-sm,table{font-size:.7rem!important;}

table.dataTable td,table.dataTable th{
white-space:pre-line;
}

.spinner-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding-top:60px;
z-index:9999;
background:rgba(255,255,255,.9);
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<div class="login-box">

<h6>Acesso restrito</h6>

<input type="password" id="senhaInput" class="form-control mb-2" placeholder="Digite a senha"/>

<button id="btnLogin" class="btn btn-primary w-100">Entrar</button>

<div id="erroLogin" class="text-danger small mt-2" style="display:none;">
Senha incorreta
</div>

</div>
</div>

<!-- SISTEMA -->
<div id="app">

<div id="spinnerCsv" class="spinner-overlay">
<div class="spinner-border text-primary"></div>
<div>Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<div class="d-flex justify-content-between mb-2">
<div id="indicadorAtualizacao">Dados atualizados automaticamente...</div>
<button id="btnLogout" class="btn btn-sm btn-outline-danger">Sair</button>
</div>

<div class="row gx-2 gy-2 mb-3">

<div class="col-sm-3">
<label>Unidade Gestora (UG)</label>
<select id="ugFiltro" class="form-select form-select-sm"></select>
</div>

<div class="col-sm-3">
<label>Fornecedor</label>
<select id="fornecedorFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-2">
<label>CNPJ/CPF</label>
<select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-4">
<label>Objeto</label>
<select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
</div>

</div>

<div class="mb-2" id="resumoValores" style="display:none;">
<span id="totalPago">Valor pago: R$ 0,00</span>
</div>

<div class="d-flex justify-content-between mb-2">

<button id="btnLimpar" class="btn btn-outline-primary btn-sm">Limpar</button>

<div class="btn-group">
<button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
<button id="btnXlsx" class="btn btn-outline-secondary btn-sm">XLSX</button>
<button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
<button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
</div>

</div>

<select id="lengthSelector" class="form-select form-select-sm mb-2" style="width:120px;">
<option value="10">10</option>
<option value="25">25</option>
<option value="50">50</option>
</select>

<table id="tabela" class="table table-bordered table-sm w-100" style="display:none;"></table>

</div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

/* ================= LOGIN ================= */

const SENHA_CORRETA="123456";

function verificarAcesso(){
if(sessionStorage.getItem("auth")==="true"){
$("#loginScreen").hide();
$("#app").show();
iniciarSistema();
}else{
$("#loginScreen").show();
$("#app").hide();
}
}

$("#btnLogin").click(()=>{
if($("#senhaInput").val()===SENHA_CORRETA){
sessionStorage.setItem("auth","true");
verificarAcesso();
}else{
$("#erroLogin").show();
}
});

$("#senhaInput").keypress(e=>{
if(e.which===13) $("#btnLogin").click();
});

$("#btnLogout").click(()=>{
sessionStorage.removeItem("auth");
location.reload();
});

/* ================= SISTEMA ================= */

function iniciarSistema(){

let tabela;
let dadosOriginais=[];
let indiceColunaP=15;
let colunasPermitidas=[];
let indexUG={};

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTlGsiFZMCNFlaIq5mj-1uBcry5CKVlKi29x6cQ-GssQ0lzXcUdnWv6q2h3Qpc7dzL06bsOYF_HR41q/pub?output=csv&nocache="+new Date().getTime();

const campos={
ug:"Unidade Gestora (UG)",
fornecedor:"Fornecedor",
cnpj:"CNPJ/CPF Fornecedor",
objeto:"Objeto - Bens e serviços"
};

const ordem=Object.keys(campos);

function parseMoeda(v){
return parseFloat(v?.toString().replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".") )||0;
}

Papa.parse(urlCSV,{
download:true,
header:true,
worker:true,
complete:r=>{

dadosOriginais=r.data.filter(d=>d[campos.ug]);

dadosOriginais=dadosOriginais.map(r=>{
let c={...r};
c._valorPago=parseMoeda(Object.values(c)[indiceColunaP]);
return c;
});

colunasPermitidas=Object.keys(dadosOriginais[0]).slice(0,19);

dadosOriginais.forEach(r=>{
let ug=r[campos.ug];
if(!indexUG[ug]) indexUG[ug]=[];
indexUG[ug].push(r);
});

carregarUG();
$("#spinnerCsv").fadeOut(200);

}
});

function carregarUG(){
let s=$("#ugFiltro");
s.append('<option value="">Selecione</option>');
s.append('<option value="todos">Todos</option>');
Object.keys(indexUG).forEach(v=>{
s.append(`<option value="${v}">${v}</option>`);
});
}

function aplicarFiltro(){
let ug=$("#ugFiltro").val();
if(!ug)return[];

let base=ug==="todos"?dadosOriginais:indexUG[ug];

ordem.slice(1).forEach(f=>{
let v=$("#"+f+"Filtro").val();
if(v) base=base.filter(r=>r[campos[f]]===v);
});

return base;
}

function render(dados){

if(!dados.length) return $("#tabela").hide();

$("#tabela").show();

if(tabela){
tabela.clear().rows.add(dados).draw();
return;
}

tabela=$("#tabela").DataTable({
data:dados,
columns:colunasPermitidas.map(c=>({title:c,data:c})),
pageLength:10
});

}

function atualizar(){
let d=aplicarFiltro();
render(d);
}

$("#ugFiltro").change(atualizar);

$("#btnLimpar").click(()=>location.reload());

$("#btnCsv").click(()=>{
let d=aplicarFiltro();
download("dados.csv",Papa.unparse(d));
});

$("#btnJson").click(()=>{
let d=aplicarFiltro();
download("dados.json",JSON.stringify(d,null,2));
});

$("#btnTxt").click(()=>{
let d=aplicarFiltro();
download("dados.txt",Papa.unparse(d,{delimiter:";"}));
});

$("#btnXlsx").click(()=>{
let d=aplicarFiltro();
let ws=XLSX.utils.json_to_sheet(d);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Dados");
XLSX.writeFile(wb,"dados.xlsx");
});

function download(nome,conteudo){
let blob=new Blob([conteudo]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=nome;
a.click();
}

}

/* INIT */
verificarAcesso();

</script>

</body>
</html>
