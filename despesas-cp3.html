<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel Gerencial de Despesas - Calamidade Pública</title>

<meta http-equiv="Cache-Control" content="no-store"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>
body{background:#f8f9fa;}
.dataTables_filter{display:none;}

label{
font-weight:600;
font-size:.72rem!important;
color:#343a40;
margin-bottom:2px;
}

.form-select-sm,table{font-size:.7rem!important;}

table.dataTable td,table.dataTable th{
white-space:pre-line;
}

.dataTables_wrapper .dataTables_paginate{
margin-top:.5rem;
display:flex;
justify-content:center;
gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
padding:4px 8px!important;
font-size:.65rem!important;
border-radius:6px!important;
background:#e9ecef!important;
border:1px solid #dee2e6!important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
background:#0d6efd!important;
color:#fff!important;
font-weight:bold!important;
}

.export-group .btn{font-size:.7rem;padding:4px 8px;}

#indicadorAtualizacao{
font-size:.65rem;
color:#6c757d;
text-align:right;
margin-bottom:8px;
}

.spinner-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding-top:60px;
z-index:9999;
background:rgba(255,255,255,.9);
}

.spinner-border{width:2rem;height:2rem;}
.spinner-text{font-size:.9rem;margin-top:5px;}

.totalizadores{
font-size:.7rem;
background:#fff;
padding:5px 10px;
border:1px solid #dee2e6;
border-radius:4px;
}

.totalizadores span{
display:inline-block;
margin-right:15px;
font-weight:600;
}

#lengthSelectorContainer{
font-size:.7rem;
display:flex;
justify-content:flex-end;
align-items:center;
gap:6px;
margin-bottom:6px;
}

#lengthSelector{
width:80px;
font-size:.7rem;
}
</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
<div class="spinner-border text-primary"></div>
<div class="spinner-text">Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
Dados atualizados automaticamente em...
</div>

<div class="row gx-2 gy-2 mb-3">

<div class="col-sm-3">
<label>Unidade Gestora (UG) *</label>
<select id="ugFiltro" class="form-select form-select-sm"></select>
</div>

<div class="col-sm-3">
<label>Fornecedor</label>
<select id="fornecedorFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-2">
<label>CNPJ/CPF Fornecedor</label>
<select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-4">
<label>Objeto</label>
<select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
</div>

</div>

<div class="totalizadores mb-2" id="resumoValores" style="display:none;">
<span id="totalPago">Valor pago: R$ 0,00</span>
</div>

<div class="d-flex justify-content-between mb-2">

<button id="btnLimpar" class="btn btn-outline-primary btn-sm">
Limpar filtros
</button>

<div class="export-group btn-group">
<button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
<button id="btnXlsx" class="btn btn-outline-secondary btn-sm">XLSX</button>
<button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
<button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
</div>

</div>

<div id="lengthSelectorContainer">
<label>Registros por página:</label>
<select id="lengthSelector" class="form-select form-select-sm">
<option value="10">10</option>
<option value="25">25</option>
<option value="50">50</option>
<option value="100">100</option>
</select>
</div>

<div class="table-responsive">
<table id="tabela" class="table table-bordered table-striped table-sm w-100" style="display:none;"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela;
let dadosOriginais=[];
let indiceColunaP=15;
let colunasPermitidas=[];
let indexUG={};

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vTlGsiFZMCNFlaIq5mj-1uBcry5CKVlKi29x6cQ-GssQ0lzXcUdnWv6q2h3Qpc7dzL06bsOYF_HR41q/pub?output=csv&nocache="+new Date().getTime();

const campos={
ug:"Unidade Gestora (UG)",
fornecedor:"Fornecedor",
cnpj:"CNPJ/CPF Fornecedor",
objeto:"Objeto - Bens e serviços"
};

const ordem=Object.keys(campos);

/* NOME PADRÃO BR */
function gerarNomeArquivo(extensao){
let agora=new Date();

let data=agora.toLocaleDateString("pt-BR",{timeZone:"America/Sao_Paulo"}).replace(/\//g,"-");
let hora=agora.toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo",hour12:false}).replace(/:/g,"-");

return `pjf-despesas-cp-${data}-${hora}.${extensao}`;
}

function parseMoeda(valor){
if(!valor)return 0;
return parseFloat(valor.toString().replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".") )||0;
}

function transformarLinks(texto){
if(!texto) return texto;

return texto.toString().split(/\n|\|/).map(l=>{
let t=l.trim();
if(!t)return "";

let url=t.match(/(https?:\/\/[^\s]+)/);
if(url){
let u=url[0];
let a=t.replace(u,"").trim();
return `<a href="${u}" target="_blank">${a||u}</a>`;
}
return t;
}).join("<br>");
}

function normalizarQuebrasExportacao(valor){
if(!valor)return valor;
return valor.toString().replace(/\n+/g," | ").replace(/\|+/g," | ").trim();
}

/* CORREÇÃO DO LOOP */
Papa.parse(urlCSV,{
download:true,
header:true,
worker:true,

complete:r=>{

try{

if(!r || !r.data || !r.data.length) throw "CSV vazio";

dadosOriginais=r.data.filter(d=>d[campos.ug]);

if(!dadosOriginais.length) throw "Sem dados válidos";

let linhaAtualizacao=dadosOriginais.find(x=>x["Atualizacao"]);

if(linhaAtualizacao){
$("#indicadorAtualizacao").html(`Dados atualizados automaticamente em: <b>${linhaAtualizacao["Atualizacao"]}</b>`);
}

dadosOriginais=dadosOriginais.map(r=>{
let copia={...r};
copia._valorPago=parseMoeda(Object.values(copia)[indiceColunaP]);
delete copia["Atualizacao"];
return copia;
});

if(!dadosOriginais[0]) throw "Erro estrutura";

colunasPermitidas=Object.keys(dadosOriginais[0]).slice(0,19);

dadosOriginais.forEach(r=>{
let ug=r[campos.ug];
if(!indexUG[ug]) indexUG[ug]=[];
indexUG[ug].push(r);
});

carregarUG();

}catch(e){
console.error("Erro:",e);
alert("Erro ao carregar dados. Verifique a fonte.");
}

$("#spinnerCsv").fadeOut(200);

},

error:e=>{
console.error("Erro CSV:",e);
$("#spinnerCsv").fadeOut(200);
}

});

function carregarUG(){
let s=$("#ugFiltro");
s.append('<option value="">Selecione...</option>');
s.append('<option value="todos">Todos</option>');
Object.keys(indexUG).sort().forEach(v=>{
s.append(`<option value="${v}">${v}</option>`);
});
}

function aplicarFiltroAtual(){
let ug=$("#ugFiltro").val();
if(!ug)return[];

let base=(ug==="todos")?dadosOriginais:indexUG[ug];

ordem.slice(1).forEach(f=>{
let v=$("#"+f+"Filtro").val();
if(v) base=base.filter(r=>r[campos[f]]===v);
});

return base;
}

function atualizarFiltros(){
ordem.slice(1).forEach(f=>{
let s=$("#"+f+"Filtro");
let base=aplicarFiltroAtual();
let valores=[...new Set(base.map(r=>r[campos[f]]).filter(Boolean))].sort();

s.empty().append('<option value="">Selecione...</option>');
valores.forEach(v=>s.append(`<option value="${v}">${v}</option>`));
s.prop("disabled",!valores.length);
});
}

function atualizarResumo(dados){
if(!dados.length)return $("#resumoValores").hide();

let total=dados.reduce((t,r)=>t+r._valorPago,0);
$("#totalPago").text("Valor pago: "+total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}));
$("#resumoValores").show();
}

function renderTabela(dados){

if(!dados.length)return $("#tabela").hide();

$("#tabela").show();

if(tabela){
tabela.clear().rows.add(dados).draw();
return;
}

tabela=$("#tabela").DataTable({
data:dados,
columns:colunasPermitidas.map(c=>({
title:c,
data:c,
render:(d,t)=>t==="display"?transformarLinks(d):d
})),
scrollX:true,
scrollY:"55vh",
paging:true,
pageLength:10,
lengthChange:false,
language:{url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"}
});

$("#lengthSelector").on("change",function(){
tabela.page.len(this.value).draw();
});
}

function aplicarTudo(){
let dados=aplicarFiltroAtual();
atualizarFiltros();
atualizarResumo(dados);
renderTabela(dados);
}

$("#ugFiltro").on("change",()=>{
ordem.slice(1).forEach(f=>$("#"+f+"Filtro").val("").prop("disabled",false));
aplicarTudo();
});

ordem.slice(1).forEach(f=>{
$("#"+f+"Filtro").on("change",aplicarTudo);
});

$("#btnLimpar").on("click",()=>location.reload());

function obterDadosTabela(){
return tabela ? tabela.rows({search:'applied'}).data().toArray() : [];
}

function limparCamposInternos(dados){
return dados.map(i=>{
let o={};
Object.keys(i).forEach(k=>{
if(k!=="_valorPago"){
let v=i[k];
if(typeof v==="string") v=normalizarQuebrasExportacao(v);
o[k]=v;
}
});
return o;
});
}

function downloadArquivo(nome,conteudo,tipo){
let blob=new Blob([conteudo],{type:tipo});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=nome;
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}

$("#btnCsv").click(()=>{
let d=limparCamposInternos(obterDadosTabela());
downloadArquivo(gerarNomeArquivo("csv"),Papa.unparse(d),"text/csv");
});

$("#btnTxt").click(()=>{
let d=limparCamposInternos(obterDadosTabela());
downloadArquivo(gerarNomeArquivo("txt"),Papa.unparse(d,{delimiter:";"}),"text/plain");
});

$("#btnJson").click(()=>{
let d=limparCamposInternos(obterDadosTabela());
downloadArquivo(gerarNomeArquivo("json"),JSON.stringify(d,null,2),"application/json");
});

$("#btnXlsx").click(()=>{
let d=limparCamposInternos(obterDadosTabela());
let ws=XLSX.utils.json_to_sheet(d);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Despesas");
XLSX.writeFile(wb,gerarNomeArquivo("xlsx"));
});

</script>

</body>
</html>
