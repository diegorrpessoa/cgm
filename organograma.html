<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organograma Prefeitura de Juiz de Fora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }

    .org-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      position: relative;
    }

    .org-node {
      padding: 12px 20px;
      border-radius: 12px;
      background-color: #ffffff;
      border: 2px solid #000000;
      font-size: 0.95rem;
      text-align: center;
      min-width: 200px;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .org-node.root {
      font-weight: bold;
      border-color: #d67f0b;
      background-color: #fdf2e3;
    }

    .vertical-line {
      width: 2px;
      background-color: #000;
      height: 30px;
      margin: 0 auto;
    }

    .children-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      position: relative;
    }

    .children-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .subitems {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      margin-top: 10px;
      position: relative;
      padding-left: 30px;
    }

    .subitems.show {
      display: flex;
    }

    .subitems::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: #000;
    }

    .sub-node {
      margin: 10px 0;
      position: relative;
    }

    .sub-node::before {
      content: "";
      position: absolute;
      left: -20px;
      top: 50%;
      width: 20px;
      height: 2px;
      background-color: #000;
      transform: translateY(-50%);
    }

    @media (max-width: 768px) {
      .org-node {
        min-width: 160px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-primary" onclick="exportToPDF()">Exportar como PDF</button>
    </div>

    <div id="organograma" class="org-container">
      <!-- Prefeitura -->
      <div class="org-node root">Prefeitura de<br>Juiz de Fora</div>
      <div class="vertical-line"></div>

      <!-- Prefeita e Vice -->
      <div class="children-row">
        <div class="children-column">
          <div class="org-node">Prefeita</div>
        </div>
        <div class="children-column">
          <div class="org-node">Vice Prefeito</div>
        </div>
      </div>

      <div class="vertical-line"></div>

      <!-- Administração Direta e Indireta -->
      <div class="children-row">
        <!-- Administração Direta -->
        <div class="children-column">
          <div class="org-node" onclick="toggleSub('subDireta')">Administração Direta</div>
          <div id="subDireta" class="subitems">
            <div class="org-node sub-node">Administração Direta 1</div>
            <div class="org-node sub-node">Administração Direta 2</div>
            <div class="org-node sub-node">Administração Direta 3</div>
            <div class="org-node sub-node">Administração Direta 4</div>
          </div>
        </div>

        <!-- Administração Indireta -->
        <div class="children-column">
          <div class="org-node" onclick="toggleSub('subIndireta')">Administração Indireta</div>
          <div id="subIndireta" class="subitems">
            <div class="org-node sub-node">Administração Indireta 1</div>
            <div class="org-node sub-node">Administração Indireta 2</div>
            <div class="org-node sub-node">Administração Indireta 3</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleSub(id) {
      document.getElementById(id).classList.toggle('show');
    }

    async function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'pt', 'a4');
      const element = document.getElementById("organograma");

      const canvas = await html2canvas(element, { scale: 2 });
      const imgData = canvas.toDataURL('image/png');

      const imgProps = pdf.getImageProperties(imgData);
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;

      pdf.addImage(imgData, 'PNG', 0, 20, pdfWidth, pdfHeight);
      pdf.save("organograma.pdf");
    }
  </script>
</body>
</html>
