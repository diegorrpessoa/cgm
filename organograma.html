<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organograma da Prefeitura de Juiz de Fora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OerWCx+0Zl5uPzQ10SjF1uDkySgM+0Z+p2P+b2Fp2x+0zOq8vN+zQ" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="organograma-container">
            <div class="node top-node clickable" data-bs-toggle="collapse" data-bs-target="#prefeituraCollapse" aria-expanded="true" aria-controls="prefeituraCollapse">
                Prefeitura de Juiz de Fora
            </div>
            <div class="collapse show" id="prefeituraCollapse">
                <div class="branch branch-top">
                    <div class="node-wrapper">
                        <div class="node clickable" data-bs-toggle="collapse" data-bs-target="#prefeitaCollapse" aria-expanded="true" aria-controls="prefeitaCollapse">Prefeita</div>
                        <div class="collapse show" id="prefeitaCollapse">
                            <div class="branch branch-left">
                                <div class="node-wrapper">
                                    <div class="node clickable" data-bs-toggle="collapse" data-bs-target="#admDiretaCollapse" aria-expanded="true" aria-controls="admDiretaCollapse">Administração Direta</div>
                                    <div class="collapse show" id="admDiretaCollapse">
                                        <div class="branch branch-vertical">
                                            <div class="node-wrapper"><div class="node">Administração Direta 1</div></div>
                                            <div class="node-wrapper"><div class="node">Administração Direta 2</div></div>
                                            <div class="node-wrapper"><div class="node">Administração Direta 3</div></div>
                                            <div class="node-wrapper"><div class="node">Administração Direta 4</div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="node-wrapper">
                        <div class="node clickable" data-bs-toggle="collapse" data-bs-target="#vicePrefeitoCollapse" aria-expanded="true" aria-controls="vicePrefeitoCollapse">Vice Prefeito</div>
                        <div class="collapse show" id="vicePrefeitoCollapse">
                            <div class="branch branch-right">
                                <div class="node-wrapper">
                                    <div class="node clickable" data-bs-toggle="collapse" data-bs-target="#admIndiretaCollapse" aria-expanded="true" aria-controls="admIndiretaCollapse">Administração indireta</div>
                                    <div class="collapse show" id="admIndiretaCollapse">
                                        <div class="branch branch-vertical">
                                            <div class="node-wrapper"><div class="node">Administração indireta 1</div></div>
                                            <div class="node-wrapper"><div class="node">Administração indireta 2</div></div>
                                            <div class="node-wrapper"><div class="node">Administração indireta 3</div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcO7r8d+sR2xJ9N+zQ" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
