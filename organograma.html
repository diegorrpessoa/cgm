<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organograma Prefeitura de Juiz de Fora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .org-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      position: relative;
    }

    .org-node {
      padding: 12px 20px;
      border-radius: 12px;
      background-color: #ffffff;
      border: 2px solid #000000;
      font-size: 0.95rem;
      text-align: center;
      min-width: 200px;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .org-node.root {
      font-weight: bold;
      border-color: #d67f0b;
      background-color: #fdf2e3;
    }

    .horizontal-line {
      height: 2px;
      background-color: #000;
      width: 100%;
      position: absolute;
      top: 50%;
      z-index: 0;
    }

    .vertical-line {
      width: 2px;
      background-color: #000;
      height: 30px;
      margin: 0 auto;
    }

    .children-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 60px;
      position: relative;
    }

    .children-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .subitems {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-top: 10px;
      position: relative;
    }

    .subitems::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: #000;
    }

    .sub-node {
      margin: 10px 0 10px 20px;
      position: relative;
    }

    .sub-node::before {
      content: "";
      position: absolute;
      left: -20px;
      top: 50%;
      width: 20px;
      height: 2px;
      background-color: #000;
      transform: translateY(-50%);
    }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <div class="org-container">

      <!-- Prefeitura -->
      <div class="org-node root">Prefeitura de<br>Juiz de Fora</div>
      <div class="vertical-line"></div>

      <!-- Prefeita e Vice -->
      <div class="children-row">
        <div class="children-column">
          <div class="org-node">Prefeita</div>
        </div>
        <div class="children-column">
          <div class="org-node">Vice Prefeito</div>
        </div>
      </div>

      <div class="vertical-line"></div>

      <!-- Administração Direta e Indireta -->
      <div class="children-row">

        <!-- Administração Direta -->
        <div class="children-column">
          <div class="org-node">Administração Direta</div>
          <div class="subitems">
            <div class="org-node sub-node">Administração Direta 1</div>
            <div class="org-node sub-node">Administração Direta 2</div>
            <div class="org-node sub-node">Administração Direta 3</div>
            <div class="org-node sub-node">Administração Direta 4</div>
          </div>
        </div>

        <!-- Administração Indireta -->
        <div class="children-column">
          <div class="org-node">Administração Indireta</div>
          <div class="subitems">
            <div class="org-node sub-node">Administração Indireta 1</div>
            <div class="org-node sub-node">Administração Indireta 2</div>
            <div class="org-node sub-node">Administração Indireta 3</div>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
