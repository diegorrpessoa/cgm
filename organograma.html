<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organograma - Prefeitura de Juiz de Fora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .organograma-container {
      padding: 2rem;
    }
    .nivel {
      margin-bottom: 2rem;
    }
    .nivel h4 {
      margin-bottom: 1rem;
      border-left: 5px solid #0d6efd;
      padding-left: 10px;
      font-weight: 600;
    }
    .card-organograma {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background-color: #ffffff;
      margin: 0.5rem;
      text-align: center;
    }
    .card-organograma a {
      text-decoration: none;
      color: #0d6efd;
      font-weight: 500;
    }
    .card-organograma a:hover {
      text-decoration: underline;
    }
    .card-organograma-title {
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container organograma-container">
    <h2 class="mb-4 text-center">Organograma Institucional - Prefeitura de Juiz de Fora</h2>

    <!-- Nível Estratégico -->
    <div class="nivel">
      <h4>
        <button class="btn btn-link p-0" data-bs-toggle="collapse" data-bs-target="#nivelEstrategico" aria-expanded="true" aria-controls="nivelEstrategico">
          Nível Estratégico
        </button>
      </h4>
      <div class="row collapse show" id="nivelEstrategico">
        <div class="col-md-6">
          <div class="card-organograma bg-light">
            <div class="card-organograma-title text-dark">Gabinete da Prefeita</div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card-organograma bg-light">
            <div class="card-organograma-title text-dark">Gabinete do Vice-Prefeito</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Nível de Apoio / Órgãos Diretos -->
    <div class="nivel">
      <h4>
        <button class="btn btn-link p-0" data-bs-toggle="collapse" data-bs-target="#nivelApoio" aria-expanded="true" aria-controls="nivelApoio">
          Nível de Apoio (Secretarias e Órgãos Diretos)
        </button>
      </h4>
      <div class="row collapse show" id="nivelApoio">
        <div class="col-md-4">
          <div class="card-organograma">
            <a href="/secretaria-de-governo">Secretaria de Governo</a>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card-organograma">
            <a href="/controladoria-geral">Controladoria Geral</a>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card-organograma">
            <a href="/procuradoria-geral">Procuradoria Geral</a>
          </div>
        </div>
        <!-- Adicione mais secretarias conforme necessário -->
      </div>
    </div>

    <!-- Nível Operacional -->
    <div class="nivel">
      <h4>
        <button class="btn btn-link p-0" data-bs-toggle="collapse" data-bs-target="#nivelOperacional" aria-expanded="true" aria-controls="nivelOperacional">
          Nível Operacional
        </button>
      </h4>
      <div class="row collapse show" id="nivelOperacional">
        <div class="col-md-3">
          <div class="card-organograma">
            <a href="/saude">Secretaria de Saúde</a>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card-organograma">
            <a href="/educacao">Secretaria de Educação</a>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card-organograma">
            <a href="/assistencia-social">Secretaria de Assistência Social</a>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card-organograma">
            <a href="/obras">Secretaria de Obras</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Órgãos da Administração Indireta -->
    <div class="nivel">
      <h4>
        <button class="btn btn-link p-0" data-bs-toggle="collapse" data-bs-target="#nivelIndireto" aria-expanded="true" aria-controls="nivelIndireto">
          Administração Indireta
        </button>
      </h4>
      <div class="row collapse show" id="nivelIndireto">
        <div class="col-md-4">
          <div class="card-organograma">
            <a href="/cesama">CESAMA</a>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card-organograma">
            <a href="/empav">EMPAV</a>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card-organograma">
            <a href="/emcasa">EMCASA</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
