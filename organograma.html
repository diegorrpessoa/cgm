<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Organograma - Prefeitura de Juiz de Fora</title>

  <!-- Estilos e scripts do Treant.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/treant-js@1.0/Treant.min.js"></script>

  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }

    .root {
      background-color: #fdf2e3;
      border: 2px solid #d67f0b;
    }

    .prefeita {
      background-color: #fff8d4;
    }

    .vice {
      background-color: #d4ecff;
    }

    .direta {
      background-color: #ffe1cc;
    }

    .indireta {
      background-color: #e8d4ff;
    }

    .Treant > .node {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      box-shadow: 1px 1px 4px rgba(0,0,0,0.2);
    }

    #organograma {
      width: 100%;
      height: auto;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2 class="text-center mt-4 text-primary" style="text-align:center;">Organograma da Prefeitura de Juiz de Fora</h2>
  <div id="organograma"></div>

  <script>
    const chart_config = {
      chart: {
        container: "#organograma",
        rootOrientation: "NORTH",
        node: {
          collapsable: true
        },
        animation: {
          nodeAnimation: "easeOutBounce",
          nodeSpeed: 700,
          connectorsAnimation: "bounce",
          connectorsSpeed: 700
        },
        connectors: {
          type: "step"
        }
      },
      nodeStructure: {
        text: { name: "Prefeitura de Juiz de Fora" },
        HTMLclass: "root",
        children: [
          {
            text: { name: "Prefeita" },
            HTMLclass: "prefeita"
          },
          {
            text: { name: "Vice-Prefeito" },
            HTMLclass: "vice"
          },
          {
            text: { name: "Administração Direta" },
            HTMLclass: "direta",
            collapsed: true,
            children: Array.from({ length: 23 }, (_, i) => ({
              text: { name: `Órgão ${i + 1}` },
              HTMLclass: "direta"
            }))
          },
          {
            text: { name: "Administração Indireta" },
            HTMLclass: "indireta",
            collapsed: true,
            children: Array.from({ length: 8 }, (_, i) => ({
              text: { name: `Entidade ${i + 1}` },
              HTMLclass: "indireta"
            }))
          }
        ]
      }
    };

    new Treant(chart_config);
  </script>
</body>
</html>
