<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Consulta de Emendas – CGM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">

<style>
body { background:#f8f9fa; }
label { font-size:0.75rem; font-weight:600; }
table { font-size:0.75rem; }
.dataTables_filter { display:none; }
#tabela { display:none; }
.select2-container--default .select2-selection--single {
  height:30px;
  font-size:0.75rem;
}
</style>
</head>

<body>
<div class="container-fluid mt-4">

<div class="row g-2 mb-3">
  <div class="col-md-2"><label>Ano *</label><select id="anoFiltro" class="form-select form-select-sm filtro"></select></div>
  <div class="col-md-2"><label>Origem</label><select id="origemFiltro" class="form-select form-select-sm filtro" disabled></select></div>
  <div class="col-md-2"><label>Tipo</label><select id="tipoFiltro" class="form-select form-select-sm filtro" disabled></select></div>
  <div class="col-md-2"><label>Proponente</label><select id="autoriaFiltro" class="form-select form-select-sm filtro" disabled></select></div>
  <div class="col-md-2"><label>Identificação</label><select id="numeroFiltro" class="form-select form-select-sm filtro" disabled></select></div>
  <div class="col-md-2"><label>Objeto</label><select id="objetoFiltro" class="form-select form-select-sm filtro" disabled></select></div>
  <div class="col-md-2"><label>Órgão / Entidade</label><select id="recebedorFiltro" class="form-select form-select-sm filtro" disabled></select></div>
  <div class="col-md-2"><label>CNPJ</label><select id="cnpjFiltro" class="form-select form-select-sm filtro" disabled></select></div>
  <div class="col-md-2"><label>GND</label><select id="naturezaFiltro" class="form-select form-select-sm filtro" disabled></select></div>
  <div class="col-md-2"><label>Função</label><select id="funcaoFiltro" class="form-select form-select-sm filtro" disabled></select></div>
</div>

<div class="table-responsive">
  <table id="tabela" class="table table-striped table-bordered table-sm w-100"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
let dadosOriginais = [];
let tabela;

const campos = {
  ano: "Ano",
  origem: "Origem dos recursos",
  tipo: "Tipo de emenda",
  autoria: "Proponente",
  numero: "Identificação da Emenda",
  funcao: "Função de Governo Função programática",
  natureza: "Grupo de Natureza de Despesa (GND)",
  objeto: "Objeto da Despesa",
  recebedor: "Órgão ou entidade executora ou beneficiária",
  cnpj: "CNPJ do Órgão ou entidade executora ou beneficiária"
};

const ordem = ["ano","origem","tipo","autoria","numero","objeto","recebedor","cnpj","natureza","funcao"];

$(document).ready(function(){

  $('.filtro').select2({ width:'100%', placeholder:'Todos', allowClear:true });

  Papa.parse(
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTkqC4aoZJcALRrSITEjr57Qk8D7-my9cguXVZLbVLZcP0hA3yFWKph6sOSQl30zDO8Z-XmN5TyLJG3/pub?output=csv",
    {
      download:true,
      header:true,
      skipEmptyLines:true,
      complete:function(res){
        dadosOriginais = res.data.filter(r => r[campos.ano]);
        popularFiltro("anoFiltro", campos.ano, dadosOriginais);
      }
    }
  );

  ordem.forEach(f=>{
    $('#' + f + 'Filtro').on('change',function(){
      if(f==="ano" && !this.value){
        $('#tabela').hide();
        tabela?.clear().draw();
        return;
      }
      resetarApos(f);
      atualizarEncadeados(f);
      atualizarTabela();
    });
  });
});

function popularFiltro(id,campo,dados){
  const s = $('#'+id);
  s.empty().append('<option></option>');
  [...new Set(dados.map(d=>d[campo]).filter(Boolean))].sort()
    .forEach(v=>s.append(`<option value="${v}">${v}</option>`));
  s.prop('disabled',false).trigger('change.select2');
}

function resetarApos(f){
  ordem.slice(ordem.indexOf(f)+1).forEach(k=>{
    $('#'+k+'Filtro').val(null).prop('disabled',true).trigger('change.select2');
  });
}

function atualizarEncadeados(f){
  let base = dadosOriginais;
  for(let i=0;i<=ordem.indexOf(f);i++){
    const v = $('#'+ordem[i]+'Filtro').val();
    if(v) base = base.filter(r => r[campos[ordem[i]]] === v);
  }
  ordem.slice(ordem.indexOf(f)+1).forEach(k=>{
    popularFiltro(k+'Filtro', campos[k], base);
  });
}

function aplicarFiltros(){
  return ordem.reduce((acc,f)=>{
    const v = $('#'+f+'Filtro').val();
    return v ? acc.filter(r => r[campos[f]] === v) : acc;
  }, dadosOriginais);
}

function atualizarTabela(){
  if(!$('#anoFiltro').val()) return;
  const dados = aplicarFiltros();
  $('#tabela').show();

  if(tabela){
    tabela.clear().rows.add(dados).draw();
    return;
  }

  tabela = $('#tabela').DataTable({
    data: dados,
    columns: Object.keys(dados[0]).map(c=>({title:c,data:c})),
    pageLength: 10,
    lengthMenu: [[10,25,50,100],[10,25,50,100]],
    paging: true,
    scrollX: true,
    dom: 'Blfrtip',
    buttons: [
      { extend:'csvHtml5', text:'CSV' },
      { extend:'excelHtml5', text:'XLSX' },
      {
        text:'TXT',
        action:function(){
          const txt = Papa.unparse(dados);
          baixarArquivo(txt,'dados.txt','text/plain');
        }
      },
      {
        text:'JSON',
        action:function(){
          baixarArquivo(JSON.stringify(dados,null,2),'dados.json','application/json');
        }
      }
    ],
    language:{ url:"https://cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" }
  });
}

function baixarArquivo(conteudo,nome,tipo){
  const blob = new Blob([conteudo],{type:tipo});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  a.click();
}
</script>
</body>
</html>
