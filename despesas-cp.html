<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel Gerencial de Despesas - Calamidade Pública</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{background:#f8f9fa;}

.dataTables_filter{display:none;}

label{
font-weight:600;
font-size:.72rem!important;
color:#343a40;
margin-bottom:2px;
}

.form-select-sm,table{
font-size:.7rem!important;
}

table.dataTable td,table.dataTable th{
white-space:nowrap;
}

.dataTables_wrapper .dataTables_paginate{
margin-top:.5rem;
display:flex;
justify-content:center;
gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
padding:4px 8px!important;
font-size:.65rem!important;
border-radius:6px!important;
background:#e9ecef!important;
border:1px solid #dee2e6!important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
background:#0d6efd!important;
color:#fff!important;
font-weight:bold!important;
}

.export-group .btn{
font-size:.7rem;
padding:4px 8px;
}

#indicadorAtualizacao{
font-size:.65rem;
color:#6c757d;
text-align:right;
margin-bottom:8px;
}

.spinner-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding-top:60px;
z-index:9999;
background:rgba(255,255,255,.9);
}

.spinner-border{width:2rem;height:2rem;}
.spinner-text{font-size:.9rem;margin-top:5px;}

.totalizadores{
font-size:.7rem;
background:#fff;
padding:5px 10px;
border:1px solid #dee2e6;
border-radius:4px;
}

#lengthSelectorContainer{
font-size:.7rem;
display:flex;
justify-content:flex-end;
align-items:center;
gap:6px;
margin-bottom:6px;
}

#lengthSelector{width:80px;}

</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
<div class="spinner-border text-primary"></div>
<div class="spinner-text">Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
Dados atualizados automaticamente em...
</div>

<div class="row gx-2 gy-2 mb-3">

<div class="col-sm-3">
<label>Unidade Gestora (UG) *</label>
<select id="ugFiltro" class="form-select form-select-sm"></select>
</div>

<div class="col-sm-3">
<label>Fornecedor</label>
<select id="fornecedorFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-3">
<label>CPF/CNPJ fornecedor</label>
<select id="cpfFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-3">
<label>Objeto</label>
<select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
</div>

</div>

<div class="totalizadores mb-2" id="resumoValores" style="display:none;">
<span id="totalPago">Valor pago: R$ 0,00</span>
</div>

<div class="d-flex justify-content-between mb-2">

<button id="btnLimpar" class="btn btn-outline-primary btn-sm">
Limpar filtros
</button>

<div class="export-group btn-group">
<button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
<button id="btnXlsx" class="btn btn-outline-secondary btn-sm">XLSX</button>
<button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
<button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
</div>

</div>

<div id="lengthSelectorContainer">
<label>Registros por página:</label>
<select id="lengthSelector" class="form-select form-select-sm">
<option value="10">10</option>
<option value="25">25</option>
<option value="50">50</option>
<option value="100">100</option>
</select>
</div>

<div class="table-responsive">
<table id="tabela" class="table table-bordered table-striped table-sm w-100" style="display:none;"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela;
let dadosOriginais=[];

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vS3-CtmdGkiL5mdK7T3neAkVW60SUcbfrO-lVMWzEYo5_wZ6RtYGaquGFqVZvX6gmseDAMkzYf2HwUQ/pub?output=csv";

const campos={
ug:"Unidade Gestora (UG)",
fornecedor:"Fornecedor",
cpf:"CPF/CNPJ fornecedor",
objeto:"Objeto",
valor:"Valor pago"
};

function parseMoeda(valor){

if(!valor)return 0;

return parseFloat(
valor.toString()
.replace(/[^\d,.-]/g,"")
.replace(/\./g,"")
.replace(",",".")
)||0;

}

function atualizarResumo(dados){

if(!dados.length){
$("#resumoValores").hide();
return;
}

let total=0;

dados.forEach(r=>{
total+=parseMoeda(r[campos.valor]);
});

$("#totalPago").text(
"Valor pago: "+
total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
);

$("#resumoValores").show();

}

Papa.parse(urlCSV,{
download:true,
header:true,
complete:r=>{

dadosOriginais=r.data;

/* DATA ATUALIZAÇÃO */

let linhaAtualizacao=dadosOriginais.find(x=>x["Atualizacao"]);

if(linhaAtualizacao){
$("#indicadorAtualizacao").html(
`Dados atualizados automaticamente em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
);
}

dadosOriginais=dadosOriginais.map(r=>{
let copia={...r};
delete copia["Atualizacao"];
return copia;
});

carregarUG();

$("#spinnerCsv").fadeOut(200);

}
});

function carregarUG(){

let s=$("#ugFiltro");

s.append('<option value="">Selecione...</option>');
s.append('<option value="TODOS">Todos</option>');

[...new Set(dadosOriginais.map(r=>r[campos.ug]))]
.sort()
.forEach(v=>s.append(`<option value="${v}">${v}</option>`));

}

function aplicarFiltros(){

let base=[...dadosOriginais];

let ug=$("#ugFiltro").val();

if(ug && ug!=="TODOS"){
base=base.filter(r=>r[campos.ug]===ug);
}

let fornecedor=$("#fornecedorFiltro").val();
let cpf=$("#cpfFiltro").val();
let objeto=$("#objetoFiltro").val();

if(fornecedor){
base=base.filter(r=>r[campos.fornecedor]===fornecedor);
}

if(cpf){
base=base.filter(r=>r[campos.cpf]===cpf);
}

if(objeto){
base=base.filter(r=>r[campos.objeto]===objeto);
}

return base;

}

function atualizarFiltros(){

["fornecedor","cpf","objeto"].forEach(f=>{

let seletor=$("#"+f+"Filtro");
let atual=seletor.val();

let base=aplicarFiltros();

let valores=[...new Set(
base.map(r=>r[campos[f]]).filter(Boolean)
)].sort();

seletor.empty();
seletor.append('<option value="">Selecione...</option>');

valores.forEach(v=>{
seletor.append(`<option value="${v}">${v}</option>`);
});

if(valores.includes(atual)){
seletor.val(atual);
}

});

}

function renderTabela(dados){

if(!dados.length){
$("#tabela").hide();
return;
}

$("#tabela").show();

const colunas=Object.keys(dados[0]).slice(0,19);

let dadosFiltrados=dados.map(r=>{
let obj={};
colunas.forEach(c=>{
obj[c]=r[c];
});
return obj;
});

if(tabela){
tabela.clear().rows.add(dadosFiltrados).draw();
return;
}

tabela=$("#tabela").DataTable({

data:dadosFiltrados,

columns:colunas.map(c=>({title:c,data:c})),

scrollX:true,
scrollY:"55vh",
scrollCollapse:true,

paging:true,
pageLength:10,
lengthChange:false,
info:true,

language:{
url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
}

});

$("#lengthSelector").on("change",function(){
tabela.page.len(this.value).draw();
});

}

function aplicarTudo(){

let dados=aplicarFiltros();

atualizarFiltros();

atualizarResumo(dados);

renderTabela(dados);

}

/* EVENTOS */

$("#ugFiltro").on("change",function(){

$("#fornecedorFiltro,#cpfFiltro,#objetoFiltro").prop("disabled",false);

aplicarTudo();

});

$("#fornecedorFiltro,#cpfFiltro,#objetoFiltro").on("change",aplicarTudo);

$("#btnLimpar").on("click",()=>location.reload());

</script>

</body>
</html>
