<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Gerencial de Despesas - Calamidade Pública</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">

<style>

body{background:#f8f9fa;}

label{
font-weight:600;
font-size:.72rem!important;
margin-bottom:2px;
}

.form-select-sm,table{
font-size:.7rem!important;
}

table.dataTable td,table.dataTable th{
white-space:nowrap;
}

.dataTables_filter{display:none;}

.spinner-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#fff;
z-index:9999;
}

#indicadorAtualizacao{
font-size:.65rem;
text-align:right;
color:#6c757d;
margin-bottom:8px;
}

</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
<div class="spinner-border text-primary"></div>
<div>Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao"></div>

<div class="row g-2 mb-3">

<div class="col-md-3">
<label>Unidade Gestora</label>
<select id="ugFiltro" class="form-select form-select-sm"></select>
</div>

<div class="col-md-3">
<label>Fornecedor</label>
<select id="fornecedorFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-md-3">
<label>CPF/CNPJ fornecedor</label>
<select id="cpfFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-md-3">
<label>Objeto</label>
<select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
</div>

</div>

<div class="mb-2">
<button id="btnLimpar" class="btn btn-outline-primary btn-sm">Limpar filtros</button>
</div>

<div class="table-responsive">
<table id="tabela" class="table table-bordered table-striped table-sm w-100"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

let tabela;
let dadosOriginais=[];

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vS3-CtmdGkiL5mdK7T3neAkVW60SUcbfrO-lVMWzEYo5_wZ6RtYGaquGFqVZvX6gmseDAMkzYf2HwUQ/pub?output=csv";

const campos={
ug:"Unidade Gestora (UG)",
fornecedor:"Fornecedor",
cpf:"CPF/CNPJ fornecedor",
objeto:"Objeto"
};

/* ---------- CARREGAR CSV ---------- */

Papa.parse(urlCSV,{
download:true,
header:true,
complete:r=>{

dadosOriginais=r.data;

/* DATA ATUALIZAÇÃO */

let linhaAtualizacao=dadosOriginais.find(x=>x["Atualizacao"]);

if(linhaAtualizacao){

$("#indicadorAtualizacao").html(
`Dados atualizados automaticamente em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
);

}

/* REMOVER COLUNA T */

dadosOriginais=dadosOriginais.map(r=>{
let copia={...r};
delete copia["Atualizacao"];
return copia;
});

/* CARREGAR UG */

carregarUG();

$("#spinnerCsv").fadeOut();

}
});

/* ---------- FILTRO BASE ---------- */

function obterBase(excluir=null){

let base=[...dadosOriginais];

let ug=$("#ugFiltro").val();
let fornecedor=$("#fornecedorFiltro").val();
let cpf=$("#cpfFiltro").val();
let objeto=$("#objetoFiltro").val();

if(excluir!=="ug"){
if(ug && ug!=="TODOS"){
base=base.filter(r=>r[campos.ug]===ug);
}
}

if(excluir!=="fornecedor"){
if(fornecedor){
base=base.filter(r=>r[campos.fornecedor]===fornecedor);
}
}

if(excluir!=="cpf"){
if(cpf){
base=base.filter(r=>r[campos.cpf]===cpf);
}
}

if(excluir!=="objeto"){
if(objeto){
base=base.filter(r=>r[campos.objeto]===objeto);
}
}

return base;

}

/* ---------- CARREGAR UG ---------- */

function carregarUG(){

let s=$("#ugFiltro");

s.append('<option value="">Selecione...</option>');
s.append('<option value="TODOS">Todos</option>');

[...new Set(dadosOriginais.map(r=>r[campos.ug]))]
.filter(Boolean)
.sort()
.forEach(v=>{
s.append(`<option value="${v}">${v}</option>`);
});

}

/* ---------- ATUALIZAR FILTRO ---------- */

function atualizarFiltro(nome){

let seletor=$("#"+nome+"Filtro");

let base=obterBase(nome);

let valores=[...new Set(
base.map(r=>r[campos[nome]]).filter(Boolean)
)].sort();

let atual=seletor.val();

seletor.empty();
seletor.append('<option value="">Selecione...</option>');

valores.forEach(v=>{
seletor.append(`<option value="${v}">${v}</option>`);
});

if(valores.includes(atual)){
seletor.val(atual);
}

}

/* ---------- ATUALIZAR TODOS ---------- */

function atualizarFiltros(){

atualizarFiltro("fornecedor");
atualizarFiltro("cpf");
atualizarFiltro("objeto");

}

/* ---------- RENDER TABELA ---------- */

function renderTabela(dados){

if(!dados.length){

if(tabela){
tabela.clear().draw();
}

return;
}

const colunas=Object.keys(dados[0]).slice(0,19);

let base=dados.map(r=>{

let obj={};

colunas.forEach(c=>{
obj[c]=r[c];
});

return obj;

});

if(!tabela){

tabela=$("#tabela").DataTable({

data:base,

columns:colunas.map(c=>({title:c,data:c})),

scrollX:true,
scrollY:"60vh",
scrollCollapse:true,

paging:true,
pageLength:10,

language:{
url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
}

});

}else{

tabela.clear().rows.add(base).draw();

}

}

/* ---------- APLICAR FILTROS ---------- */

function aplicar(){

let dados=obterBase();

atualizarFiltros();

renderTabela(dados);

}

/* ---------- EVENTOS ---------- */

$("#ugFiltro").on("change",function(){

$("#fornecedorFiltro,#cpfFiltro,#objetoFiltro").prop("disabled",false);

aplicar();

});

$("#fornecedorFiltro,#cpfFiltro,#objetoFiltro").on("change",aplicar);

$("#btnLimpar").on("click",()=>location.reload());

</script>

</body>
</html>
