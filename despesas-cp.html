<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel Gerencial de Despesas - Calamidade Pública</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{background:#f8f9fa;}
.dataTables_filter{display:none;}

label{
font-weight:600;
font-size:.72rem!important;
color:#343a40;
margin-bottom:2px;
}

.form-select-sm,table{
font-size:.7rem!important;
}

table.dataTable td,table.dataTable th{
white-space:nowrap;
}

.totalizadores{
font-size:.7rem;
background:#fff;
padding:5px 10px;
border:1px solid #dee2e6;
border-radius:4px;
}

#indicadorAtualizacao{
font-size:.65rem;
color:#6c757d;
text-align:right;
margin-bottom:8px;
}

.spinner-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding-top:60px;
z-index:9999;
background:rgba(255,255,255,.9);
}

</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
<div class="spinner-border text-primary"></div>
<div class="spinner-text">Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
Dados atualizados automaticamente em...
</div>

<div class="row gx-2 gy-2 mb-3">

<div class="col-sm-3">
<label>Unidade Gestora (UG) *</label>
<select id="ugFiltro" class="form-select form-select-sm"></select>
</div>

<div class="col-sm-3">
<label>Fornecedor</label>
<select id="fornecedorFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-2">
<label>CNPJ/CPF Fornecedor</label>
<select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-4">
<label>Objeto</label>
<select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
</div>

</div>

<div class="totalizadores mb-2" id="resumoValores" style="display:none;">
<span id="totalPago">Valor pago: R$ 0,00</span>
</div>

<div class="table-responsive">
<table id="tabela" class="table table-bordered table-striped table-sm w-100" style="display:none;"></table>
</div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

let dadosOriginais=[];

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vS3-CtmdGkiL5mdK7T3neAkVW60SUcbfrO-lVMWzEYo5_wZ6RtYGaquGFqVZvX6gmseDAMkzYf2HwUQ/pub?output=csv";

const campos={
ug:"Unidade Gestora (UG)",
fornecedor:"Fornecedor",
cnpj:"CNPJ/CPF Fornecedor",
objeto:"Objeto - Bens e serviços",
valor:"Valor  Pago (R$)"
};

const ordem=Object.keys(campos);

function parseMoeda(valor){

if(!valor)return 0;

return parseFloat(
valor.toString()
.replace(/[^\d,.-]/g,"")
.replace(/\./g,"")
.replace(",",".")
)||0;

}

function atualizarResumo(dados){

if(!dados.length){
$("#resumoValores").hide();
return;
}

let total=0;

dados.forEach(r=>{
total+=parseMoeda(r[campos.valor]);
});

$("#totalPago").text(
"Valor pago: "+
total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
);

$("#resumoValores").show();

}

Papa.parse(urlCSV,{
download:true,
header:true,
complete:r=>{

dadosOriginais=r.data;

let linhaAtualizacao=dadosOriginais.find(x=>x["Atualizacao"]);

if(linhaAtualizacao){

$("#indicadorAtualizacao").html(
`Dados atualizados automaticamente em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
);

}

dadosOriginais=dadosOriginais.map(r=>{
let copia={...r};
delete copia["Atualizacao"];
return copia;
});

dadosOriginais=dadosOriginais.filter(d=>d[campos.ug]);

atualizarResumo(dadosOriginais);

$("#spinnerCsv").fadeOut(200);

}
});

function aplicarFiltroAtual(){

let ug=$("#ugFiltro").val();

let base=[...dadosOriginais];

if(ug){
base=base.filter(r=>r[campos.ug]===ug);
}

ordem.slice(1).forEach(f=>{

let v=$("#"+f+"Filtro").val();

if(v){
base=base.filter(r=>r[campos[f]]===v);
}

});

return base;

}

</script>

</body>
</html>
