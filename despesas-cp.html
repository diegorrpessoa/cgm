<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Gerencial</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">

<style>

body{background:#f8f9fa}

.dataTables_filter{display:none}

label{
font-weight:600;
font-size:.72rem!important;
margin-bottom:2px
}

.form-select-sm,table{
font-size:.7rem!important
}

#indicadorAtualizacao{
font-size:.65rem;
color:#6c757d;
text-align:right;
margin-bottom:8px
}

.spinner-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,.9);
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding-top:60px;
z-index:9999
}

.totalizadores{
font-size:.7rem;
background:#fff;
padding:5px 10px;
border:1px solid #dee2e6;
border-radius:4px
}

</style>

</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
<div class="spinner-border text-primary"></div>
<div style="margin-top:5px;font-size:.9rem">Carregando base de dados...</div>
</div>

<div class="container-fluid mt-3">

<div id="indicadorAtualizacao">
Dados atualizados automaticamente em...
</div>

<div class="row gx-2 gy-2 mb-3">

<div class="col-sm-3">
<label>Unidade Gestora</label>
<select id="ugFiltro" class="form-select form-select-sm"></select>
</div>

<div class="col-sm-3">
<label>Fornecedor</label>
<select id="fornecedorFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-2">
<label>CNPJ</label>
<select id="cnpjFiltro" class="form-select form-select-sm" disabled></select>
</div>

<div class="col-sm-4">
<label>Objeto</label>
<select id="objetoFiltro" class="form-select form-select-sm" disabled></select>
</div>

</div>

<div id="resumoValores" class="totalizadores mb-2" style="display:none">
<span id="totalPago">Valor pago: R$ 0,00</span>
</div>

<div class="table-responsive">

<table id="tabela" class="table table-bordered table-striped table-sm w-100" style="display:none"></table>

</div>

</div>


<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

let tabela
let dadosOriginais=[]

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vR9WRiB3lzcwypd1oZpASlEJFyjQ97xROrMk0tX6KJu0pONpCIqnomr-dwZZ25DmGFTT7lv0OvjNG2H/pub?output=csv"

const campos={
ug:"Unidade Gestora",
fornecedor:"Fornecedor",
cnpj:"CNPJ",
objeto:"Objeto"
}

function parseMoeda(v){

if(!v)return 0

return parseFloat(
v.toString()
.replace(/[^\d,.-]/g,"")
.replace(/\./g,"")
.replace(",",".")
)||0

}

function detectarLink(valor){

if(!valor)return valor

let texto=valor.toString()

let regex=/(https?:\/\/[^\s]+)/g

if(regex.test(texto)){

let url=texto.match(regex)[0]

return `<a href="${url}" target="_blank">${texto}</a>`

}

return texto

}

function atualizarResumo(dados){

if(!dados.length){

$("#resumoValores").hide()

return

}

let total=0

dados.forEach(r=>{

let valores=Object.values(r)

let valor=valores[15]

total+=parseMoeda(valor)

})

$("#totalPago").text(
"Valor pago: "+
total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
)

$("#resumoValores").show()

}

function formatarDataHora(){

let agora=new Date()

let data=agora.toLocaleDateString("pt-BR")

let hora=agora.toLocaleTimeString("pt-BR",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
})

return data+" às "+hora

}

Papa.parse(urlCSV,{
download:true,
header:true,
complete:r=>{

dadosOriginais=r.data.filter(d=>d[campos.ug])

/* SISTEMA DE DATA DE ATUALIZAÇÃO */

if(r.data.length>0){

let primeiraLinha=r.data[0]

let dataAtualizacao=primeiraLinha["Data Atualização"]

if(dataAtualizacao && dataAtualizacao!==""){

$("#indicadorAtualizacao").text(
"Dados atualizados automaticamente em "+dataAtualizacao
)

}else{

$("#indicadorAtualizacao").text(
"Dados atualizados automaticamente em "+formatarDataHora()
)

}

}

/* carregar unidades */

let ug=$("#ugFiltro")

ug.append('<option value="">Selecione</option>')
ug.append('<option value="todos">Todos</option>')

let lista=[...new Set(dadosOriginais.map(r=>r[campos.ug]))]

lista.sort().forEach(v=>{
ug.append(`<option value="${v}">${v}</option>`)
})

$("#spinnerCsv").fadeOut(200)

}
})

function aplicarFiltro(){

let ug=$("#ugFiltro").val()

if(!ug)return[]

let base=ug==="todos"
?[...dadosOriginais]
:dadosOriginais.filter(r=>r[campos.ug]===ug)

return base

}

function renderTabela(dados){

if(!dados.length){

$("#tabela").hide()

return

}

$("#tabela").show()

let colunas=Object.keys(dados[0]).slice(0,19)

let dadosFiltrados=dados.map(r=>{

let obj={}

colunas.forEach(c=>obj[c]=r[c])

return obj

})

if(tabela){

tabela.clear().rows.add(dadosFiltrados).draw()

return

}

tabela=$("#tabela").DataTable({

data:dadosFiltrados,

columns:colunas.map(c=>({

title:c,
data:c,

render:function(data,type){

if(type==="display"){
return detectarLink(data)
}

return data

}

})),

scrollX:true,
scrollY:"55vh",
scrollCollapse:true,
paging:true,
pageLength:10,

language:{
url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
}

})

}

function aplicarTudo(){

let dados=aplicarFiltro()

atualizarResumo(dados)

renderTabela(dados)

}

$("#ugFiltro").on("change",function(){

aplicarTudo()

})

</script>

</body>
</html>
