<script>

let tabela;
let dadosOriginais = [];
let indiceColunaP = 15;

const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS3-CtmdGkiL5mdK7T3neAkVW60SUcbfrO-lVMWzEYo5_wZ6RtYGaquGFqVZvX6gmseDAMkzYf2HwUQ/pub?output=csv";

const campos = {
ug: "Unidade Gestora (UG)",
fornecedor: "Fornecedor",
cnpj: "CNPJ/CPF Fornecedor",
objeto: "Objeto - Bens e serviços"
};

const ordem = Object.keys(campos);


function detectarLink(valor){

if(!valor) return valor;

let v = valor.toString();

let regexURL = /(https?:\/\/[^\s]+)/g;

if(v.startsWith("=HYPERLINK(")){

let partes = v.match(/"(.*?)"/g);

if(partes && partes.length >= 2){

let url = partes[0].replace(/"/g,"");
let texto = partes[1].replace(/"/g,"");

return `<a href="${url}" target="_blank">${texto}</a>`;

}

}

if(regexURL.test(v)){

let url = v.match(regexURL)[0];

return `<a href="${url}" target="_blank">${v}</a>`;

}

return v;

}

function parseMoeda(valor){

if(!valor) return 0;

return parseFloat(
valor.toString()
.replace(/[^\d,.-]/g,"")
.replace(/\./g,"")
.replace(",",".")
) || 0;

}

function atualizarResumo(dados){

if(!dados.length){
$("#resumoValores").hide();
return;
}

let total = 0;

dados.forEach(r=>{
let valores = Object.values(r);
let valor = valores[indiceColunaP];
total += parseMoeda(valor);
});

$("#totalPago").text(
"Valor pago: " +
total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
);

$("#resumoValores").show();

}

Papa.parse(urlCSV,{
download:true,
header:true,
complete:r=>{

dadosOriginais = r.data.filter(d=>d[campos.ug]);

carregarUG();

$("#spinnerCsv").fadeOut(200);

}
});

function carregarUG(){

let s = $("#ugFiltro");

s.append('<option value="">Selecione...</option>');
s.append('<option value="todos">Todos</option>');

[...new Set(dadosOriginais.map(r=>r[campos.ug]))]
.sort()
.forEach(v=>{
s.append(`<option value="${v}">${v}</option>`);
});

}

function aplicarFiltroAtual(){

let ug = $("#ugFiltro").val();

if(!ug) return [];

let base = (ug === "todos")
? [...dadosOriginais]
: dadosOriginais.filter(r=>r[campos.ug] === ug);

ordem.slice(1).forEach(f=>{

let v = $("#"+f+"Filtro").val();

if(v){
base = base.filter(r=>r[campos[f]] === v);
}

});

return base;

}

function aplicarFiltroIgnorando(filtro){

let ug = $("#ugFiltro").val();

if(!ug) return [];

let base = dadosOriginais;

if(ug !== "todos"){
base = base.filter(r=>r[campos.ug] === ug);
}

ordem.slice(1).forEach(f=>{

if(f === filtro) return;

let v = $("#"+f+"Filtro").val();

if(v){
base = base.filter(r=>r[campos[f]] === v);
}

});

return base;

}

function atualizarFiltros(){

ordem.slice(1).forEach(f=>{

let seletor = $("#"+f+"Filtro");
let valorAtual = seletor.val();

let base = aplicarFiltroIgnorando(f);

let valores = [
...new Set(base.map(r=>r[campos[f]]).filter(Boolean))
].sort();

seletor.empty();
seletor.append('<option value="">Selecione...</option>');

valores.forEach(v=>{
seletor.append(`<option value="${v}">${v}</option>`);
});

seletor.prop("disabled", valores.length === 0);

if(valores.includes(valorAtual)){
seletor.val(valorAtual);
}

});

}

function renderTabela(dados){

if(!dados.length){
$("#tabela").hide();
return;
}

$("#tabela").show();

const colunasPermitidas = Object.keys(dados[0]).slice(0,19);

let dadosFiltrados = dados.map(r=>{
let obj = {};
colunasPermitidas.forEach(c=>{
obj[c] = r[c];
});
return obj;
});

if(tabela){

tabela.clear()
.rows.add(dadosFiltrados)
.draw();

return;

}

tabela = $("#tabela").DataTable({

data:dadosFiltrados,

columns:colunasPermitidas.map(c=>({
title:c,
data:c,
render:function(data){
return detectarLink(data);
}
})),

scrollX:true,
scrollY:"55vh",
scrollCollapse:true,

paging:true,
pageLength:10,
lengthChange:false,

language:{
url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
}

});

$("#lengthSelector").on("change",function(){
tabela.page.len(this.value).draw();
});

}

function aplicarTudo(){

let dados = aplicarFiltroAtual();

atualizarFiltros();

atualizarResumo(dados);

renderTabela(dados);

}

$("#ugFiltro").on("change",function(){

ordem.slice(1).forEach(f=>{
$("#"+f+"Filtro").val("").prop("disabled",false);
});

aplicarTudo();

});

ordem.slice(1).forEach(f=>{
$("#"+f+"Filtro").on("change", aplicarTudo);
});

$("#btnLimpar").on("click",()=>location.reload());

</script>
