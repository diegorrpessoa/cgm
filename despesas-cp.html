<script>

let tabela;
let dadosOriginais=[];
let indiceColunaP=15;
let colunasPermitidas=[];

const urlCSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vS3-CtmdGkiL5mdK7T3neAkVW60SUcbfrO-lVMWzEYo5_wZ6RtYGaquGFqVZvX6gmseDAMkzYf2HwUQ/pub?output=csv";

const campos={
ug:"Unidade Gestora (UG)",
fornecedor:"Fornecedor",
cnpj:"CNPJ/CPF Fornecedor",
objeto:"Objeto - Bens e serviços"
};

const ordem=Object.keys(campos);

function parseMoeda(valor){
if(!valor) return 0;
return parseFloat(
valor.toString()
.replace(/[^\d,.-]/g,"")
.replace(/\./g,"")
.replace(",",".")
)||0;
}

/* CARREGAMENTO CSV */
Papa.parse(urlCSV,{
download:true,
header:true,

complete:r=>{

dadosOriginais=r.data.filter(d=>d[campos.ug]);

let linhaAtualizacao=dadosOriginais.find(x=>x["Atualizacao"]);

if(linhaAtualizacao){
$("#indicadorAtualizacao").html(
`Dados atualizados automaticamente em: <b>${linhaAtualizacao["Atualizacao"]}</b>`
);
}

/* remove coluna Atualizacao + pré-calcula valor pago */

dadosOriginais=dadosOriginais.map(r=>{

let copia={...r};

copia._valorPago=parseMoeda(
Object.values(copia)[indiceColunaP]
);

delete copia["Atualizacao"];

return copia;

});

/* cache colunas permitidas */

colunasPermitidas=Object.keys(dadosOriginais[0]).slice(0,19);

carregarUG();

$("#spinnerCsv").fadeOut(200);

}

});

function carregarUG(){

let s=$("#ugFiltro");

s.append('<option value="">Selecione...</option>');
s.append('<option value="todos">Todos</option>');

[...new Set(dadosOriginais.map(r=>r[campos.ug]))]
.sort()
.forEach(v=>{
s.append(`<option value="${v}">${v}</option>`);
});

}

function aplicarFiltroAtual(){

let ug=$("#ugFiltro").val();
if(!ug) return [];

let base=(ug==="todos")
?dadosOriginais
:dadosOriginais.filter(r=>r[campos.ug]===ug);

ordem.slice(1).forEach(f=>{
let v=$("#"+f+"Filtro").val();
if(v){
base=base.filter(r=>r[campos[f]]===v);
}
});

return base;

}

function aplicarFiltroIgnorando(filtro){

let ug=$("#ugFiltro").val();
if(!ug) return [];

let base=(ug==="todos")
?dadosOriginais
:dadosOriginais.filter(r=>r[campos.ug]===ug);

ordem.slice(1).forEach(f=>{

if(f===filtro) return;

let v=$("#"+f+"Filtro").val();

if(v){
base=base.filter(r=>r[campos[f]]===v);
}

});

return base;

}

function atualizarFiltros(){

ordem.slice(1).forEach(f=>{

let seletor=$("#"+f+"Filtro");
let valorAtual=seletor.val();

let base=aplicarFiltroIgnorando(f);

let valores=[...new Set(
base.map(r=>r[campos[f]]).filter(Boolean)
)].sort();

seletor.empty();
seletor.append('<option value="">Selecione...</option>');

valores.forEach(v=>{
seletor.append(`<option value="${v}">${v}</option>`);
});

seletor.prop("disabled",valores.length===0);

if(valores.includes(valorAtual)){
seletor.val(valorAtual);
}

});

}

function atualizarResumo(dados){

if(!dados.length){
$("#resumoValores").hide();
return;
}

let total=0;

dados.forEach(r=>{
total+=r._valorPago;
});

$("#totalPago").text(
"Valor pago: "+
total.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})
);

$("#resumoValores").show();

}

function renderTabela(dados){

if(!dados.length){
$("#tabela").hide();
return;
}

$("#tabela").show();

if(tabela){

tabela.clear().rows.add(dados).draw();
return;

}

tabela=$("#tabela").DataTable({

data:dados,

columns:colunasPermitidas.map(c=>({
title:c,
data:c
})),

scrollX:true,
scrollY:"55vh",
scrollCollapse:true,

paging:true,
pageLength:10,
lengthChange:false,

deferRender:true,
processing:true,

language:{
url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
}

});

$("#lengthSelector").on("change",function(){
tabela.page.len(this.value).draw();
});

}

function aplicarTudo(){

let dados=aplicarFiltroAtual();

atualizarFiltros();
atualizarResumo(dados);
renderTabela(dados);

}

$("#ugFiltro").on("change",function(){

ordem.slice(1).forEach(f=>{
$("#"+f+"Filtro").val("").prop("disabled",false);
});

aplicarTudo();

});

ordem.slice(1).forEach(f=>{
$("#"+f+"Filtro").on("change",aplicarTudo);
});

$("#btnLimpar").on("click",()=>location.reload());

function obterDadosTabela(){
if(!tabela) return [];
return tabela.rows({search:'applied'}).data().toArray();
}

function downloadArquivo(nome,conteudo,tipo){

let blob=new Blob([conteudo],{type:tipo});

let link=document.createElement("a");

link.href=URL.createObjectURL(blob);
link.download=nome;

document.body.appendChild(link);
link.click();
document.body.removeChild(link);

}

$("#btnCsv").click(()=>{
let dados=obterDadosTabela();
let csv=Papa.unparse(dados);
downloadArquivo("despesas.csv",csv,"text/csv");
});

$("#btnTxt").click(()=>{
let dados=obterDadosTabela();
let txt=Papa.unparse(dados,{delimiter:";"});
downloadArquivo("despesas.txt",txt,"text/plain");
});

$("#btnJson").click(()=>{
let dados=obterDadosTabela();
let json=JSON.stringify(dados,null,2);
downloadArquivo("despesas.json",json,"application/json");
});

$("#btnXlsx").click(()=>{

let dados=obterDadosTabela();

let ws=XLSX.utils.json_to_sheet(dados);

let total=0;

dados.forEach(r=>{
total+=r._valorPago;
});

let linhaTotal=new Array(colunasPermitidas.length).fill("");

linhaTotal[0]="TOTAL VALOR PAGO";
linhaTotal[indiceColunaP]=total;

XLSX.utils.sheet_add_aoa(ws,[linhaTotal],{origin:-1});

let wb=XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,"Despesas");

XLSX.writeFile(wb,"despesas.xlsx");

});

</script>
