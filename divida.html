<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Dívida Ativa</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{
  background:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
}

.form-select-sm,
table{
  font-size:.70rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

.spinner-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  background:rgba(255,255,255,.92);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  margin-top:5px;
  font-size:.9rem;
}

.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  font-weight:600;
}

.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

#lengthSelectorContainer{
  font-size:.7rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  margin-bottom:6px;
}

#lengthSelector{
  width:80px;
  font-size:.7rem;
}

.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background:#e9ecef !important;
  border:1px solid #dee2e6 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

</style>
</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
  <div class="spinner-border text-primary"></div>
  <div class="spinner-text">
    Carregando base de dados...
  </div>
</div>

<div class="container-fluid mt-3">

  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Exercício (Ano) *</label>
      <select id="anoFiltro" class="form-select form-select-sm"></select>
    </div>

    <div class="col-sm-5">
      <label>Nome do Inscrito</label>
      <select id="inscritoFiltro" class="form-select form-select-sm" disabled></select>
    </div>

    <div class="col-sm-3">
      <label>Valor</label>
      <select id="valorFiltro" class="form-select form-select-sm" disabled></select>
    </div>

  </div>

  <!-- TOTAL -->
  <div class="totalizadores mb-2" id="resumoValores" style="display:none;">
    <span id="totalValor">Total: R$ 0,00</span>
  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button id="btnLimpar" class="btn btn-outline-primary btn-sm">
      Limpar Filtros
    </button>

    <div class="export-group btn-group">
      <button id="btnCsv" class="btn btn-outline-secondary btn-sm">CSV</button>
      <button id="btnXlsx" class="btn btn-outline-secondary btn-sm">XLSX</button>
      <button id="btnTxt" class="btn btn-outline-secondary btn-sm">TXT</button>
      <button id="btnJson" class="btn btn-outline-secondary btn-sm">JSON</button>
    </div>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label>Registros por página:</label>

    <select id="lengthSelector" class="form-select form-select-sm">

      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>

    </select>

  </div>

  <!-- TABELA -->
  <div class="table-responsive">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm w-100"
      style="display:none;"
    ></table>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

const urlCSV =
"https://docs.google.com/spreadsheets/d/10C3yDnARmQs6Ydh39PK1XGNW3cFylcWLL9rd6_2WyIs/export?format=csv&gid=1659253784";

const campos = {

  inscrito:"NOME DO INSCRITO",
  ano:"EXERCÍCIO (ANO)",
  valor:"VALOR"

};

let dadosOriginais = [];
let cacheAno = {};

const formatadorMoeda = new Intl.NumberFormat(
  "pt-BR",
  {
    style:"currency",
    currency:"BRL"
  }
);

/* =========================================
   LIMPA ASPAS E ESPAÇOS
========================================= */

function limparValor(valor){

  if(!valor) return "";

  return valor
    .toString()
    .replace(/^"+|"+$/g,"")
    .trim();

}

/* =========================================
   CONVERTE MOEDA
========================================= */

function parseMoeda(valor){

  if(!valor) return 0;

  valor = limparValor(valor);

  return parseFloat(

    valor
      .replace(/[^\d,-]/g,"")
      .replace(/\./g,"")
      .replace(",", ".")

  ) || 0;

}

/* =========================================
   CARREGA CSV
========================================= */

Papa.parse(urlCSV,{

  download:true,
  header:true,
  skipEmptyLines:true,
  fastMode:true,

  complete:(resultado)=>{

    if(
      !resultado ||
      !resultado.data ||
      !resultado.data.length
    ){

      alert("Base de dados vazia.");
      return;

    }

    const primeiraLinha =
      resultado.data[0] || {};

    /* PEGA COLUNA E */
    const atualizacao =
      limparValor(

        primeiraLinha["E"] ||
        primeiraLinha["E2"] ||
        Object.values(primeiraLinha)[4] ||
        ""

      );

    if(atualizacao){

      $("#indicadorAtualizacao").html(
        `Dados atualizados em: <b>${atualizacao}</b>`
      );

    }

    dadosOriginais = resultado.data

      .filter(r=>r[campos.ano])

      .map(r=>({

        "NOME DO INSCRITO":
          limparValor(
            r[campos.inscrito]
          ),

        "EXERCÍCIO (ANO)":
          limparValor(
            r[campos.ano]
          ),

        "VALOR":
          limparValor(
            r[campos.valor]
          )

      }));

    montarCache();

    carregarFiltroAno();

    $("#spinnerCsv").fadeOut(200);

  },

  error:()=>{

    $("#spinnerCsv").hide();

    alert(
      "Não foi possível carregar a base de dados."
    );

  }

});

/* =========================================
   CACHE
========================================= */

function montarCache(){

  cacheAno = {};

  dadosOriginais.forEach(item=>{

    const ano =
      item["EXERCÍCIO (ANO)"];

    if(!cacheAno[ano]){

      cacheAno[ano] = [];

    }

    cacheAno[ano].push(item);

  });

}

/* =========================================
   CARREGA ANOS
========================================= */

function carregarFiltroAno(){

  const anos = Object.keys(cacheAno)
    .sort((a,b)=>b.localeCompare(a));

  let html =
    '<option value="">Selecione...</option>' +
    '<option value="TODOS">Todos</option>';

  anos.forEach(ano=>{

    html += `
      <option value="${ano}">
        ${ano}
      </option>
    `;

  });

  $("#anoFiltro").html(html);

}

/* =========================================
   FILTROS ENCADEADOS
========================================= */

function atualizarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    $("#inscritoFiltro")
      .prop("disabled",true)
      .html('<option value="">Selecione...</option>');

    $("#valorFiltro")
      .prop("disabled",true)
      .html('<option value="">Selecione...</option>');

    limparTabela();

    return;

  }

  const base =
    ano === "TODOS"
      ? dadosOriginais
      : cacheAno[ano] || [];

  const inscritoAtual =
    $("#inscritoFiltro").val();

  const valorAtual =
    $("#valorFiltro").val();

  /* INSCRITOS */

  const baseInscritos = valorAtual

    ? base.filter(
        x=>x["VALOR"] === valorAtual
      )

    : base;

  const inscritos = [

    ...new Set(

      baseInscritos.map(
        x=>x["NOME DO INSCRITO"]
      )

    )

  ].sort((a,b)=>

    a.localeCompare(
      b,
      "pt-BR",
      {
        sensitivity:"base"
      }
    )

  );

  let htmlInscritos =
    '<option value="">Selecione...</option>';

  inscritos.forEach(v=>{

    htmlInscritos += `
      <option value="${v}">
        ${v}
      </option>
    `;

  });

  $("#inscritoFiltro")
    .html(htmlInscritos)
    .prop("disabled",false);

  if(inscritos.includes(inscritoAtual)){

    $("#inscritoFiltro").val(inscritoAtual);

  }

  /* VALORES */

  const baseValores = inscritoAtual

    ? base.filter(
        x=>
          x["NOME DO INSCRITO"] === inscritoAtual
      )

    : base;

  const valores = [

    ...new Set(

      baseValores.map(
        x=>x["VALOR"]
      )

    )

  ].sort((a,b)=>

    parseMoeda(a) - parseMoeda(b)

  );

  let htmlValores =
    '<option value="">Selecione...</option>';

  valores.forEach(v=>{

    htmlValores += `
      <option value="${v}">
        ${v}
      </option>
    `;

  });

  $("#valorFiltro")
    .html(htmlValores)
    .prop("disabled",false);

  if(valores.includes(valorAtual)){

    $("#valorFiltro").val(valorAtual);

  }

  aplicarFiltros();

}

/* =========================================
   APLICAR FILTROS
========================================= */

function aplicarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    limparTabela();
    return;

  }

  const inscrito =
    $("#inscritoFiltro").val();

  const valor =
    $("#valorFiltro").val();

  let base =

    ano === "TODOS"

      ? dadosOriginais

      : cacheAno[ano] || [];

  if(inscrito){

    base = base.filter(
      x=>
        x["NOME DO INSCRITO"] === inscrito
    );

  }

  if(valor){

    base = base.filter(
      x=>
        x["VALOR"] === valor
    );

  }

  atualizarResumo(base);

  renderTabela(base);

}

/* =========================================
   TOTALIZADOR
========================================= */

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();
    return;

  }

  const total = dados.reduce(

    (acc,item)=>

      acc + parseMoeda(item["VALOR"]),

    0

  );

  $("#totalValor").text(

    "Total: " +
    formatadorMoeda.format(total)

  );

  $("#resumoValores").show();

}

/* =========================================
   TABELA
========================================= */

function renderTabela(dados){

  if(!dados.length){

    limparTabela();
    return;

  }

  const colunas = [

    {
      title:"NOME DO INSCRITO",
      data:"NOME DO INSCRITO"
    },

    {
      title:"EXERCÍCIO (ANO)",
      data:"EXERCÍCIO (ANO)"
    },

    {
      title:"VALOR",
      data:"VALOR"
    }

  ];

  if(tabela){

    tabela.clear();
    tabela.rows.add(dados);
    tabela.draw(false);

    return;

  }

  $("#tabela").show();

  tabela = $("#tabela").DataTable({

    data:dados,
    columns:colunas,

    deferRender:true,

    processing:false,

    scrollX:true,
    scrollY:"55vh",
    scrollCollapse:true,

    paging:true,
    pageLength:10,

    lengthChange:false,

    autoWidth:false,

    order:[[1,"desc"]],

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

}

/* =========================================
   LIMPA TABELA
========================================= */

function limparTabela(){

  $("#tabela").hide();

  $("#resumoValores").hide();

  if(tabela){

    tabela.clear().draw();

  }

}

/* =========================================
   EXPORTAÇÃO
========================================= */

function gerarNomeArquivo(ext){

  const partes = ["divida-ativa"];

  const ano =
    $("#anoFiltro").val();

  const inscrito =
    $("#inscritoFiltro").val();

  if(ano){

    partes.push(ano);

  }

  if(inscrito){

    partes.push(

      inscrito
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/\s+/g,"-")
        .toLowerCase()

    );

  }

  return partes.join("-")+"."+ext;

}

function baixarArquivo(blob,nome){

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download = nome;

  link.click();

}

/* CSV */

$("#btnCsv").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  const csv = Papa.unparse(
    dados,
    {
      delimiter:";"
    }
  );

  baixarArquivo(

    new Blob(
      ["\ufeff"+csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    ),

    gerarNomeArquivo("csv")

  );

});

/* JSON */

$("#btnJson").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  baixarArquivo(

    new Blob(
      [
        JSON.stringify(
          dados,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

});

/* TXT */

$("#btnTxt").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  const txt = dados

    .map(
      x=>Object.values(x).join(" | ")
    )

    .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

});

/* XLSX */

$("#btnXlsx").on("click",()=>{

  if(!tabela) return;

  const dados = tabela
    .rows({search:"applied"})
    .data()
    .toArray();

  const ws =
    XLSX.utils.json_to_sheet(dados);

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Divida Ativa"
  );

  XLSX.writeFile(
    wb,
    gerarNomeArquivo("xlsx")
  );

});

/* =========================================
   EVENTOS
========================================= */

$("#anoFiltro").on(
  "change",
  atualizarFiltros
);

$("#inscritoFiltro").on(
  "change",
  atualizarFiltros
);

$("#valorFiltro").on(
  "change",
  atualizarFiltros
);

$("#btnLimpar").on(
  "click",
  ()=>location.reload()
);

$("#lengthSelector").on(
  "change",
  function(){

    if(tabela){

      tabela.page
        .len(parseInt(this.value))
        .draw();

    }

  }
);

</script>

</body>
</html>
