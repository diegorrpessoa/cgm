<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Dívida Ativa</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{
  background-color:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
}

.form-select-sm,
table{
  font-size:.7rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

.text-end{
  text-align:right !important;
}

/* PAGINAÇÃO */

.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background-color:#e9ecef !important;
  border:1px solid #dee2e6 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background-color:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

/* BOTÕES */

.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

/* ATUALIZAÇÃO */

#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

/* SPINNER */

.spinner-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
  z-index:9999;
  background-color:rgba(255,255,255,.9);
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

/* TOTALIZADOR */

.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  display:inline-block;
  margin-right:15px;
  font-weight:600;
}

/* REGISTROS */

#lengthSelectorContainer{
  font-size:.7rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  margin-bottom:6px;
}

#lengthSelector{
  width:80px;
  font-size:.7rem;
}

/* FILTROS DESABILITADOS */

.form-select:disabled{
  background-color:#adb5bd !important;
  border-color:#868e96 !important;
  color:#495057 !important;
  cursor:not-allowed !important;
  opacity:1 !important;
}

</style>
</head>

<body>

<!-- SPINNER -->
<div id="spinnerCsv" class="spinner-overlay">

  <div class="spinner-border text-primary"></div>

  <div class="spinner-text">
    Carregando base de dados...
  </div>

</div>

<div class="container-fluid mt-3">

  <!-- ATUALIZAÇÃO -->
  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <!-- FILTROS -->
  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">

      <label>Exercício (Ano) *</label>

      <select
        id="anoFiltro"
        class="form-select form-select-sm"
      ></select>

    </div>

    <div class="col-sm-5">

      <label>Nome do Inscrito</label>

      <select
        id="inscritoFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>

    </div>

    <div class="col-sm-3">

      <label>Valor</label>

      <select
        id="valorFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>

    </div>

  </div>

  <!-- TOTAL -->
  <div
    class="totalizadores mb-2"
    id="resumoValores"
    style="display:none;"
  >

    <span id="totalValor">
      Total: R$ 0,00
    </span>

  </div>

  <!-- BOTÕES -->
  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="export-group btn-group">

      <button
        id="btnCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="btnXlsx"
        class="btn btn-outline-secondary btn-sm"
      >
        XLSX
      </button>

      <button
        id="btnTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

      <button
        id="btnJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

    </div>

  </div>

  <!-- REGISTROS -->
  <div id="lengthSelectorContainer">

    <label>
      Registros por página:
    </label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm"
    >

      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>

    </select>

  </div>

  <!-- TABELA -->
  <div class="table-responsive">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm w-100"
      style="display:none;"
    ></table>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

const urlCSV =
"https://docs.google.com/spreadsheets/d/10C3yDnARmQs6Ydh39PK1XGNW3cFylcWLL9rd6_2WyIs/export?format=csv&gid=1659253784";

const campos = {

  ano:"EXERCÍCIO (ANO)",
  inscrito:"NOME DO INSCRITO",
  valor:"VALOR"

};

const ordem = [

  "ano",
  "inscrito",
  "valor"

];

/* CACHE ULTRA RÁPIDO */

const cacheFiltros = {};

/* CARREGAR CSV */

Papa.parse(urlCSV,{

  download:true,

  header:true,

  skipEmptyLines:true,

  worker:true,

  complete:function(resultado){

    if(
      !resultado ||
      !resultado.data ||
      !resultado.data.length
    ){

      $("#spinnerCsv").hide();

      alert(
        "Não foi possível carregar a base de dados."
      );

      return;

    }

    const primeiraLinha =
      resultado.data[0];

    const dataAtualizacao =

      primeiraLinha["ATUALIZACAO"] ||
      primeiraLinha["ATUALIZAÇÃO"] ||
      primeiraLinha["Atualizacao"] ||
      primeiraLinha["Atualização"] ||
      primeiraLinha["D"] ||
      primeiraLinha["D2"] ||
      "";

    if(dataAtualizacao){

      $("#indicadorAtualizacao").html(
        `Dados atualizados em: <b>${dataAtualizacao}</b>`
      );

    }

    dadosOriginais = resultado.data

      .filter(r=>

        r["EXERCÍCIO (ANO)"]

      )

      .map(r=>({

        "NOME DO INSCRITO":
          r["NOME DO INSCRITO"],

        "EXERCÍCIO (ANO)":
          r["EXERCÍCIO (ANO)"],

        "VALOR":
          r["VALOR"]

      }));

    carregarFiltroAno();

    inicializarEventos();

    $("#spinnerCsv").fadeOut(200);

  },

  error:function(){

    $("#spinnerCsv").hide();

    alert(
      "Erro ao carregar a base CSV."
    );

  }

});

/* FILTRO ANO */

function carregarFiltroAno(){

  const seletor =
    $("#anoFiltro");

  seletor.empty();

  seletor.append(
    '<option value="">Selecione...</option>'
  );

  seletor.append(
    '<option value="TODOS">Todos</option>'
  );

  const anos = [

    ...new Set(

      dadosOriginais.map(
        r=>r[campos.ano]
      )

    )

  ].sort((a,b)=>b-a);

  anos.forEach(v=>{

    seletor.append(
      `<option value="${v}">${v}</option>`
    );

  });

}

/* EVENTOS */

function inicializarEventos(){

  $("#anoFiltro").on(
    "change",
    atualizarTudo
  );

  $("#inscritoFiltro").on(
    "change",
    atualizarTudo
  );

  $("#valorFiltro").on(
    "change",
    atualizarTudo
  );

  $("#btnLimpar").on(
    "click",
    limparFiltros
  );

  $("#lengthSelector").on(
    "change",
    function(){

      if(tabela){

        tabela.page
          .len(parseInt(this.value))
          .draw(false);

      }

    }
  );

  $("#btnCsv").on(
    "click",
    exportarCsv
  );

  $("#btnJson").on(
    "click",
    exportarJson
  );

  $("#btnTxt").on(
    "click",
    exportarTxt
  );

  $("#btnXlsx").on(
    "click",
    exportarXlsx
  );

}

/* BASE FILTRADA */

function obterBaseFiltrada(){

  const ano =
    $("#anoFiltro").val();

  const inscrito =
    $("#inscritoFiltro").val();

  const valor =
    $("#valorFiltro").val();

  return dadosOriginais.filter(r=>{

    if(
      ano &&
      ano !== "TODOS" &&
      r[campos.ano] !== ano
    ){
      return false;
    }

    if(
      inscrito &&
      r[campos.inscrito] !== inscrito
    ){
      return false;
    }

    if(
      valor &&
      r[campos.valor] !== valor
    ){
      return false;
    }

    return true;

  });

}

/* FILTROS ENCADEADOS */

function atualizarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    $("#inscritoFiltro")
      .html(
        '<option value="">Selecione...</option>'
      )
      .prop("disabled",true);

    $("#valorFiltro")
      .html(
        '<option value="">Selecione...</option>'
      )
      .prop("disabled",true);

    return;

  }

  const cacheKey =
    JSON.stringify({

      ano:
        $("#anoFiltro").val(),

      inscrito:
        $("#inscritoFiltro").val()

    });

  let base;

  if(cacheFiltros[cacheKey]){

    base = cacheFiltros[cacheKey];

  }else{

    base = dadosOriginais.filter(r=>{

      if(
        ano !== "TODOS" &&
        r[campos.ano] !== ano
      ){
        return false;
      }

      const inscritoAtual =
        $("#inscritoFiltro").val();

      if(
        inscritoAtual &&
        r[campos.inscrito] !== inscritoAtual
      ){
        return false;
      }

      return true;

    });

    cacheFiltros[cacheKey] = base;

  }

  popularFiltro(
    "inscritoFiltro",
    campos.inscrito,
    base,
    true
  );

  popularFiltro(
    "valorFiltro",
    campos.valor,
    base,
    false,
    true
  );

}

/* POPULAR FILTRO */

function popularFiltro(
  id,
  campo,
  dados,
  habilitar=true,
  ordenarMoeda=false
){

  const select =
    $("#"+id);

  const valorAtual =
    select.val();

  let valores = [

    ...new Set(

      dados
        .map(r=>r[campo])
        .filter(Boolean)

    )

  ];

  if(ordenarMoeda){

    valores.sort(
      (a,b)=>
        parseMoeda(a) -
        parseMoeda(b)
    );

  }else{

    valores.sort((a,b)=>

      a.localeCompare(
        b,
        "pt-BR",
        {
          sensitivity:"base"
        }
      )

    );

  }

  let html =
    '<option value="">Selecione...</option>';

  valores.forEach(v=>{

    html += `
      <option value="${v}">
        ${v}
      </option>
    `;

  });

  select.html(html);

  if(valores.includes(valorAtual)){

    select.val(valorAtual);

  }

  select.prop(
    "disabled",
    !habilitar
  );

}

/* RESUMO */

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();

    return;

  }

  let total = 0;

  dados.forEach(r=>{

    total += parseMoeda(
      r["VALOR"]
    );

  });

  $("#totalValor").text(

    "Total: " +

    total.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    )

  );

  $("#resumoValores").show();

}

/* TABELA */

function renderTabela(dados){

  if(!dados.length){

    $("#tabela").hide();

    if(tabela){

      tabela.clear().draw();

    }

    return;

  }

  $("#tabela").show();

  const colunas = [

    {
      title:"NOME DO INSCRITO",
      data:"NOME DO INSCRITO"
    },

    {
      title:"EXERCÍCIO (ANO)",
      data:"EXERCÍCIO (ANO)",
      className:"text-end"
    },

    {
      title:"VALOR",
      data:"VALOR",
      className:"text-end"
    }

  ];

  if(tabela){

    tabela.clear();

    tabela.rows.add(dados);

    tabela.draw(false);

    return;

  }

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:colunas,

    deferRender:true,

    processing:false,

    scrollX:true,

    scrollY:"55vh",

    scrollCollapse:true,

    paging:true,

    pageLength:10,

    lengthChange:false,

    ordering:true,

    searching:true,

    autoWidth:false,

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

}

/* APLICAR */

function atualizarTudo(){

  atualizarFiltros();

  const dados =
    obterBaseFiltrada();

  atualizarResumo(dados);

  renderTabela(dados);

}

/* LIMPAR */

function limparFiltros(){

  $("#anoFiltro").val("");

  $("#inscritoFiltro")
    .html(
      '<option value="">Selecione...</option>'
    )
    .prop("disabled",true);

  $("#valorFiltro")
    .html(
      '<option value="">Selecione...</option>'
    )
    .prop("disabled",true);

  $("#resumoValores").hide();

  if(tabela){

    tabela.clear().draw();

  }

  $("#tabela").hide();

}

/* MOEDA */

function parseMoeda(valor){

  if(!valor) return 0;

  return parseFloat(

    valor
      .toString()
      .replace(/[^\d,-]/g,"")
      .replace(/\./g,"")
      .replace(",", ".")

  ) || 0;

}

/* NOME ARQUIVO */

function gerarNomeArquivo(ext){

  const partes = [

    "divida-ativa"

  ];

  ordem.forEach(f=>{

    const valor =
      $("#"+f+"Filtro").val();

    if(
      valor &&
      valor !== "TODOS"
    ){

      partes.push(

        valor
          .toString()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/\s+/g,"-")
          .replace(/[^\w-]/g,"")

      );

    }

  });

  return partes.join("-")+"."+ext;

}

/* DOWNLOAD */

function baixarArquivo(blob,nome){

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download = nome;

  link.click();

}

/* CSV */

function exportarCsv(){

  if(!tabela) return;

  const dados =
    tabela.rows({search:"applied"})
      .data()
      .toArray();

  const csv =
    Papa.unparse(dados,{
      delimiter:";"
    });

  baixarArquivo(

    new Blob(
      ["\ufeff"+csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    ),

    gerarNomeArquivo("csv")

  );

}

/* JSON */

function exportarJson(){

  if(!tabela) return;

  const dados =
    tabela.rows({search:"applied"})
      .data()
      .toArray();

  baixarArquivo(

    new Blob(
      [
        JSON.stringify(
          dados,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

}

/* TXT */

function exportarTxt(){

  if(!tabela) return;

  const dados =
    tabela.rows({search:"applied"})
      .data()
      .toArray();

  const txt = dados
    .map(o=>
      Object.values(o).join(" | ")
    )
    .join("\n");

  baixarArquivo(

    new Blob(
      [txt],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

}

/* XLSX */

function exportarXlsx(){

  if(!tabela) return;

  const dados =
    tabela.rows({search:"applied"})
      .data()
      .toArray();

  const ws =
    XLSX.utils.json_to_sheet(dados);

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Dívida Ativa"
  );

  XLSX.writeFile(
    wb,
    gerarNomeArquivo("xlsx")
  );

}

</script>

</body>
</html>
