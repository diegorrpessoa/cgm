<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Painel de Dívida Ativa</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css"/>

<style>

body{
  background:#f8f9fa;
}

.dataTables_filter{
  display:none;
}

label{
  font-weight:600;
  font-size:.72rem !important;
  color:#343a40;
  margin-bottom:2px;
}

.form-select-sm,
table{
  font-size:.7rem !important;
}

table.dataTable td,
table.dataTable th{
  white-space:nowrap;
}

#indicadorAtualizacao{
  font-size:.65rem;
  color:#6c757d;
  text-align:right;
  margin-bottom:8px;
}

.totalizadores{
  font-size:.7rem;
  background:#fff;
  padding:5px 10px;
  border:1px solid #dee2e6;
  border-radius:4px;
}

.totalizadores span{
  display:inline-block;
  margin-right:15px;
  font-weight:600;
}

.export-group .btn{
  font-size:.7rem;
  padding:4px 8px;
}

#lengthSelectorContainer{
  font-size:.7rem;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  margin-bottom:6px;
}

#lengthSelector{
  width:80px;
  font-size:.7rem;
}

.dataTables_wrapper .dataTables_paginate{
  margin-top:.5rem;
  display:flex;
  justify-content:center;
  gap:4px;
}

.dataTables_wrapper .dataTables_paginate .paginate_button{
  padding:4px 8px !important;
  font-size:.65rem !important;
  border-radius:6px !important;
  background:#e9ecef !important;
  border:1px solid #dee2e6 !important;
}

.dataTables_wrapper .dataTables_paginate .paginate_button.current{
  background:#0d6efd !important;
  color:#fff !important;
  font-weight:bold !important;
}

.spinner-overlay{
  position:fixed;
  inset:0;
  width:100%;
  height:100vh;
  background:rgba(255,255,255,.92);
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:60px;
}

.spinner-border{
  width:2rem;
  height:2rem;
}

.spinner-text{
  font-size:.9rem;
  margin-top:5px;
}

.form-select:disabled{
  background:#adb5bd !important;
  border-color:#868e96 !important;
  color:#495057 !important;
  opacity:1 !important;
  cursor:not-allowed !important;
}

</style>

</head>

<body>

<div id="spinnerCsv" class="spinner-overlay">
  <div class="spinner-border text-primary"></div>
  <div class="spinner-text">
    Carregando base de dados...
  </div>
</div>

<div class="container-fluid mt-3">

  <div id="indicadorAtualizacao">
    Dados atualizados em...
  </div>

  <div class="row gx-2 gy-2 mb-3">

    <div class="col-sm-2">
      <label>Exercício (Ano) *</label>

      <select
        id="anoFiltro"
        class="form-select form-select-sm"
      ></select>
    </div>

    <div class="col-sm-4">
      <label>Nome do Inscrito</label>

      <select
        id="inscritoFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>
    </div>

    <div class="col-sm-3">
      <label>Valor</label>

      <select
        id="valorFiltro"
        class="form-select form-select-sm"
        disabled
      ></select>
    </div>

  </div>

  <div
    class="totalizadores mb-2"
    id="resumoValores"
    style="display:none;"
  >
    <span id="totalValor">
      Total: R$ 0,00
    </span>
  </div>

  <div class="d-flex justify-content-between mb-2">

    <button
      id="btnLimpar"
      class="btn btn-outline-primary btn-sm"
    >
      Limpar Filtros
    </button>

    <div class="export-group btn-group">

      <button
        id="btnCsv"
        class="btn btn-outline-secondary btn-sm"
      >
        CSV
      </button>

      <button
        id="btnXlsx"
        class="btn btn-outline-secondary btn-sm"
      >
        XLSX
      </button>

      <button
        id="btnTxt"
        class="btn btn-outline-secondary btn-sm"
      >
        TXT
      </button>

      <button
        id="btnJson"
        class="btn btn-outline-secondary btn-sm"
      >
        JSON
      </button>

    </div>

  </div>

  <div id="lengthSelectorContainer">

    <label>
      Registros por página:
    </label>

    <select
      id="lengthSelector"
      class="form-select form-select-sm"
    >
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>

  </div>

  <div class="table-responsive">

    <table
      id="tabela"
      class="table table-bordered table-striped table-sm w-100"
      style="display:none;"
    ></table>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

let tabela = null;

let dadosOriginais = [];

const urlCSV =
"https://docs.google.com/spreadsheets/d/10C3yDnARmQs6Ydh39PK1XGNW3cFylcWLL9rd6_2WyIs/export?format=csv&gid=1659253784";

const campos = {

  inscrito:"NOME DO INSCRITO",
  ano:"EXERCÍCIO (ANO)",
  valor:"VALOR"

};

const ordem = [

  "ano",
  "inscrito",
  "valor"

];

/* =========================
   NORMALIZAÇÃO
========================= */

function limparTexto(v){

  if(v === null || v === undefined){
    return "";
  }

  return v
    .toString()
    .replace(/^"+|"+$/g,"")
    .trim();

}

function parseMoeda(valor){

  if(!valor){
    return 0;
  }

  return parseFloat(

    limparTexto(valor)
      .replace(/[^\d,.-]/g,"")
      .replace(/\./g,"")
      .replace(",", ".")

  ) || 0;

}

function formatarMoeda(valor){

  return parseMoeda(valor)
    .toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL",
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}

/* =========================
   CARREGAR CSV
========================= */

Papa.parse(urlCSV,{

  download:true,

  header:true,

  skipEmptyLines:true,

  fastMode:true,

  complete:(resultado)=>{

    const linhas = resultado.data || [];

    if(!linhas.length){

      $("#spinnerCsv").hide();

      alert("Base de dados vazia.");

      return;

    }

    /* DATA ATUALIZAÇÃO = E2 */
    const primeiraLinha = linhas[0];

    const dataAtualizacao =

      limparTexto(
        primeiraLinha["ATUALIZACAO"]
      ) ||

      limparTexto(
        primeiraLinha["ATUALIZAÇÃO"]
      ) ||

      limparTexto(
        primeiraLinha["Atualizacao"]
      ) ||

      limparTexto(
        primeiraLinha["Atualização"]
      ) ||

      limparTexto(
        primeiraLinha["E2"]
      );

    if(dataAtualizacao){

      $("#indicadorAtualizacao").html(
        `Dados atualizados em: <b>${dataAtualizacao}</b>`
      );

    }

    dadosOriginais = linhas

      .filter(r=>

        limparTexto(
          r[campos.ano]
        )

      )

      .map(r=>({

        "NOME DO INSCRITO":
          limparTexto(
            r["NOME DO INSCRITO"]
          ),

        "EXERCÍCIO (ANO)":
          limparTexto(
            r["EXERCÍCIO (ANO)"]
          ),

        "VALOR":
          formatarMoeda(
            r["VALOR"]
          )

      }));

    carregarFiltroAno();

    inicializarEventos();

    $("#spinnerCsv").fadeOut(200);

  },

  error:()=>{

    $("#spinnerCsv").hide();

    alert(
      "Não foi possível carregar a base de dados."
    );

  }

});

/* =========================
   FILTROS
========================= */

function carregarFiltroAno(){

  const select = $("#anoFiltro");

  const anos = [

    ...new Set(

      dadosOriginais.map(
        r=>r[campos.ano]
      )

    )

  ].sort((a,b)=>b-a);

  select.html(
    '<option value="">Selecione...</option>'
  );

  anos.forEach(v=>{

    select.append(
      `<option value="${v}">${v}</option>`
    );

  });

}

function popularFiltro(id,valores){

  const select = $("#"+id);

  const atual = select.val();

  select.empty();

  select.append(
    '<option value="">Selecione...</option>'
  );

  valores.forEach(v=>{

    select.append(
      `<option value="${v}">${v}</option>`
    );

  });

  if(valores.includes(atual)){

    select.val(atual);

  }

}

function atualizarFiltros(){

  const ano = $("#anoFiltro").val();

  if(!ano){

    $("#inscritoFiltro,#valorFiltro")
      .prop("disabled",true)
      .html(
        '<option value="">Selecione...</option>'
      );

    renderTabela([]);

    atualizarResumo([]);

    return;

  }

  $("#inscritoFiltro,#valorFiltro")
    .prop("disabled",false);

  const inscritoAtual =
    $("#inscritoFiltro").val();

  let baseInscrito = dadosOriginais.filter(r=>

    r[campos.ano] === ano

  );

  const valoresInscrito = [

    ...new Set(

      baseInscrito.map(
        r=>r[campos.inscrito]
      )

    )

  ].sort((a,b)=>

    a.localeCompare(
      b,
      "pt-BR",
      {sensitivity:"base"}
    )

  );

  popularFiltro(
    "inscritoFiltro",
    valoresInscrito
  );

  let baseValor = dadosOriginais.filter(r=>{

    if(r[campos.ano] !== ano){
      return false;
    }

    if(
      inscritoAtual &&
      r[campos.inscrito] !== inscritoAtual
    ){
      return false;
    }

    return true;

  });

  const valoresValor = [

    ...new Set(

      baseValor.map(
        r=>r[campos.valor]
      )

    )

  ].sort((a,b)=>

    parseMoeda(a) -
    parseMoeda(b)

  );

  popularFiltro(
    "valorFiltro",
    valoresValor
  );

  aplicarFiltros();

}

function aplicarFiltros(){

  const ano =
    $("#anoFiltro").val();

  if(!ano){

    renderTabela([]);

    atualizarResumo([]);

    return;
  }

  const inscrito =
    $("#inscritoFiltro").val();

  const valor =
    $("#valorFiltro").val();

  const dados = dadosOriginais.filter(r=>{

    if(r[campos.ano] !== ano){
      return false;
    }

    if(
      inscrito &&
      r[campos.inscrito] !== inscrito
    ){
      return false;
    }

    if(
      valor &&
      r[campos.valor] !== valor
    ){
      return false;
    }

    return true;

  });

  atualizarResumo(dados);

  renderTabela(dados);

}

/* =========================
   TABELA
========================= */

function renderTabela(dados){

  if(tabela){

    tabela.destroy();

    $("#tabela").empty();
  }

  if(!dados.length){

    $("#tabela").hide();

    return;
  }

  $("#tabela").show();

  tabela = $("#tabela").DataTable({

    data:dados,

    columns:[

      {
        title:"NOME DO INSCRITO",
        data:"NOME DO INSCRITO"
      },

      {
        title:"EXERCÍCIO (ANO)",
        data:"EXERCÍCIO (ANO)"
      },

      {
        title:"VALOR",
        data:"VALOR",
        className:"text-end"
      }

    ],

    deferRender:true,

    processing:false,

    pageLength:parseInt(
      $("#lengthSelector").val()
    ),

    lengthChange:false,

    searching:true,

    ordering:true,

    autoWidth:false,

    scrollX:true,

    scrollY:"55vh",

    scrollCollapse:true,

    language:{
      url:"https://cdn.datatables.net/plug-ins/1.13.4/i18n/pt-BR.json"
    }

  });

}

/* =========================
   RESUMO
========================= */

function atualizarResumo(dados){

  if(!dados.length){

    $("#resumoValores").hide();

    return;
  }

  let total = 0;

  dados.forEach(r=>{

    total += parseMoeda(
      r["VALOR"]
    );

  });

  $("#totalValor").text(

    "Total: " +

    total.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL",
        minimumFractionDigits:2
      }
    )

  );

  $("#resumoValores").show();

}

/* =========================
   EVENTOS
========================= */

function inicializarEventos(){

  $("#anoFiltro").on(
    "change",
    atualizarFiltros
  );

  $("#inscritoFiltro").on(
    "change",
    atualizarFiltros
  );

  $("#valorFiltro").on(
    "change",
    aplicarFiltros
  );

  $("#lengthSelector").on(
    "change",
    function(){

      if(tabela){

        tabela.page
          .len(this.value)
          .draw();

      }

    }
  );

  $("#btnLimpar").on(
    "click",
    ()=>location.reload()
  );

  $("#btnCsv").on(
    "click",
    exportarCSV
  );

  $("#btnJson").on(
    "click",
    exportarJSON
  );

  $("#btnTxt").on(
    "click",
    exportarTXT
  );

  $("#btnXlsx").on(
    "click",
    exportarXLSX
  );

}

/* =========================
   EXPORTAÇÃO
========================= */

function gerarNomeArquivo(ext){

  const partes = ["divida-ativa"];

  ordem.forEach(f=>{

    const valor =
      $("#"+f+"Filtro").val();

    if(valor){

      partes.push(

        valor
          .toString()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .replace(/[^\w\s-]/g,"")
          .trim()
          .replace(/\s+/g,"-")
          .toLowerCase()

      );

    }

  });

  return partes.join("-")+"."+ext;

}

function baixarArquivo(blob,nome){

  const link =
    document.createElement("a");

  link.href =
    URL.createObjectURL(blob);

  link.download = nome;

  link.click();

}

function obterDadosTabela(){

  if(!tabela){
    return [];
  }

  return tabela
    .rows({search:"applied"})
    .data()
    .toArray();

}

function exportarCSV(){

  const dados =
    obterDadosTabela();

  if(!dados.length){
    return;
  }

  const csv = Papa.unparse(
    dados,
    {
      delimiter:";"
    }
  );

  baixarArquivo(

    new Blob(
      ["\ufeff"+csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    ),

    gerarNomeArquivo("csv")

  );

}

function exportarJSON(){

  const dados =
    obterDadosTabela();

  if(!dados.length){
    return;
  }

  baixarArquivo(

    new Blob(
      [
        JSON.stringify(
          dados,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    ),

    gerarNomeArquivo("json")

  );

}

function exportarTXT(){

  const dados =
    obterDadosTabela();

  if(!dados.length){
    return;
  }

  const linhas = dados.map(r=>

    Object.values(r).join(" | ")

  );

  baixarArquivo(

    new Blob(
      [linhas.join("\n")],
      {
        type:"text/plain"
      }
    ),

    gerarNomeArquivo("txt")

  );

}

function exportarXLSX(){

  const dados =
    obterDadosTabela();

  if(!dados.length){
    return;
  }

  const ws =
    XLSX.utils.json_to_sheet(dados);

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Dívida Ativa"
  );

  XLSX.writeFile(
    wb,
    gerarNomeArquivo("xlsx")
  );

}

</script>

</body>
</html>
